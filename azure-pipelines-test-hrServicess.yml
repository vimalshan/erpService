# =============================================================================
# TEST PIPELINE — hrServicess  (12 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · hrServicess · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - alerts-notifications-service
      - compensation-benefits-service
      - employee-management-service
      - employee-relations-service
      - employee-transactions-service
      - exit-management-service
      - organization-structure-service
      - recruitment-service
      - time-attendance-service
      - training-development-service
      - user-security-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (same agent — images stay in local docker) ────────────────
  - stage: BuildAndPush
    displayName: 'Build & Push · hrServicess'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                echo "##[error]Go to: Pipeline → Edit → Variables → New variable"
                echo "##[error]  Name: GITHUB_TOKEN"
                echo "##[error]  Value: <your GitHub PAT with write:packages scope>"
                echo "##[error]  Check 'Keep this value secret'"
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                echo "##[error]Please regenerate: GitHub → Settings → Developer settings → Personal access tokens"
                echo "##[error]Required scopes: write:packages, read:packages"
                exit 1
              fi
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              build_svc() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"
                fi
              }
              build_svc 'api-gateway' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/ApiGateway.Dockerfile'
              build_svc 'alerts-notifications-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/AlertsNotifications.Dockerfile'
              build_svc 'compensation-benefits-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/CompensationBenefits.Dockerfile'
              build_svc 'employee-management-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeManagement.Dockerfile'
              build_svc 'employee-relations-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeRelations.Dockerfile'
              build_svc 'employee-transactions-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeTransactions.Dockerfile'
              build_svc 'exit-management-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/ExitManagement.Dockerfile'
              build_svc 'organization-structure-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/OrganizationStructure.Dockerfile'
              build_svc 'recruitment-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/Recruitment.Dockerfile'
              build_svc 'time-attendance-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/TimeAttendance.Dockerfile'
              build_svc 'training-development-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/TrainingDevelopment.Dockerfile'
              build_svc 'user-security-service' 'src/Services/hrServicess' 'src/Services/hrServicess/deployment/Dockerfiles/UserSecurity.Dockerfile'
            displayName: 'docker build all selected services'

          - script: |
              set -e
              push_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                fi
              }
              push_svc 'api-gateway'
              push_svc 'alerts-notifications-service'
              push_svc 'compensation-benefits-service'
              push_svc 'employee-management-service'
              push_svc 'employee-relations-service'
              push_svc 'employee-transactions-service'
              push_svc 'exit-management-service'
              push_svc 'organization-structure-service'
              push_svc 'recruitment-service'
              push_svc 'time-attendance-service'
              push_svc 'training-development-service'
              push_svc 'user-security-service'
            displayName: 'docker push all selected services'

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · hrServicess'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'alerts-notifications-service'
              verify_svc 'compensation-benefits-service'
              verify_svc 'employee-management-service'
              verify_svc 'employee-relations-service'
              verify_svc 'employee-transactions-service'
              verify_svc 'exit-management-service'
              verify_svc 'organization-structure-service'
              verify_svc 'recruitment-service'
              verify_svc 'time-attendance-service'
              verify_svc 'training-development-service'
              verify_svc 'user-security-service'
            displayName: 'Pull & verify all selected images'
