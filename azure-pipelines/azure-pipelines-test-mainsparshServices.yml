# =============================================================================
# TEST PIPELINE — mainsparshServices  (15 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · mainsparshServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - approval-service
      - booking-service
      - community-service
      - compensation-service
      - groupmanagement-service
      - location-service
      - meeting-service
      - proxy-service
      - reimbursement-service
      - stipend-service
      - timesheet-service
      - transaction-service
      - usermanagement-service
      - websitecontent-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · mainsparshServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/mainsparshServices/apiGateway' 'src/Services/mainsparshServices/apiGateway/Dockerfile'
              build_and_push 'approval-service' 'src/Services/mainsparshServices/approvalServices' 'src/Services/mainsparshServices/approvalServices/Dockerfile'
              build_and_push 'booking-service' 'src/Services/mainsparshServices/bookingServices' 'src/Services/mainsparshServices/bookingServices/Dockerfile'
              build_and_push 'community-service' 'src/Services/mainsparshServices/communityServices' 'src/Services/mainsparshServices/communityServices/Dockerfile'
              build_and_push 'compensation-service' 'src/Services/mainsparshServices/compensationServices' 'src/Services/mainsparshServices/compensationServices/Dockerfile'
              build_and_push 'groupmanagement-service' 'src/Services/mainsparshServices/groupmanagementServices' 'src/Services/mainsparshServices/groupmanagementServices/Dockerfile'
              build_and_push 'location-service' 'src/Services/mainsparshServices/locationServices' 'src/Services/mainsparshServices/locationServices/Dockerfile'
              build_and_push 'meeting-service' 'src/Services/mainsparshServices/meetingServices' 'src/Services/mainsparshServices/meetingServices/Dockerfile'
              build_and_push 'proxy-service' 'src/Services/mainsparshServices/proxyServices' 'src/Services/mainsparshServices/proxyServices/Dockerfile'
              build_and_push 'reimbursement-service' 'src/Services/mainsparshServices/reimbursementServices' 'src/Services/mainsparshServices/reimbursementServices/Dockerfile'
              build_and_push 'stipend-service' 'src/Services/mainsparshServices/stipendservices' 'src/Services/mainsparshServices/stipendservices/Dockerfile'
              build_and_push 'timesheet-service' 'src/Services/mainsparshServices/timesheetServices' 'src/Services/mainsparshServices/timesheetServices/Dockerfile'
              build_and_push 'transaction-service' 'src/Services/mainsparshServices/transactionServices' 'src/Services/mainsparshServices/transactionServices/Dockerfile'
              build_and_push 'usermanagement-service' 'src/Services/mainsparshServices/usermanagementServices' 'src/Services/mainsparshServices/usermanagementServices/Dockerfile'
              build_and_push 'websitecontent-service' 'src/Services/mainsparshServices/websitecontentServices' 'src/Services/mainsparshServices/websitecontentServices/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · mainsparshServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'approval-service'
              verify_svc 'booking-service'
              verify_svc 'community-service'
              verify_svc 'compensation-service'
              verify_svc 'groupmanagement-service'
              verify_svc 'location-service'
              verify_svc 'meeting-service'
              verify_svc 'proxy-service'
              verify_svc 'reimbursement-service'
              verify_svc 'stipend-service'
              verify_svc 'timesheet-service'
              verify_svc 'transaction-service'
              verify_svc 'usermanagement-service'
              verify_svc 'websitecontent-service'
            displayName: 'Pull & verify all selected images'
