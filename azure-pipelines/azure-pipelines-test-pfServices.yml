# =============================================================================
# TEST PIPELINE — pfServices  (11 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · pfServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - accounting-service
      - bank-service
      - contribution-service
      - investment-service
      - loan-service
      - masterdata-service
      - member-service
      - pf-transaction-service
      - settlement-service
      - trust-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · pfServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/pfServices/apiGateway' 'src/Services/pfServices/apiGateway/Dockerfile'
              build_and_push 'accounting-service' 'src/Services/pfServices/accountingServices' 'src/Services/pfServices/accountingServices/Dockerfile'
              build_and_push 'bank-service' 'src/Services/pfServices/bankServices/BankService' 'src/Services/pfServices/bankServices/BankService/Dockerfile'
              build_and_push 'contribution-service' 'src/Services/pfServices/contributionServices/ContributionService' 'src/Services/pfServices/contributionServices/ContributionService/Dockerfile'
              build_and_push 'investment-service' 'src/Services/pfServices/investmentServices/InvestmentService' 'src/Services/pfServices/investmentServices/InvestmentService/Dockerfile'
              build_and_push 'loan-service' 'src/Services/pfServices/loanServices' 'src/Services/pfServices/loanServices/Dockerfile'
              build_and_push 'masterdata-service' 'src/Services/pfServices/masterdataServices/MasterDataService' 'src/Services/pfServices/masterdataServices/MasterDataService/Dockerfile'
              build_and_push 'member-service' 'src/Services/pfServices/memberServices' 'src/Services/pfServices/memberServices/Dockerfile'
              build_and_push 'pf-transaction-service' 'src/Services/pfServices/pftransactionalServices' 'src/Services/pfServices/pftransactionalServices/Dockerfile'
              build_and_push 'settlement-service' 'src/Services/pfServices/settlementServices' 'src/Services/pfServices/settlementServices/Dockerfile'
              build_and_push 'trust-service' 'src/Services/pfServices/trustServices/TrustService' 'src/Services/pfServices/trustServices/TrustService/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · pfServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'accounting-service'
              verify_svc 'bank-service'
              verify_svc 'contribution-service'
              verify_svc 'investment-service'
              verify_svc 'loan-service'
              verify_svc 'masterdata-service'
              verify_svc 'member-service'
              verify_svc 'pf-transaction-service'
              verify_svc 'settlement-service'
              verify_svc 'trust-service'
            displayName: 'Pull & verify all selected images'
