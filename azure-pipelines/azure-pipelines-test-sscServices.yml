# =============================================================================
# TEST PIPELINE — sscServices  (13 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · sscServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - approvalgroup-service
      - batchandenvelope-service
      - categoryandvendor-service
      - clubmembership-service
      - fillingandarchive-service
      - hrdocument-service
      - integration-service
      - invoiceprocessing-service
      - masterdata-service
      - menuandsecurity-service
      - menu-service
      - ssc-transaction-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · sscServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/sscServices/apigateway' 'src/Services/sscServices/apigateway/Dockerfile'
              build_and_push 'approvalgroup-service' 'src/Services/sscServices/approvalgroupServices' 'src/Services/sscServices/approvalgroupServices/Dockerfile'
              build_and_push 'batchandenvelope-service' 'src/Services/sscServices/batchandenvelopeServices' 'src/Services/sscServices/batchandenvelopeServices/Dockerfile'
              build_and_push 'categoryandvendor-service' 'src/Services/sscServices/categoryandvendorServices' 'src/Services/sscServices/categoryandvendorServices/Dockerfile'
              build_and_push 'clubmembership-service' 'src/Services/sscServices/clubmembershipServices' 'src/Services/sscServices/clubmembershipServices/Dockerfile'
              build_and_push 'fillingandarchive-service' 'src/Services/sscServices/fillingandarchiveServices' 'src/Services/sscServices/fillingandarchiveServices/Dockerfile'
              build_and_push 'hrdocument-service' 'src/Services/sscServices/hrdocumentServices' 'src/Services/sscServices/hrdocumentServices/Dockerfile'
              build_and_push 'integration-service' 'src/Services/sscServices/integrationServices/IntegrationService' 'src/Services/sscServices/integrationServices/IntegrationService/Dockerfile'
              build_and_push 'invoiceprocessing-service' 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service' 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service/Dockerfile'
              build_and_push 'masterdata-service' 'src/Services/sscServices/masterdataServices/MasterDataService' 'src/Services/sscServices/masterdataServices/MasterDataService/Dockerfile'
              build_and_push 'menuandsecurity-service' 'src/Services/sscServices/menuandsecurityServices' 'src/Services/sscServices/menuandsecurityServices/Dockerfile'
              build_and_push 'menu-service' 'src/Services/sscServices/menuServices/01_USER_MODULE' 'src/Services/sscServices/menuServices/01_USER_MODULE/Dockerfile'
              build_and_push 'ssc-transaction-service' 'src/Services/sscServices/ssctransactionalServices' 'src/Services/sscServices/ssctransactionalServices/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · sscServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'approvalgroup-service'
              verify_svc 'batchandenvelope-service'
              verify_svc 'categoryandvendor-service'
              verify_svc 'clubmembership-service'
              verify_svc 'fillingandarchive-service'
              verify_svc 'hrdocument-service'
              verify_svc 'integration-service'
              verify_svc 'invoiceprocessing-service'
              verify_svc 'masterdata-service'
              verify_svc 'menuandsecurity-service'
              verify_svc 'menu-service'
              verify_svc 'ssc-transaction-service'
            displayName: 'Pull & verify all selected images'
