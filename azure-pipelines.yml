# =============================================================================
# ERP Microservice — Root Azure Pipelines
# Builds & pushes ALL 219 Docker images across 22 modules to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once per Azure DevOps project):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name     : ghcr-service-connection
#   Type     : Other (Docker Registry)
#   Registry : https://ghcr.io
#   Username : <your-github-username>
#   Password : <GitHub PAT with packages:write scope>
# =============================================================================

name: Build & Push All ERP Services

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/adminServices/**
      - src/Services/aimsServices/**
      - src/Services/auditServices/**
      - src/Services/AuthProvider/**
      - src/Services/canteenServices/**
      - src/Services/cashServices/**
      - src/Services/ddServices/**
      - src/Services/healthServices/**
      - src/Services/hrServicess/**
      - src/Services/letServices/**
      - src/Services/loanServices/**
      - src/Services/mainsparshServices/**
      - src/Services/myworkServices/**
      - src/Services/payServices/**
      - src/Services/pfServices/**
      - src/Services/sciServices/**
      - src/Services/sparshServices/**
      - src/Services/sscServices/**
      - src/Services/taskServices/**
      - src/Services/tourServices/**
      - src/Services/travelServices/**
      - src/Services/wmsServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/adminServices/**
      - src/Services/aimsServices/**
      - src/Services/auditServices/**
      - src/Services/AuthProvider/**
      - src/Services/canteenServices/**
      - src/Services/cashServices/**
      - src/Services/ddServices/**
      - src/Services/healthServices/**
      - src/Services/hrServicess/**
      - src/Services/letServices/**
      - src/Services/loanServices/**
      - src/Services/mainsparshServices/**
      - src/Services/myworkServices/**
      - src/Services/payServices/**
      - src/Services/pfServices/**
      - src/Services/sciServices/**
      - src/Services/sparshServices/**
      - src/Services/sscServices/**
      - src/Services/taskServices/**
      - src/Services/tourServices/**
      - src/Services/travelServices/**
      - src/Services/wmsServices/**

# ── Parameters ────────────────────────────────────────────────────────────────
parameters:
  - name: module
    displayName: Module to build
    type: string
    default: all
    values:
      - all
      - adminServices
      - aimsServices
      - auditServices
      - AuthProvider
      - canteenServices
      - cashServices
      - ddServices
      - healthServices
      - hrServicess
      - letServices
      - loanServices
      - mainsparshServices
      - myworkServices
      - payServices
      - pfServices
      - sciServices
      - sparshServices
      - sscServices
      - taskServices
      - tourServices
      - travelServices
      - wmsServices

  - name: service
    displayName: Service to build (within module, or "all")
    type: string
    default: all

  - name: pushImage
    displayName: Push images to GHCR
    type: boolean
    default: true

  - name: smokeTest
    displayName: Run smoke test after push
    type: boolean
    default: false

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:

  # ── BUILD ──────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            adminServices__api_gateway:
