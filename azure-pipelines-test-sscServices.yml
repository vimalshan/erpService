# =============================================================================
# TEST PIPELINE — sscServices  (13 services)
#
# Purpose : Validate Build → Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_ACTOR  – your GitHub username  (vimalshan)
#   GITHUB_TOKEN  – GitHub PAT with packages:write scope  (mark secret)
# =============================================================================

name: TEST · sscServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - approvalgroup-service
      - batchandenvelope-service
      - categoryandvendor-service
      - clubmembership-service
      - fillingandarchive-service
      - hrdocument-service
      - integration-service
      - invoiceprocessing-service
      - masterdata-service
      - menuandsecurity-service
      - menu-service
      - ssc-transaction-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD ──────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build · sscServices'
    jobs:
      - job: BuildImages
        displayName: Build Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -e
              build_svc() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"
                fi
              }
              build_svc 'api-gateway' 'src/Services/sscServices/apigateway' 'src/Services/sscServices/apigateway/Dockerfile'
              build_svc 'approvalgroup-service' 'src/Services/sscServices/approvalgroupServices' 'src/Services/sscServices/approvalgroupServices/Dockerfile'
              build_svc 'batchandenvelope-service' 'src/Services/sscServices/batchandenvelopeServices' 'src/Services/sscServices/batchandenvelopeServices/Dockerfile'
              build_svc 'categoryandvendor-service' 'src/Services/sscServices/categoryandvendorServices' 'src/Services/sscServices/categoryandvendorServices/Dockerfile'
              build_svc 'clubmembership-service' 'src/Services/sscServices/clubmembershipServices' 'src/Services/sscServices/clubmembershipServices/Dockerfile'
              build_svc 'fillingandarchive-service' 'src/Services/sscServices/fillingandarchiveServices' 'src/Services/sscServices/fillingandarchiveServices/Dockerfile'
              build_svc 'hrdocument-service' 'src/Services/sscServices/hrdocumentServices' 'src/Services/sscServices/hrdocumentServices/Dockerfile'
              build_svc 'integration-service' 'src/Services/sscServices/integrationServices/IntegrationService' 'src/Services/sscServices/integrationServices/IntegrationService/Dockerfile'
              build_svc 'invoiceprocessing-service' 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service' 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service/Dockerfile'
              build_svc 'masterdata-service' 'src/Services/sscServices/masterdataServices/MasterDataService' 'src/Services/sscServices/masterdataServices/MasterDataService/Dockerfile'
              build_svc 'menuandsecurity-service' 'src/Services/sscServices/menuandsecurityServices' 'src/Services/sscServices/menuandsecurityServices/Dockerfile'
              build_svc 'menu-service' 'src/Services/sscServices/menuServices/01_USER_MODULE' 'src/Services/sscServices/menuServices/01_USER_MODULE/Dockerfile'
              build_svc 'ssc-transaction-service' 'src/Services/sscServices/ssctransactionalServices' 'src/Services/sscServices/ssctransactionalServices/Dockerfile'
            displayName: 'docker build all selected services'

  # ── PUSH ───────────────────────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push · sscServices → GHCR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushImages
        displayName: Push to GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable (GitHub PAT with write:packages scope)."
                exit 1
              fi
              if [ -z "${GITHUB_ACTOR:-}" ]; then
                echo "##[error]GITHUB_ACTOR is not set. Add it as a pipeline variable (your GitHub username)."
                exit 1
              fi
              echo "Logging in as: $GITHUB_ACTOR"
              echo "Token length: ${#GITHUB_TOKEN} chars"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              echo "GHCR login succeeded."
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              push_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                fi
              }
              push_svc 'api-gateway'
              push_svc 'approvalgroup-service'
              push_svc 'batchandenvelope-service'
              push_svc 'categoryandvendor-service'
              push_svc 'clubmembership-service'
              push_svc 'fillingandarchive-service'
              push_svc 'hrdocument-service'
              push_svc 'integration-service'
              push_svc 'invoiceprocessing-service'
              push_svc 'masterdata-service'
              push_svc 'menuandsecurity-service'
              push_svc 'menu-service'
              push_svc 'ssc-transaction-service'
            displayName: 'docker push all selected services'

  # ── VERIFY ─────────────────────────────────────────────────────────────────
  - stage: Verify
    displayName: 'Verify · sscServices'
    dependsOn: Push
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable (GitHub PAT with write:packages scope)."
                exit 1
              fi
              if [ -z "${GITHUB_ACTOR:-}" ]; then
                echo "##[error]GITHUB_ACTOR is not set. Add it as a pipeline variable (your GitHub username)."
                exit 1
              fi
              echo "Logging in as: $GITHUB_ACTOR"
              echo "Token length: ${#GITHUB_TOKEN} chars"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              echo "GHCR login succeeded."
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'approvalgroup-service'
              verify_svc 'batchandenvelope-service'
              verify_svc 'categoryandvendor-service'
              verify_svc 'clubmembership-service'
              verify_svc 'fillingandarchive-service'
              verify_svc 'hrdocument-service'
              verify_svc 'integration-service'
              verify_svc 'invoiceprocessing-service'
              verify_svc 'masterdata-service'
              verify_svc 'menuandsecurity-service'
              verify_svc 'menu-service'
              verify_svc 'ssc-transaction-service'
            displayName: 'Pull & verify all selected images'
