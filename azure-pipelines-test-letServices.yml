# =============================================================================
# TEST PIPELINE — letServices  (8 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · letServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - course-service
      - development-service
      - leave-service
      - let-transaction-service
      - master-service
      - request-service
      - review-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · letServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{{ parameters.service }}}" = "all" ] || [ "${{{ parameters.service }}}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/letServices/apiGateway' 'src/Services/letServices/apiGateway/Dockerfile'
              build_and_push 'course-service' 'src/Services/letServices/courseServices' 'src/Services/letServices/courseServices/Dockerfile'
              build_and_push 'development-service' 'src/Services/letServices/developmentServices' 'src/Services/letServices/developmentServices/Dockerfile'
              build_and_push 'leave-service' 'src/Services/letServices/leaveServices' 'src/Services/letServices/leaveServices/Dockerfile'
              build_and_push 'let-transaction-service' 'src/Services/letServices/letTransactionServices' 'src/Services/letServices/letTransactionServices/Dockerfile'
              build_and_push 'master-service' 'src/Services/letServices/masterServices' 'src/Services/letServices/masterServices/Dockerfile'
              build_and_push 'request-service' 'src/Services/letServices/requestServices' 'src/Services/letServices/requestServices/Dockerfile'
              build_and_push 'review-service' 'src/Services/letServices/reviewServices' 'src/Services/letServices/reviewServices/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · letServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'course-service'
              verify_svc 'development-service'
              verify_svc 'leave-service'
              verify_svc 'let-transaction-service'
              verify_svc 'master-service'
              verify_svc 'request-service'
              verify_svc 'review-service'
            displayName: 'Pull & verify all selected images'
