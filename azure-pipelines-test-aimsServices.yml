# =============================================================================
# TEST PIPELINE — aimsServices  (11 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · aimsServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - access-service
      - aims-transaction-service
      - attendance-service
      - bus-services
      - calendar-service
      - employee-service
      - groupincentive-service
      - leave-services
      - reference-service
      - visitor-services

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · aimsServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{{ parameters.service }}}" = "all" ] || [ "${{{ parameters.service }}}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/aimsServices/ApiGateway' 'src/Services/aimsServices/ApiGateway/Dockerfile'
              build_and_push 'access-service' 'src/Services/aimsServices/accessServices' 'src/Services/aimsServices/accessServices/Dockerfile'
              build_and_push 'aims-transaction-service' 'src/Services/aimsServices/aimsTransactionServices' 'src/Services/aimsServices/aimsTransactionServices/Dockerfile'
              build_and_push 'attendance-service' 'src/Services/aimsServices/attendanceServices' 'src/Services/aimsServices/attendanceServices/Dockerfile'
              build_and_push 'bus-services' 'src/Services/aimsServices/busServices' 'src/Services/aimsServices/busServices/Dockerfile'
              build_and_push 'calendar-service' 'src/Services/aimsServices/calendarServices' 'src/Services/aimsServices/calendarServices/Dockerfile'
              build_and_push 'employee-service' 'src/Services/aimsServices/employeeServices' 'src/Services/aimsServices/employeeServices/Dockerfile'
              build_and_push 'groupincentive-service' 'src/Services/aimsServices/groupincentiveServices' 'src/Services/aimsServices/groupincentiveServices/Dockerfile'
              build_and_push 'leave-services' 'src/Services/aimsServices/leaveServices' 'src/Services/aimsServices/leaveServices/Dockerfile'
              build_and_push 'reference-service' 'src/Services/aimsServices/referenceServices' 'src/Services/aimsServices/referenceServices/Dockerfile'
              build_and_push 'visitor-services' 'src/Services/aimsServices/visitorServices' 'src/Services/aimsServices/visitorServices/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · aimsServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'access-service'
              verify_svc 'aims-transaction-service'
              verify_svc 'attendance-service'
              verify_svc 'bus-services'
              verify_svc 'calendar-service'
              verify_svc 'employee-service'
              verify_svc 'groupincentive-service'
              verify_svc 'leave-services'
              verify_svc 'reference-service'
              verify_svc 'visitor-services'
            displayName: 'Pull & verify all selected images'
