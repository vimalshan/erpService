# =============================================================================
# TEST PIPELINE — healthServices  (8 services)
#
# Purpose : Validate Build → Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_ACTOR  – your GitHub username  (vimalshan)
#   GITHUB_TOKEN  – GitHub PAT with packages:write scope  (mark secret)
# =============================================================================

name: TEST · healthServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - accident-management-service
      - healthcheckup-service
      - health-transaction-service
      - insurance-management-service
      - master-service
      - medicalvisit-service
      - medicine-management-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD ──────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build · healthServices'
    jobs:
      - job: BuildImages
        displayName: Build Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -e
              build_svc() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"
                fi
              }
              build_svc 'api-gateway' 'src/Services/healthServices/apiGateway/src' 'src/Services/healthServices/apiGateway/src/Dockerfile'
              build_svc 'accident-management-service' 'src/Services/healthServices/accidentmanagementServices/src' 'src/Services/healthServices/accidentmanagementServices/src/Dockerfile'
              build_svc 'healthcheckup-service' 'src/Services/healthServices/healthcheckupServices/src' 'src/Services/healthServices/healthcheckupServices/src/Dockerfile'
              build_svc 'health-transaction-service' 'src/Services/healthServices/healthTransactionServices/src' 'src/Services/healthServices/healthTransactionServices/src/Dockerfile'
              build_svc 'insurance-management-service' 'src/Services/healthServices/insurancemanagementServices/src' 'src/Services/healthServices/insurancemanagementServices/src/Dockerfile'
              build_svc 'master-service' 'src/Services/healthServices/masterServices/src' 'src/Services/healthServices/masterServices/src/Dockerfile'
              build_svc 'medicalvisit-service' 'src/Services/healthServices/medicalvisitServices/src' 'src/Services/healthServices/medicalvisitServices/src/Dockerfile'
              build_svc 'medicine-management-service' 'src/Services/healthServices/medicinemanagementServices/src' 'src/Services/healthServices/medicinemanagementServices/src/Dockerfile'
            displayName: 'docker build all selected services'

  # ── PUSH ───────────────────────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push · healthServices → GHCR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushImages
        displayName: Push to GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable (GitHub PAT with write:packages scope)."
                exit 1
              fi
              if [ -z "${GITHUB_ACTOR:-}" ]; then
                echo "##[error]GITHUB_ACTOR is not set. Add it as a pipeline variable (your GitHub username)."
                exit 1
              fi
              echo "Logging in as: $GITHUB_ACTOR"
              echo "Token length: ${#GITHUB_TOKEN} chars"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              echo "GHCR login succeeded."
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              push_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                fi
              }
              push_svc 'api-gateway'
              push_svc 'accident-management-service'
              push_svc 'healthcheckup-service'
              push_svc 'health-transaction-service'
              push_svc 'insurance-management-service'
              push_svc 'master-service'
              push_svc 'medicalvisit-service'
              push_svc 'medicine-management-service'
            displayName: 'docker push all selected services'

  # ── VERIFY ─────────────────────────────────────────────────────────────────
  - stage: Verify
    displayName: 'Verify · healthServices'
    dependsOn: Push
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable (GitHub PAT with write:packages scope)."
                exit 1
              fi
              if [ -z "${GITHUB_ACTOR:-}" ]; then
                echo "##[error]GITHUB_ACTOR is not set. Add it as a pipeline variable (your GitHub username)."
                exit 1
              fi
              echo "Logging in as: $GITHUB_ACTOR"
              echo "Token length: ${#GITHUB_TOKEN} chars"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              echo "GHCR login succeeded."
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'accident-management-service'
              verify_svc 'healthcheckup-service'
              verify_svc 'health-transaction-service'
              verify_svc 'insurance-management-service'
              verify_svc 'master-service'
              verify_svc 'medicalvisit-service'
              verify_svc 'medicine-management-service'
            displayName: 'Pull & verify all selected images'
