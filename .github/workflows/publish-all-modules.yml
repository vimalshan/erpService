name: Publish ERP Modules

on:
  workflow_dispatch:
    inputs:
      module:
        description: Publish one module or all modules
        required: true
        default: all
        type: choice
        options:
          - all
          - adminServices
          - aimsServices
          - auditServices
          - AuthProvider
          - canteenServices
          - cashServices
          - ddServices
          - healthServices
          - hrServices
          - letServices
          - loanServices
          - mainsparshServices
          - myworkServices
          - payServices
          - pfServices
          - sciServices
          - sparshServices
          - sscServices
          - taskServices
          - tourServices
          - travelServices
          - wmsServices

permissions:
  contents: read
  packages: write

jobs:
  setup:
    name: Resolve service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python scripts/export-module-registry.py services --module "${{ inputs.module }}")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/erp/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
