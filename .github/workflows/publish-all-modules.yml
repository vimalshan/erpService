name: Publish ERP Modules

on:
  workflow_dispatch:
    inputs:
      module:
        description: Publish one module or all modules
        required: true
        default: all
        type: choice
        options:
          - all
          - adminServices
          - aimsServices
          - auditServices
          - AuthProvider
          - canteenServices
          - cashServices
          - ddServices
          - healthServices
          - hrServices
          - letServices
          - loanServices
          - mainsparshServices
          - myworkServices
          - payServices
          - pfServices
          - sciServices
          - sparshServices
          - sscServices
          - taskServices
          - tourServices
          - travelServices
          - wmsServices

permissions:
  contents: read
  packages: write

jobs:
  setup:
    name: Resolve service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python - <<'PY'
          import ast
          import json
          from pathlib import Path

          selected_module = "${{ inputs.module }}"
          source_file = Path("scripts/generate-module-pipelines.py")
          tree = ast.parse(source_file.read_text(encoding="utf-8"), filename=str(source_file))

          modules = None
          for node in tree.body:
            if isinstance(node, ast.Assign):
              for target in node.targets:
                if isinstance(target, ast.Name) and target.id == "MODULES":
                  modules = ast.literal_eval(node.value)
                  break
            if modules is not None:
              break

          if modules is None:
            raise RuntimeError("MODULES registry not found in scripts/generate-module-pipelines.py")

          def module_slug(name: str) -> str:
            return "".join(ch.lower() for ch in name if ch.isalnum())

          entries = []
          for module_name, config in modules.items():
            if selected_module != "all" and selected_module != module_name:
              continue

            slug = module_slug(module_name)
            for service_name, context, dockerfile in config["services"]:
              entries.append(
                {
                  "module": module_name,
                  "module_slug": slug,
                  "service": service_name,
                  "context": context,
                  "dockerfile": f"{context}/{dockerfile}",
                  "image": f"{slug}-{service_name}",
                }
              )

          print(json.dumps({"include": entries}, separators=(",", ":")))
          PY
          )
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pin MCR base images by digest
        id: pin-base-images
        shell: bash
        env:
          SOURCE_DOCKERFILE: ${{ matrix.dockerfile }}
          TEMP_DOCKERFILE: ${{ runner.temp }}/Dockerfile.pinned
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          source_path = Path(os.environ["SOURCE_DOCKERFILE"])
          temp_path = Path(os.environ["TEMP_DOCKERFILE"])
          content = source_path.read_text(encoding="utf-8")

          image_pattern = re.compile(r"mcr\.microsoft\.com/dotnet/(sdk|aspnet):([A-Za-z0-9._-]+)")
          replacements: dict[str, str] = {}

          def resolve_digest(image: str) -> str:
              inspect = subprocess.run(
                  ["docker", "manifest", "inspect", image],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              manifest = json.loads(inspect.stdout)
              manifests = manifest.get("manifests")
              if manifests:
                  for entry in manifests:
                      platform = entry.get("platform", {})
                      if platform.get("os") == "linux" and platform.get("architecture") == "amd64":
                          return entry["digest"]
                  raise RuntimeError(f"linux/amd64 digest not found for {image}")
              return manifest["config"]["digest"]

          for match in image_pattern.finditer(content):
              image = match.group(0)
              if image not in replacements:
                  digest = resolve_digest(image)
                  repository = image.split(":", 1)[0]
                  replacements[image] = f"{repository}@{digest}"

          for original, pinned in replacements.items():
              content = content.replace(original, pinned)

          temp_path.write_text(content, encoding="utf-8")
          print(f"dockerfile={temp_path}")
          PY
          python_output=$(python - <<'PY'
          import os
          print(f"dockerfile={os.environ['TEMP_DOCKERFILE']}")
          PY
          )
          echo "$python_output" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/erp/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ steps.pin-base-images.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
