name: Publish ERP Modules

on:
  workflow_dispatch:
    inputs:
      module:
        description: Publish one module or all modules
        required: true
        default: all
        type: choice
        options:
          - all
          - adminServices
          - aimsServices
          - auditServices
          - AuthProvider
          - canteenServices
          - cashServices
          - ddServices
          - healthServices
          - hrServices
          - letServices
          - loanServices
          - mainsparshServices
          - myworkServices
          - payServices
          - pfServices
          - sciServices
          - sparshServices
          - sscServices
          - taskServices
          - tourServices
          - travelServices
          - wmsServices

permissions:
  actions: write
  contents: read

jobs:
  setup:
    name: Resolve module matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY=(
            "adminServices|build-admin-services.yml|true"
            "aimsServices|build-aims-services.yml|true"
            "auditServices|build-audit-services.yml|true"
            "AuthProvider|build-auth-services.yml|false"
            "canteenServices|build-canteen-services.yml|true"
            "cashServices|build-cash-services.yml|true"
            "ddServices|build-dd-services.yml|true"
            "healthServices|build-health-services.yml|true"
            "hrServices|build-hr-services.yml|true"
            "letServices|build-let-services.yml|true"
            "loanServices|build-loan-services.yml|true"
            "mainsparshServices|build-mainsparsh-services.yml|true"
            "myworkServices|build-mywork-services.yml|true"
            "payServices|build-pay-services.yml|true"
            "pfServices|build-pf-services.yml|true"
            "sciServices|build-sci-services.yml|true"
            "sparshServices|build-sparsh-services.yml|true"
            "sscServices|build-ssc-services.yml|true"
            "taskServices|build-task-services.yml|true"
            "tourServices|build-tour-services.yml|true"
            "travelServices|build-travel-services.yml|true"
            "wmsServices|build-wms-services.yml|true"
          )

          selected="${{ inputs.module }}"
          entries=()

          for item in "${REGISTRY[@]}"; do
            IFS='|' read -r module workflow has_input <<< "$item"
            if [[ "$selected" == "all" || "$selected" == "$module" ]]; then
              entries+=("{\"module\":\"${module}\",\"workflow\":\"${workflow}\",\"hasInput\":${has_input}}")
            fi
          done

          if [[ ${#entries[@]} -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s,' "${entries[@]}")
          json="[${json%,}]"
          echo "matrix={\"include\":${json}}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.module }}
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Dispatch module build workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_FILE: ${{ matrix.workflow }}
          HAS_INPUT: ${{ matrix.hasInput }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "$HAS_INPUT" == "true" ]]; then
            gh workflow run "$WORKFLOW_FILE" --ref "$REF_NAME" -f service=all
          else
            gh workflow run "$WORKFLOW_FILE" --ref "$REF_NAME"
          fi

          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"

      - name: Wait for module build workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_FILE: ${{ matrix.workflow }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail

          run_id=""
          for attempt in {1..24}; do
            run_id=$(gh run list \
              --workflow "$WORKFLOW_FILE" \
              --branch "$REF_NAME" \
              --event workflow_dispatch \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$DISPATCHED_AT\")] | first | .databaseId" || true)

            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "Unable to locate the dispatched run for $WORKFLOW_FILE"
            exit 1
          fi

          gh run watch "$run_id" --exit-status
