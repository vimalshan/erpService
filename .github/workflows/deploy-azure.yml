# ──────────────────────────────────────────────────────────────────────────────
# Deploy Admin Services to Azure Container Apps
# ──────────────────────────────────────────────────────────────────────────────
#
# Creates publicly accessible URLs for all admin microservices.
#
# Prerequisites (one-time setup):
#   1. Azure subscription
#   2. Run the setup script: scripts/azure-setup.sh
#   3. Add these GitHub Secrets (Settings → Secrets → Actions):
#      - AZURE_CREDENTIALS  (service principal JSON from setup script)
#
# After deployment, each service gets a public URL like:
#   https://finyear-api.<unique>.azurecontainerapps.io/swagger
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["Build & Push Admin Services"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - finyear-api
          - location-services
          - lov-service
          - scholarship-service
          - stationery-service
          - tds-service
          - vendor-service
          - transaction-service
          - api-gateway

env:
  RESOURCE_GROUP: erp-adminservices-rg
  ENVIRONMENT: erp-admin-env
  LOCATION: eastus
  IMAGE_PREFIX: ghcr.io/vimalshan/erp

jobs:
  deploy:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: finyear-api
            port: 5000
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5000
          - name: location-services
            port: 7136
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:7136
          - name: lov-service
            port: 5181
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5181
          - name: scholarship-service
            port: 5166
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5166
          - name: stationery-service
            port: 5181
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5181
          - name: tds-service
            port: 5181
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5181
          - name: vendor-service
            port: 5181
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5181
          - name: transaction-service
            port: 5185
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5185
          - name: api-gateway
            port: 5000
            env_vars: >-
              ASPNETCORE_ENVIRONMENT=Development
              ASPNETCORE_URLS=http://+:5000

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ matrix.name }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ENVIRONMENT }}
          imageToDeploy: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          targetPort: ${{ matrix.port }}
          ingress: external
          environmentVariables: ${{ matrix.env_vars }}
          location: ${{ env.LOCATION }}

  print-urls:
    name: Print public URLs
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get public URLs
        run: |
          echo "## 🌐 Public Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Swagger | GraphQL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|---------|" >> $GITHUB_STEP_SUMMARY

          SERVICES="finyear-api location-services lov-service scholarship-service stationery-service tds-service vendor-service transaction-service api-gateway"

          for SVC in $SERVICES; do
            FQDN=$(az containerapp show \
              --name "$SVC" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "properties.configuration.ingress.fqdn" \
              --output tsv 2>/dev/null || echo "not-deployed")

            if [[ "$FQDN" != "not-deployed" ]]; then
              echo "| $SVC | https://${FQDN}/swagger | https://${FQDN}/graphql |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $SVC | ❌ Not deployed | — |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All services are publicly accessible. No login required." >> $GITHUB_STEP_SUMMARY
