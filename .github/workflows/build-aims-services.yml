# ──────────────────────────────────────────────────────────────────────────────
# Build & Push AIMS Service Docker Images to GitHub Container Registry (GHCR)
# ──────────────────────────────────────────────────────────────────────────────
#
# Triggers:
#   - Push to main (only when relevant service files change)
#   - Manual dispatch (workflow_dispatch) to build all or specific services
#
# Prerequisites (GitHub repo settings):
#   No secrets needed — uses the built-in GITHUB_TOKEN for GHCR authentication.
#   Ensure "Read and write permissions" is enabled under:
#     Settings → Actions → General → Workflow permissions
# ──────────────────────────────────────────────────────────────────────────────

name: Build & Push AIMS Services

on:
  push:
    branches: [main]
    paths:
      - 'src/Services/aimsServices/**'

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - access-service
          - api-gateway
          - attendance-service
          - bus-services
          - calendar-service
          - employee-service
          - aims-transaction-service
          - groupincentive-service
          - leave-services
          - reference-service
          - visitor-services

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/erp

jobs:
  # ── Detect which services changed ────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed services
        id: set-matrix
        run: |
          # Service registry: name → context + dockerfile
          declare -A SVC_CONTEXT SVC_DOCKERFILE
          SVC_CONTEXT[aims-transaction-service]="src/Services/aimsServices/aimsTransactionServices"; SVC_DOCKERFILE[aims-transaction-service]="Dockerfile"
          SVC_CONTEXT[access-service]="src/Services/aimsServices/accessServices";             SVC_DOCKERFILE[access-service]="Dockerfile"
          SVC_CONTEXT[api-gateway]="src/Services/aimsServices/ApiGateway";                    SVC_DOCKERFILE[api-gateway]="Dockerfile"
          SVC_CONTEXT[attendance-service]="src/Services/aimsServices/attendanceServices";     SVC_DOCKERFILE[attendance-service]="Dockerfile"
          SVC_CONTEXT[bus-services]="src/Services/aimsServices/busServices";                  SVC_DOCKERFILE[bus-services]="Dockerfile"
          SVC_CONTEXT[calendar-service]="src/Services/aimsServices/calendarServices";         SVC_DOCKERFILE[calendar-service]="Dockerfile"
          SVC_CONTEXT[employee-service]="src/Services/aimsServices/employeeServices";         SVC_DOCKERFILE[employee-service]="Dockerfile"
          SVC_CONTEXT[groupincentive-service]="src/Services/aimsServices/groupincentiveServices"; SVC_DOCKERFILE[groupincentive-service]="Dockerfile"
          SVC_CONTEXT[leave-services]="src/Services/aimsServices/leaveServices";              SVC_DOCKERFILE[leave-services]="Dockerfile"
          SVC_CONTEXT[reference-service]="src/Services/aimsServices/referenceServices";       SVC_DOCKERFILE[reference-service]="Dockerfile"
          SVC_CONTEXT[visitor-services]="src/Services/aimsServices/visitorServices";          SVC_DOCKERFILE[visitor-services]="Dockerfile"

          # Ordered list matching the paths for change detection
          SVC_NAMES=(aims-transaction-service access-service api-gateway attendance-service bus-services calendar-service employee-service groupincentive-service leave-services reference-service visitor-services)
          SVC_PATHS=(
            "src/Services/aimsServices/aimsTransactionServices/"
            "src/Services/aimsServices/accessServices/"
            "src/Services/aimsServices/ApiGateway/"
            "src/Services/aimsServices/attendanceServices/"
            "src/Services/aimsServices/busServices/"
            "src/Services/aimsServices/calendarServices/"
            "src/Services/aimsServices/employeeServices/"
            "src/Services/aimsServices/groupincentiveServices/"
            "src/Services/aimsServices/leaveServices/"
            "src/Services/aimsServices/referenceServices/"
            "src/Services/aimsServices/visitorServices/"
          )

          make_entry() {
            local n="$1"
            echo "{\"name\":\"${n}\",\"context\":\"${SVC_CONTEXT[$n]}\",\"dockerfile\":\"${SVC_DOCKERFILE[$n]}\"}"
          }

          # If manual dispatch with a specific service, build only that
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT="${{ github.event.inputs.service }}"
            if [[ "$INPUT" != "all" ]]; then
              ENTRY=$(make_entry "$INPUT")
              echo "matrix={\"include\":[${ENTRY}]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # For push events or "all", detect changes
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "src/Services/aimsServices/")
          BUILD_ALL=$([[ "${{ github.event.inputs.service }}" == "all" ]] && echo "true" || echo "false")

          SERVICES=()
          for i in "${!SVC_NAMES[@]}"; do
            NAME="${SVC_NAMES[$i]}"
            PATH_PREFIX="${SVC_PATHS[$i]}"
            if [[ "$BUILD_ALL" == "true" ]] || echo "$CHANGED" | grep -q "^${PATH_PREFIX}"; then
              SERVICES+=("$(make_entry "$NAME")")
            fi
          done

          if [[ ${#SERVICES[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s,' "${SERVICES[@]}")
            JSON="[${JSON%,}]"
            echo "matrix={\"include\":${JSON}}" >> "$GITHUB_OUTPUT"
          fi

      - name: Print matrix
        run: echo '${{ steps.set-matrix.outputs.matrix }}'

  # ── Build & Push ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.name }}
    needs: changes
    if: ${{ fromJson(needs.changes.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
