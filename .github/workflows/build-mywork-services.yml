# ──────────────────────────────────────────────────────────────────────────────
# Build & Push MyWork Service Docker Images to GitHub Container Registry (GHCR)
# ──────────────────────────────────────────────────────────────────────────────
#
# Triggers:
#   - Push to main (only when relevant service files change)
#   - Manual dispatch (workflow_dispatch) to build all or specific services
#
# Prerequisites (GitHub repo settings):
#   No secrets needed — uses the built-in GITHUB_TOKEN for GHCR authentication.
#   Ensure "Read and write permissions" is enabled under:
#     Settings → Actions → General → Workflow permissions
# ──────────────────────────────────────────────────────────────────────────────

name: Build & Push MyWork Services

on:
  push:
    branches: [main]
    paths:
      - 'src/Services/myworkServices/**'

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api-gateway
          - audit-service
          - batch-service
          - csa-service
          - project-service
          - risk-service
          - team-service
          - timesheet-service
          - workorder-service

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/erp

jobs:
  # ── Detect which services changed ────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed services
        id: set-matrix
        run: |
          # Service registry: name → context + dockerfile
          declare -A SVC_CONTEXT SVC_DOCKERFILE
          SVC_CONTEXT[api-gateway]="src/Services/myworkServices/Gateway";                            SVC_DOCKERFILE[api-gateway]="Dockerfile"
          SVC_CONTEXT[audit-service]="src/Services/myworkServices/auditServices";                    SVC_DOCKERFILE[audit-service]="Dockerfile"
          SVC_CONTEXT[batch-service]="src/Services/myworkServices/batchServices";                    SVC_DOCKERFILE[batch-service]="Dockerfile"
          SVC_CONTEXT[csa-service]="src/Services/myworkServices/csaServices/CSA.Service";            SVC_DOCKERFILE[csa-service]="Dockerfile"
          SVC_CONTEXT[project-service]="src/Services/myworkServices/projectServices";                SVC_DOCKERFILE[project-service]="Dockerfile"
          SVC_CONTEXT[risk-service]="src/Services/myworkServices/riskServices";                      SVC_DOCKERFILE[risk-service]="Dockerfile"
          SVC_CONTEXT[team-service]="src/Services/myworkServices/teamServices";                      SVC_DOCKERFILE[team-service]="Dockerfile"
          SVC_CONTEXT[timesheet-service]="src/Services/myworkServices/timeSheetServices";            SVC_DOCKERFILE[timesheet-service]="Dockerfile"
          SVC_CONTEXT[workorder-service]="src/Services/myworkServices/workorderServices/WorkOrderService"; SVC_DOCKERFILE[workorder-service]="Dockerfile"

          # Ordered list matching the paths for change detection
          SVC_NAMES=(api-gateway audit-service batch-service csa-service project-service risk-service team-service timesheet-service workorder-service)
          SVC_PATHS=(
            "src/Services/myworkServices/Gateway/"
            "src/Services/myworkServices/auditServices/"
            "src/Services/myworkServices/batchServices/"
            "src/Services/myworkServices/csaServices/"
            "src/Services/myworkServices/projectServices/"
            "src/Services/myworkServices/riskServices/"
            "src/Services/myworkServices/teamServices/"
            "src/Services/myworkServices/timeSheetServices/"
            "src/Services/myworkServices/workorderServices/"
          )

          make_entry() {
            local n="$1"
            echo "{\"name\":\"${n}\",\"context\":\"${SVC_CONTEXT[$n]}\",\"dockerfile\":\"${SVC_DOCKERFILE[$n]}\"}"
          }

          # If manual dispatch with a specific service, build only that
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT="${{ github.event.inputs.service }}"
            if [[ "$INPUT" != "all" ]]; then
              ENTRY=$(make_entry "$INPUT")
              echo "matrix={\"include\":[${ENTRY}]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # For push events or "all", detect changes
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "src/Services/myworkServices/")
          BUILD_ALL=$([[ "${{ github.event.inputs.service }}" == "all" ]] && echo "true" || echo "false")

          # If shared infrastructure assets changed, rebuild all MyWork services
          if echo "$CHANGED" | grep -q "^src/Services/myworkServices/infrastructure/"; then
            BUILD_ALL="true"
          fi

          # If shared MyWork root files changed (outside specific service folders), rebuild all
          NON_SERVICE_CHANGES=$(echo "$CHANGED" | grep "^src/Services/myworkServices/" | grep -Ev "^src/Services/myworkServices/(Gateway|auditServices|batchServices|csaServices|projectServices|riskServices|teamServices|timeSheetServices|workorderServices|infrastructure)/" || true)
          if [[ -n "$NON_SERVICE_CHANGES" ]]; then
            BUILD_ALL="true"
          fi

          SERVICES=()
          for i in "${!SVC_NAMES[@]}"; do
            NAME="${SVC_NAMES[$i]}"
            PATH_PREFIX="${SVC_PATHS[$i]}"
            if [[ "$BUILD_ALL" == "true" ]] || echo "$CHANGED" | grep -q "^${PATH_PREFIX}"; then
              SERVICES+=("$(make_entry "$NAME")")
            fi
          done

          if [[ ${#SERVICES[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s,' "${SERVICES[@]}")
            JSON="[${JSON%,}]"
            echo "matrix={\"include\":${JSON}}" >> "$GITHUB_OUTPUT"
          fi

      - name: Print matrix
        run: echo '${{ steps.set-matrix.outputs.matrix }}'

  # ── Build & Push ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.name }}
    needs: changes
    if: ${{ fromJson(needs.changes.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
