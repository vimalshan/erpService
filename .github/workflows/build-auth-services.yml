# ──────────────────────────────────────────────────────────────────────────────
# Build & Push AuthProvider Docker Image to GitHub Container Registry (GHCR)
# ──────────────────────────────────────────────────────────────────────────────
#
# Triggers:
#   - Push to main (only when AuthProvider files change)
#   - Manual dispatch (workflow_dispatch)
#
# Prerequisites (GitHub repo settings):
#   No secrets needed — uses the built-in GITHUB_TOKEN for GHCR authentication.
#   Ensure "Read and write permissions" is enabled under:
#     Settings → Actions → General → Workflow permissions
# ──────────────────────────────────────────────────────────────────────────────

name: Build & Push Auth Services

on:
  push:
    branches: [main]
    paths:
      - 'src/Services/AuthProvider/**'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/erp

jobs:
  build-and-push:
    name: Build auth-provider
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/auth-provider
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/Services/AuthProvider
          file: src/Services/AuthProvider/Docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
