            # ── tourServices (5470-5477) ───────────────────────────────────
            "api-gateway|5470|tourServices"
            "tour-admin-service|5471|tourServices"
            "tour-booking-service|5472|tourServices"
            "config-service|5473|tourServices"
            "tour-service|5474|tourServices"
