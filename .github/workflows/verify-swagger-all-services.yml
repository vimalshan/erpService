            # ── travelServices (5490-5499) ─────────────────────────────────
            "api-gateway|5490|travelServices"
            "travel-admin-service|5491|travelServices"
            "agens-service|5492|travelServices"
            "travel-booking-service|5493|travelServices"
            "travelexpense-service|5494|travelServices"
            "travelfinance-service|5495|travelServices"
            "travel-insurance-service|5496|travelServices"
            "travel-masterdata-service|5497|travelServices"
            "travel-transaction-service|5498|travelServices"
            "travelrequest-service|5499|travelServices"
            # ── wmsServices (5510-5526) ────────────────────────────────────
            "api-gateway|5510|wmsServices"
            "auditlog-service|5511|wmsServices"
            "customer-service|5512|wmsServices"
            "wms-employee-service|5513|wmsServices"
            "fleet-management-service|5514|wmsServices"
            "inventory-service|5515|wmsServices"
            "order-service|5516|wmsServices"
            "product-service|5517|wmsServices"
            "purchaseorder-service|5518|wmsServices"
            "rackingsystem-service|5519|wmsServices"
            "receiving-service|5520|wmsServices"
            "salesorder-service|5521|wmsServices"
            "wms-security-service|5522|wmsServices"
            "shipment-service|5523|wmsServices"
            "supplier-service|5524|wmsServices"
            "warehousestructure-service|5525|wmsServices"
            "wmtransactional-service|5526|wmsServices"
          )

          MODULE="${{ github.event.inputs.module }}"
          ENTRIES=()
          for entry in "${REGISTRY[@]}"; do
            IFS='|' read -r NAME PORT MOD <<< "$entry"
            if [[ "$MODULE" == "all" || "$MODULE" == "$MOD" ]]; then
              ENTRIES+=("{\"name\":\"${NAME}\",\"port\":${PORT},\"module\":\"${MOD}\"}")
            fi
          done

          if [[ ${#ENTRIES[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s,' "${ENTRIES[@]}")
            JSON="[${JSON%,}]"
            echo "matrix={\"include\":${JSON}}" >> "$GITHUB_OUTPUT"
          fi

      - name: Print matrix summary
        run: |
          echo '${{ steps.build.outputs.matrix }}' | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          services = data.get('include', [])
          print(f'Total services to verify: {len(services)}')
          for s in services:
              print(f\"  • {s['module']:30s}  {s['name']:45s}  port {s['port']}\")
          "

  # ── Pull → Run → Verify Swagger → Report ────────────────────────────────
  verify:
    name: "${{ matrix.module }} / ${{ matrix.name }}"
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Pull ──────────────────────────────────────────────────────────
      - name: Pull image
        id: pull
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.event.inputs.tag || 'latest' }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if docker pull "$IMAGE" 2>&1; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not pull $IMAGE — has the build workflow run for ${{ matrix.module }}?"
          fi

      # ── 2. Run ───────────────────────────────────────────────────────────
      - name: Start container
        id: run
        if: steps.pull.outputs.pulled == 'true'
        run: |
          CONTAINER="svc-${{ matrix.name }}-${{ github.run_id }}"
          docker run -d \
            --name "$CONTAINER" \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS="http://+:${{ matrix.port }}" \
            "${{ steps.pull.outputs.image }}"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      # ── 3. Verify Swagger ─────────────────────────────────────────────
      - name: Wait for Swagger endpoint
        id: swagger
        if: steps.pull.outputs.pulled == 'true'
        run: |
          PORT=${{ matrix.port }}
          SWAGGER_URL="http://localhost:${PORT}/swagger/index.html"
          HEALTH_URL="http://localhost:${PORT}/health"
          STATUS="❌ Not reachable"
          FINAL_URL="$SWAGGER_URL"

          echo "Waiting for container to be ready on port ${PORT}..."
          for i in $(seq 1 12); do
            # Try swagger first
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$SWAGGER_URL" 2>/dev/null || echo "000")
            if [[ "$CODE" == "200" || "$CODE" == "301" || "$CODE" == "302" ]]; then
              STATUS="✅ Swagger reachable (HTTP ${CODE})"
              FINAL_URL="$SWAGGER_URL"
              break
            fi
            # Try health endpoint as fallback
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" 2>/dev/null || echo "000")
            if [[ "$CODE" == "200" ]]; then
              STATUS="⚠️ Health OK but /swagger not found (HTTP ${CODE})"
              FINAL_URL="$HEALTH_URL"
              break
            fi
            echo "  Attempt ${i}/12 – waiting 5 s …"
            sleep 5
          done

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "swagger_url=$SWAGGER_URL" >> "$GITHUB_OUTPUT"
          echo "final_url=$FINAL_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "──── Container logs (last 30 lines) ────"
          docker logs "${{ steps.run.outputs.container }}" --tail 30 2>&1 || true

      # ── 4. Publish job summary ────────────────────────────────────────
      - name: Publish summary
        if: always()
        run: |
          IMAGE="${{ steps.pull.outputs.image }}"
          [[ -z "$IMAGE" ]] && IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.event.inputs.tag || 'latest' }}"

          PULL_STATUS=$([[ "${{ steps.pull.outputs.pulled }}" == "true" ]] && echo "✅ Success" || echo "❌ Failed")
          SWAGGER_STATUS="${{ steps.swagger.outputs.status }}"
          [[ -z "$SWAGGER_STATUS" ]] && SWAGGER_STATUS="⏭️ Skipped (image not pulled)"

          SWAGGER_URL="${{ steps.swagger.outputs.swagger_url }}"
          [[ -z "$SWAGGER_URL" ]] && SWAGGER_URL="http://HOST:${{ matrix.port }}/swagger/index.html"

          {
            echo "### 📦 \`${{ matrix.name }}\` — *${{ matrix.module }}*"
            echo ""
            echo "| Property | Value |"
            echo "|:---------|:------|"
            echo "| **Image** | \`${IMAGE}\` |"
            echo "| **Port** | \`${{ matrix.port }}\` |"
            echo "| **Pull** | ${PULL_STATUS} |"
            echo "| **Swagger status** | ${SWAGGER_STATUS} |"
            echo "| **Swagger URL** | \`${SWAGGER_URL}\` |"
            echo ""
            echo "<details><summary>How to run locally</summary>"
            echo ""
            echo '```bash'
            echo "docker pull ${IMAGE}"
            echo "docker run -d \\"
            echo "  -p ${{ matrix.port }}:${{ matrix.port }} \\"
            echo "  -e ASPNETCORE_ENVIRONMENT=Development \\"
            echo "  -e ASPNETCORE_URLS=http://+:${{ matrix.port }} \\"
            echo "  ${IMAGE}"
            echo "# Open: http://localhost:${{ matrix.port }}/swagger/index.html"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 5. Cleanup ────────────────────────────────────────────────────
      - name: Stop & remove container
        if: always()
        run: docker rm -f "${{ steps.run.outputs.container }}" 2>/dev/null || true
