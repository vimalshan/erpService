# ──────────────────────────────────────────────────────────────────────────────
# Run & Verify Swagger – All ERP Services
# ──────────────────────────────────────────────────────────────────────────────
#
# What this workflow does:
#   1. Pulls the built image from GHCR for every service in the selected module
#   2. Starts the container on the GitHub Actions runner (Development mode)
#   3. Waits up to 60 s for the /swagger/index.html endpoint to respond
#   4. Publishes a summary table with:
#         • Docker image URL
#         • Internal port
#         • Pull status
#         • Swagger reachability status
#         • Swagger URL (for local use / deployment reference)
#
# Prerequisites:
#   • Images must already be built and pushed to GHCR by the corresponding
#     "Build & Push <Module> Services" workflow.
#   • Settings → Actions → General → Workflow permissions → Read and write
#
# NOTE on image-name collisions:
#   Several modules share generic names (api-gateway, employee-service, …).
#   All modules push to ghcr.io/<owner>/erp/<name>:tag, so the LAST build of
#   that module wins. Run this workflow immediately after the relevant build
#   workflow, or select a specific module instead of "all".
# ──────────────────────────────────────────────────────────────────────────────

name: Run & Verify Swagger – All Services

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to verify (or "all")'
        required: true
        default: 'adminServices'
        type: choice
        options:
          - all
          - adminServices
          - aimsServices
          - auditServices
          - AuthProvider
          - canteenServices
          - cashServices
          - ddServices
          - healthServices
          - hrServices
          - letServices
          - loanServices
          - mainsparshServices
          - myworkServices
          - payServices
          - pfServices
          - sciServices
          - sparshServices
          - sscServices
          - taskServices
          - tourServices
          - travelServices
          - wmsServices
      tag:
        description: 'Image tag to pull (e.g. latest, main, <git-sha>)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/erp

jobs:
  # ── Build the dynamic service matrix ────────────────────────────────────
  setup:
    name: Resolve service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

