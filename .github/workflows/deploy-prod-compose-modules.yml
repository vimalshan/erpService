name: Deploy Prod Compose Modules

on:
  workflow_dispatch:
    inputs:
      module:
        description: Deploy one supported prod-compose module or all supported modules
        required: true
        default: all
        type: choice
        options:
          - all
          - adminServices
          - aimsServices
          - auditServices
          - AuthProvider
          - canteenServices
          - cashServices

permissions:
  contents: read
  packages: read

jobs:
  setup:
    name: Resolve deployment matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python scripts/export-module-registry.py deploy --module "${{ inputs.module }}")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.module }}
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE_NAME: docker-compose.workflow.yml
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Docker versions
        shell: bash
        run: |
          docker --version
          docker compose version

      - name: Prepare workflow compose file
        shell: bash
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MODULE_SLUG: ${{ matrix.module_slug }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          compose_file = Path(os.environ["COMPOSE_FILE_NAME"])
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          module_slug = os.environ["MODULE_SLUG"]
          source = Path("docker-compose.prod.yml").read_text(encoding="utf-8")

          pattern = re.compile(r"ghcr\.io/[^/]+/erp/([A-Za-z0-9_.-]+)(:[A-Za-z0-9_.-]+)")
          rewritten = pattern.sub(lambda match: f"ghcr.io/{owner}/erp/{module_slug}-{match.group(1)}{match.group(2)}", source)

          compose_file.write_text(rewritten, encoding="utf-8")
          PY

      - name: Validate compose file
        shell: bash
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          test -f "$COMPOSE_FILE_NAME"
          docker compose -f "$COMPOSE_FILE_NAME" config -q

      - name: Start production stack
        shell: bash
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE_NAME" up -d --pull always --wait --wait-timeout 900

      - name: Show stack status
        if: always()
        shell: bash
        working-directory: ${{ matrix.path }}
        run: docker compose -f "$COMPOSE_FILE_NAME" ps

      - name: Collect container logs on failure
        if: failure()
        shell: bash
        working-directory: ${{ matrix.path }}
        run: docker compose -f "$COMPOSE_FILE_NAME" logs --no-color --tail=200