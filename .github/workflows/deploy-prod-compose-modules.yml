name: Deploy Prod Compose Modules

on:
  workflow_dispatch:
    inputs:
      module:
        description: Deploy one supported prod-compose module or all supported modules
        required: true
        default: all
        type: choice
        options:
          - all
          - adminServices
          - aimsServices
          - auditServices
          - AuthProvider
          - canteenServices
          - cashServices

permissions:
  contents: read
  packages: read

jobs:
  setup:
    name: Resolve deployment matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python - <<'PY'
          import json

          selected_module = "${{ inputs.module }}"

          def module_slug(name: str) -> str:
            return "".join(ch.lower() for ch in name if ch.isalnum())

          supported = [
            ("adminServices", "src/Services/adminServices"),
            ("aimsServices", "src/Services/aimsServices"),
            ("auditServices", "src/Services/auditServices"),
            ("AuthProvider", "src/Services/AuthProvider"),
            ("canteenServices", "src/Services/canteenServices"),
            ("cashServices", "src/Services/cashServices"),
          ]

          entries = []
          for module_name, path in supported:
            if selected_module != "all" and selected_module != module_name:
              continue
            entries.append(
              {
                "module": module_name,
                "module_slug": module_slug(module_name),
                "path": path,
              }
            )

          print(json.dumps({"include": entries}, separators=(",", ":")))
          PY
          )
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.module }}
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE_NAME: docker-compose.workflow.yml
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Docker versions
        shell: bash
        run: |
          docker --version
          docker compose version

      - name: Prepare workflow compose file
        shell: bash
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MODULE_SLUG: ${{ matrix.module_slug }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          compose_file = Path(os.environ["COMPOSE_FILE_NAME"])
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          module_slug = os.environ["MODULE_SLUG"]
          source = Path("docker-compose.prod.yml").read_text(encoding="utf-8")

          pattern = re.compile(r"ghcr\.io/[^/]+/erp/([A-Za-z0-9_.-]+)(:[A-Za-z0-9_.-]+)")
          rewritten = pattern.sub(lambda match: f"ghcr.io/{owner}/erp/{module_slug}-{match.group(1)}{match.group(2)}", source)

          compose_file.write_text(rewritten, encoding="utf-8")
          PY

      - name: Validate compose file
        shell: bash
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          test -f "$COMPOSE_FILE_NAME"
          docker compose -f "$COMPOSE_FILE_NAME" config -q

      - name: Start production stack
        shell: bash
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE_NAME" up -d --pull always --wait --wait-timeout 900

      - name: Show stack status
        if: always()
        shell: bash
        working-directory: ${{ matrix.path }}
        run: docker compose -f "$COMPOSE_FILE_NAME" ps

      - name: Show deployment URLs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Module: ${{ matrix.module }}"
          case "${{ matrix.module }}" in
            AuthProvider)
              echo "Base URL: http://<deployment-host>:5200"
              echo "Swagger:  http://<deployment-host>:5200/swagger"
              echo "GraphQL:  http://<deployment-host>:5200/graphql"
              echo "Health:   http://<deployment-host>:5200/health"
              ;;
            *)
              echo "Use the published host port mappings from docker-compose.prod.yml for this module."
              ;;
          esac

      - name: Collect container logs on failure
        if: failure()
        shell: bash
        working-directory: ${{ matrix.path }}
        run: docker compose -f "$COMPOSE_FILE_NAME" logs --no-color --tail=200