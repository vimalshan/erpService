            "travelrequest-service|5499|travelServices"
            # wmsServices (5510-5526)
            "api-gateway|5510|wmsServices"
            "auditlog-service|5511|wmsServices"
            "customer-service|5512|wmsServices"
            "wms-employee-service|5513|wmsServices"
            "fleet-management-service|5514|wmsServices"
            "inventory-service|5515|wmsServices"
            "order-service|5516|wmsServices"
            "product-service|5517|wmsServices"
            "purchaseorder-service|5518|wmsServices"
            "rackingsystem-service|5519|wmsServices"
            "receiving-service|5520|wmsServices"
            "salesorder-service|5521|wmsServices"
            "wms-security-service|5522|wmsServices"
            "shipment-service|5523|wmsServices"
            "supplier-service|5524|wmsServices"
            "warehousestructure-service|5525|wmsServices"
            "wmtransactional-service|5526|wmsServices"
          )

          MODULE="${{ github.event.inputs.module }}"
          SPECIFIC="${{ github.event.inputs.service }}"
          ENTRIES=()
          for entry in "${REGISTRY[@]}"; do
            IFS='|' read -r NAME PORT MOD <<< "$entry"
            if [[ "$MODULE" == "all" || "$MODULE" == "$MOD" ]]; then
              if [[ -z "$SPECIFIC" || "$SPECIFIC" == "$NAME" ]]; then
                ENTRIES+=("{\"name\":\"${NAME}\",\"port\":${PORT},\"module\":\"${MOD}\"}")
              fi
            fi
          done

          if [[ ${#ENTRIES[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s,' "${ENTRIES[@]}")
            JSON="[${JSON%,}]"
            echo "matrix={\"include\":${JSON}}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show services selected
        run: |
          echo '${{ steps.build.outputs.matrix }}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          svcs=d.get('include',[])
          print(f'Total services: {len(svcs)}')
          for s in svcs:
              print(f\"  [{s['module']:25}]  {s['name']:45}  port {s['port']}\")
          "

# ─────────────────────────────────────────────────────────────────────────────
  run-service:
    name: "${{ matrix.module }} / ${{ matrix.name }}"
    needs: setup
    if: ${{ fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      # ── Login ──────────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Pull ───────────────────────────────────────────────────────────────
      - name: Pull image
        id: pull
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.event.inputs.tag || 'latest' }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pulling $IMAGE ..."
          if docker pull "$IMAGE"; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
            echo "Pull SUCCESS"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "Pull FAILED - image may not exist yet. Run the build workflow first."
          fi

      # ── Run ────────────────────────────────────────────────────────────────
      - name: Start container
        id: run
        if: steps.pull.outputs.pulled == 'true'
        run: |
          CONTAINER="svc-${{ matrix.name }}-${{ github.run_id }}"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          docker run -d \
            --name "$CONTAINER" \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS="http://+:${{ matrix.port }}" \
            "${{ steps.pull.outputs.image }}"
          echo "Container $CONTAINER started on port ${{ matrix.port }}"

      # ── Wait for startup ───────────────────────────────────────────────────
      - name: Wait for startup
        if: steps.pull.outputs.pulled == 'true'
        run: |
          PORT=${{ matrix.port }}
          for i in $(seq 1 12); do
            if wget -qO- --timeout=5 "http://localhost:${PORT}/health/live" >/dev/null 2>&1 \
            || wget -qO- --timeout=5 "http://localhost:${PORT}/health"      >/dev/null 2>&1 \
            || wget -qO- --timeout=5 "http://localhost:${PORT}/"            >/dev/null 2>&1; then
              echo "Service up after ~$((i*5))s"
              break
            fi
            echo "Attempt $i/12 - waiting 5s..."
            sleep 5
          done

      # ── Health check ───────────────────────────────────────────────────────
      - name: Health check
        id: health
        if: steps.pull.outputs.pulled == 'true'
        run: |
          PORT=${{ matrix.port }}
          if wget -qO- --timeout=10 "http://localhost:${PORT}/health/live" >/dev/null 2>&1; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "HEALTH: OK (/health/live)"
          elif wget -qO- --timeout=10 "http://localhost:${PORT}/health" >/dev/null 2>&1; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "HEALTH: OK (/health)"
          else
            echo "status=no-health-endpoint" >> "$GITHUB_OUTPUT"
            echo "HEALTH: No health endpoint found"
          fi

      # ── Swagger check + save swagger.json as artifact ──────────────────────
      # NOTE: localhost:<port> is only accessible inside the runner VM.
      # To view swagger from your browser, download the artifact and open
      # it at https://editor.swagger.io (File > Import file).
      - name: Swagger check
        id: swagger
        if: steps.pull.outputs.pulled == 'true'
        run: |
          PORT=${{ matrix.port }}
          UI_URL="http://localhost:${PORT}/swagger/index.html"
          JSON_URL="http://localhost:${PORT}/swagger/v1/swagger.json"
          mkdir -p swagger-artifacts
          if wget -qO- --timeout=10 "$UI_URL" 2>/dev/null | grep -qi "swagger"; then
            echo "status=available" >> "$GITHUB_OUTPUT"
            echo "SWAGGER: Available at $UI_URL"
            if wget -qO "swagger-artifacts/${{ matrix.name }}.json" --timeout=15 "$JSON_URL" 2>/dev/null; then
              echo "json=downloaded" >> "$GITHUB_OUTPUT"
              echo "swagger.json saved"
            else
              echo "json=unavailable" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "status=unavailable" >> "$GITHUB_OUTPUT"
            echo "json=unavailable" >> "$GITHUB_OUTPUT"
            echo "SWAGGER: Not available"
          fi

      # ── Upload swagger.json as downloadable artifact ───────────────────────
      - name: Upload swagger.json artifact
        if: steps.swagger.outputs.json == 'downloaded'
        uses: actions/upload-artifact@v4
        with:
          name: swagger-${{ matrix.module }}-${{ matrix.name }}
          path: swagger-artifacts/${{ matrix.name }}.json
          retention-days: 7

      # ── Container logs ─────────────────────────────────────────────────────
      - name: Print container logs
        if: steps.run.outputs.container != ''
        run: |
          echo "===== Logs: ${{ matrix.name }} ====="
          docker logs "${{ steps.run.outputs.container }}" 2>&1 | tail -60

      # ── Job summary ────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${TAG}"
          PORT=${{ matrix.port }}
          PULL="${{ steps.pull.outputs.pulled }}"
          HEALTH="${{ steps.health.outputs.status }}"
          SWAGGER="${{ steps.swagger.outputs.status }}"

          {
            echo "## ${{ matrix.module }} / \`${{ matrix.name }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Port | \`${PORT}\` |"
            if [[ "$PULL" == "true" ]]; then
              echo "| Pull | ✅ Success |"
            else
              echo "| Pull | ❌ Failed (image not built yet?) |"
            fi
            if [[ "$HEALTH" == "healthy" ]]; then
              echo "| Health | ✅ Healthy |"
            elif [[ "$HEALTH" == "no-health-endpoint" ]]; then
              echo "| Health | ⚠️ No /health endpoint |"
            else
              echo "| Health | — not checked |"
            fi
            if [[ "$SWAGGER" == "available" ]]; then
              echo "| Swagger | ✅ swagger.json saved as artifact |"
              echo "| View Swagger | Download artifact \`swagger-${{ matrix.module }}-${{ matrix.name }}\` → open [editor.swagger.io](https://editor.swagger.io) → File → Import file |"
            else
              echo "| Swagger | ⚠️ Not available |"
            fi
            echo ""
            echo "> ⚠️ **Why can't I open localhost?** GitHub Actions runners are cloud VMs — ports are not exposed to your local browser."
            echo "> **To browse Swagger:** download the artifact above, then drag the JSON into [editor.swagger.io](https://editor.swagger.io)."
            echo "> **To run locally:** \`\`\`docker pull ${IMAGE} && docker run -d -p ${PORT}:${PORT} -e ASPNETCORE_ENVIRONMENT=Development ${IMAGE}\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Cleanup ────────────────────────────────────────────────────────────
      - name: Stop and remove container
        if: always() && steps.run.outputs.container != ''
        run: |
          docker rm -f "${{ steps.run.outputs.container }}" || true
