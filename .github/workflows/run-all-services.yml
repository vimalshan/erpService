# Run ERP Services from GHCR
# Pulls, starts, health-checks, swagger-checks, logs, then removes each container.
# Trigger: manual (workflow_dispatch) only.

name: Run ERP Services from GHCR

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to run (or "all")'
        required: true
        default: 'adminServices'
        type: choice
        options:
          - all
          - adminServices
          - aimsServices
          - auditServices
          - AuthProvider
          - canteenServices
          - cashServices
          - ddServices
          - healthServices
          - hrServices
          - letServices
          - loanServices
          - mainsparshServices
          - myworkServices
          - payServices
          - pfServices
          - sciServices
          - sparshServices
          - sscServices
          - taskServices
          - tourServices
          - travelServices
          - wmsServices
      tag:
        description: 'Image tag (latest, main, sha...)'
        required: false
        default: 'latest'
      service:
        description: 'Single service name to run (blank = all in module)'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/erp

# ─────────────────────────────────────────────────────────────────────────────
jobs:
  setup:
    name: Resolve service matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix JSON
