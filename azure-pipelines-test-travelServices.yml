# =============================================================================
# TEST PIPELINE — travelServices  (10 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · travelServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - admin-service
      - agens-service
      - booking-service
      - travelexpense-service
      - travelfinance-service
      - insurance-service
      - masterdata-service
      - travelrequest-service
      - travel-transaction-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · travelServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/travelServices/ApiGateway' 'src/Services/travelServices/ApiGateway/Dockerfile'
              build_and_push 'admin-service' 'src/Services/travelServices/adminServices' 'src/Services/travelServices/adminServices/Dockerfile'
              build_and_push 'agens-service' 'src/Services/travelServices/agensService' 'src/Services/travelServices/agensService/Dockerfile'
              build_and_push 'booking-service' 'src/Services/travelServices/bookingServices' 'src/Services/travelServices/bookingServices/Dockerfile'
              build_and_push 'travelexpense-service' 'src/Services/travelServices/expenseServices' 'src/Services/travelServices/expenseServices/Dockerfile'
              build_and_push 'travelfinance-service' 'src/Services/travelServices/financeServices' 'src/Services/travelServices/financeServices/Dockerfile'
              build_and_push 'insurance-service' 'src/Services/travelServices/insuranceServices' 'src/Services/travelServices/insuranceServices/Dockerfile'
              build_and_push 'masterdata-service' 'src/Services/travelServices/masterdataServices' 'src/Services/travelServices/masterdataServices/Dockerfile'
              build_and_push 'travelrequest-service' 'src/Services/travelServices/travelRequestServices' 'src/Services/travelServices/travelRequestServices/Dockerfile'
              build_and_push 'travel-transaction-service' 'src/Services/travelServices/traveltransactionServices' 'src/Services/travelServices/traveltransactionServices/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · travelServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'admin-service'
              verify_svc 'agens-service'
              verify_svc 'booking-service'
              verify_svc 'travelexpense-service'
              verify_svc 'travelfinance-service'
              verify_svc 'insurance-service'
              verify_svc 'masterdata-service'
              verify_svc 'travelrequest-service'
              verify_svc 'travel-transaction-service'
            displayName: 'Pull & verify all selected images'
