# =============================================================================
# TEST PIPELINE — wmsServices  (17 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · wmsServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - auditlog-service
      - customer-service
      - employee-service
      - fleet-management-service
      - inventory-service
      - order-service
      - product-service
      - purchaseorder-service
      - rackingsystem-service
      - receiving-service
      - salesorder-service
      - security-service
      - shipment-service
      - supplier-service
      - warehousestructure-service
      - wmtransactional-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · wmsServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{{ parameters.service }}}" = "all" ] || [ "${{{ parameters.service }}}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/wmsServices/apiGateway' 'src/Services/wmsServices/apiGateway/Dockerfile'
              build_and_push 'auditlog-service' 'src/Services/wmsServices/auditlogService/AuditLogService' 'src/Services/wmsServices/auditlogService/AuditLogService/Dockerfile'
              build_and_push 'customer-service' 'src/Services/wmsServices/customerService' 'src/Services/wmsServices/customerService/Dockerfile'
              build_and_push 'employee-service' 'src/Services/wmsServices/emplyeeService' 'src/Services/wmsServices/emplyeeService/Dockerfile'
              build_and_push 'fleet-management-service' 'src/Services/wmsServices/fleetManagementService' 'src/Services/wmsServices/fleetManagementService/Dockerfile'
              build_and_push 'inventory-service' 'src/Services/wmsServices/inventoryService' 'src/Services/wmsServices/inventoryService/Dockerfile'
              build_and_push 'order-service' 'src/Services/wmsServices/orderService' 'src/Services/wmsServices/orderService/Dockerfile'
              build_and_push 'product-service' 'src/Services/wmsServices/productService' 'src/Services/wmsServices/productService/Dockerfile'
              build_and_push 'purchaseorder-service' 'src/Services/wmsServices/purchaseorderService' 'src/Services/wmsServices/purchaseorderService/Dockerfile'
              build_and_push 'rackingsystem-service' 'src/Services/wmsServices/rackingsystemService' 'src/Services/wmsServices/rackingsystemService/Dockerfile'
              build_and_push 'receiving-service' 'src/Services/wmsServices/receivingService' 'src/Services/wmsServices/receivingService/Dockerfile'
              build_and_push 'salesorder-service' 'src/Services/wmsServices/salesorderService' 'src/Services/wmsServices/salesorderService/Dockerfile'
              build_and_push 'security-service' 'src/Services/wmsServices/securityService' 'src/Services/wmsServices/securityService/Dockerfile'
              build_and_push 'shipment-service' 'src/Services/wmsServices/shipmentService' 'src/Services/wmsServices/shipmentService/Dockerfile'
              build_and_push 'supplier-service' 'src/Services/wmsServices/supplierService' 'src/Services/wmsServices/supplierService/Dockerfile'
              build_and_push 'warehousestructure-service' 'src/Services/wmsServices/warehousestructureService' 'src/Services/wmsServices/warehousestructureService/Dockerfile'
              build_and_push 'wmtransactional-service' 'src/Services/wmsServices/wmtransactionalService' 'src/Services/wmsServices/wmtransactionalService/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · wmsServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'auditlog-service'
              verify_svc 'customer-service'
              verify_svc 'employee-service'
              verify_svc 'fleet-management-service'
              verify_svc 'inventory-service'
              verify_svc 'order-service'
              verify_svc 'product-service'
              verify_svc 'purchaseorder-service'
              verify_svc 'rackingsystem-service'
              verify_svc 'receiving-service'
              verify_svc 'salesorder-service'
              verify_svc 'security-service'
              verify_svc 'shipment-service'
              verify_svc 'supplier-service'
              verify_svc 'warehousestructure-service'
              verify_svc 'wmtransactional-service'
            displayName: 'Pull & verify all selected images'
