# =============================================================================
# TEST PIPELINE — pfServices  (11 services)
#
# Purpose : Validate Build → Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_ACTOR  – your GitHub username  (vimalshan)
#   GITHUB_TOKEN  – GitHub PAT with packages:write scope  (mark secret)
# =============================================================================

name: TEST · pfServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - accounting-service
      - bank-service
      - contribution-service
      - investment-service
      - loan-service
      - masterdata-service
      - member-service
      - pf-transaction-service
      - settlement-service
      - trust-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD ──────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build · pfServices'
    jobs:
      - job: BuildImages
        displayName: Build Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -e
              build_svc() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"
                fi
              }
              build_svc 'api-gateway' 'src/Services/pfServices/apiGateway' 'src/Services/pfServices/apiGateway/Dockerfile'
              build_svc 'accounting-service' 'src/Services/pfServices/accountingServices' 'src/Services/pfServices/accountingServices/Dockerfile'
              build_svc 'bank-service' 'src/Services/pfServices/bankServices/BankService' 'src/Services/pfServices/bankServices/BankService/Dockerfile'
              build_svc 'contribution-service' 'src/Services/pfServices/contributionServices/ContributionService' 'src/Services/pfServices/contributionServices/ContributionService/Dockerfile'
              build_svc 'investment-service' 'src/Services/pfServices/investmentServices/InvestmentService' 'src/Services/pfServices/investmentServices/InvestmentService/Dockerfile'
              build_svc 'loan-service' 'src/Services/pfServices/loanServices' 'src/Services/pfServices/loanServices/Dockerfile'
              build_svc 'masterdata-service' 'src/Services/pfServices/masterdataServices/MasterDataService' 'src/Services/pfServices/masterdataServices/MasterDataService/Dockerfile'
              build_svc 'member-service' 'src/Services/pfServices/memberServices' 'src/Services/pfServices/memberServices/Dockerfile'
              build_svc 'pf-transaction-service' 'src/Services/pfServices/pftransactionalServices' 'src/Services/pfServices/pftransactionalServices/Dockerfile'
              build_svc 'settlement-service' 'src/Services/pfServices/settlementServices' 'src/Services/pfServices/settlementServices/Dockerfile'
              build_svc 'trust-service' 'src/Services/pfServices/trustServices/TrustService' 'src/Services/pfServices/trustServices/TrustService/Dockerfile'
            displayName: 'docker build all selected services'

  # ── PUSH ───────────────────────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push · pfServices → GHCR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushImages
        displayName: Push to GHCR
        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              push_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                fi
              }
              push_svc 'api-gateway'
              push_svc 'accounting-service'
              push_svc 'bank-service'
              push_svc 'contribution-service'
              push_svc 'investment-service'
              push_svc 'loan-service'
              push_svc 'masterdata-service'
              push_svc 'member-service'
              push_svc 'pf-transaction-service'
              push_svc 'settlement-service'
              push_svc 'trust-service'
            displayName: 'docker push all selected services'

  # ── VERIFY ─────────────────────────────────────────────────────────────────
  - stage: Verify
    displayName: 'Verify · pfServices'
    dependsOn: Push
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'accounting-service'
              verify_svc 'bank-service'
              verify_svc 'contribution-service'
              verify_svc 'investment-service'
              verify_svc 'loan-service'
              verify_svc 'masterdata-service'
              verify_svc 'member-service'
              verify_svc 'pf-transaction-service'
              verify_svc 'settlement-service'
              verify_svc 'trust-service'
            displayName: 'Pull & verify all selected images'
