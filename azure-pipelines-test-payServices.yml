# =============================================================================
# TEST PIPELINE — payServices  (7 services)
#
# Purpose : Validate Build → Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_ACTOR  – your GitHub username  (vimalshan)
#   GITHUB_TOKEN  – GitHub PAT with packages:write scope  (mark secret)
# =============================================================================

name: TEST · payServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - employee-service
      - faq-service
      - hr-service
      - payroll-service
      - pay-transaction-service
      - tax-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD ──────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build · payServices'
    jobs:
      - job: BuildImages
        displayName: Build Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -e
              build_svc() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"
                fi
              }
              build_svc 'api-gateway' 'src/Services/payServices/apiGateway' 'src/Services/payServices/apiGateway/Dockerfile'
              build_svc 'employee-service' 'src/Services/payServices/employeeServices' 'src/Services/payServices/employeeServices/Dockerfile'
              build_svc 'faq-service' 'src/Services/payServices/faqServices' 'src/Services/payServices/faqServices/Dockerfile'
              build_svc 'hr-service' 'src/Services/payServices/hrServices' 'src/Services/payServices/hrServices/Dockerfile'
              build_svc 'payroll-service' 'src/Services/payServices/payrollServices' 'src/Services/payServices/payrollServices/Dockerfile'
              build_svc 'pay-transaction-service' 'src/Services/payServices/payTransactionalServices' 'src/Services/payServices/payTransactionalServices/Dockerfile'
              build_svc 'tax-service' 'src/Services/payServices/taxServices' 'src/Services/payServices/taxServices/Dockerfile'
            displayName: 'docker build all selected services'

  # ── PUSH ───────────────────────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push · payServices → GHCR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushImages
        displayName: Push to GHCR
        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              push_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                fi
              }
              push_svc 'api-gateway'
              push_svc 'employee-service'
              push_svc 'faq-service'
              push_svc 'hr-service'
              push_svc 'payroll-service'
              push_svc 'pay-transaction-service'
              push_svc 'tax-service'
            displayName: 'docker push all selected services'

  # ── VERIFY ─────────────────────────────────────────────────────────────────
  - stage: Verify
    displayName: 'Verify · payServices'
    dependsOn: Push
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'employee-service'
              verify_svc 'faq-service'
              verify_svc 'hr-service'
              verify_svc 'payroll-service'
              verify_svc 'pay-transaction-service'
              verify_svc 'tax-service'
            displayName: 'Pull & verify all selected images'
