# =============================================================================
# TEST PIPELINE — sciServices  (16 services)
#
# Purpose : Validate Build+Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_TOKEN  – GitHub PAT with write:packages scope  (mark secret)
# =============================================================================

name: TEST · sciServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - dispatchplanning-service
      - errorlogging-service
      - eximmanagement-service
      - fillingoperation-service
      - gstcompliance-service
      - inventorymanagement-service
      - mamallocation-service
      - masterdata-service
      - orderschedule-service
      - productionmanagement-service
      - purchasesales-service
      - sci-transaction-service
      - security-service
      - strategicstock-service
      - vechicletracking-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  GITHUB_ACTOR: 'vimalshan'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD + PUSH (single script — login, build, push per service) ───────────
  - stage: BuildAndPush
    displayName: 'Build & Push · sciServices'
    jobs:
      - job: BuildPushImages
        displayName: Build & Push Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - bash: |
              set -euo pipefail

              # ── Validate token ──
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable."
                exit 1
              fi
              TOKEN_LEN=${#GITHUB_TOKEN}
              echo "Token length: $TOKEN_LEN chars"
              if [ "$TOKEN_LEN" -lt 36 ]; then
                echo "##[error]GITHUB_TOKEN looks invalid ($TOKEN_LEN chars). A GitHub PAT is 40+ chars."
                exit 1
              fi

              # ── Login ──
              echo "Logging in as: $(GITHUB_ACTOR)"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
              echo "GHCR login succeeded."

              # ── Build + Push helper ──
              build_and_push() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo ""
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"

                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                  echo "OK: $NAME built and pushed."
                fi
              }

              build_and_push 'api-gateway' 'src/Services/sciServices/ApiGateway' 'src/Services/sciServices/ApiGateway/Dockerfile'
              build_and_push 'dispatchplanning-service' 'src/Services/sciServices/dispatchplanningServices' 'src/Services/sciServices/dispatchplanningServices/Dockerfile'
              build_and_push 'errorlogging-service' 'src/Services/sciServices/errorloggingServices' 'src/Services/sciServices/errorloggingServices/Dockerfile'
              build_and_push 'eximmanagement-service' 'src/Services/sciServices/eximmanagementServices' 'src/Services/sciServices/eximmanagementServices/Dockerfile'
              build_and_push 'fillingoperation-service' 'src/Services/sciServices/fillingoperationServices' 'src/Services/sciServices/fillingoperationServices/Dockerfile'
              build_and_push 'gstcompliance-service' 'src/Services/sciServices/gstcomplianceServices' 'src/Services/sciServices/gstcomplianceServices/Dockerfile'
              build_and_push 'inventorymanagement-service' 'src/Services/sciServices/inventorymanagementServices' 'src/Services/sciServices/inventorymanagementServices/Dockerfile'
              build_and_push 'mamallocation-service' 'src/Services/sciServices/mamallocationServices' 'src/Services/sciServices/mamallocationServices/Dockerfile'
              build_and_push 'masterdata-service' 'src/Services/sciServices/masterdataServices' 'src/Services/sciServices/masterdataServices/Dockerfile'
              build_and_push 'orderschedule-service' 'src/Services/sciServices/orderscheduleServices' 'src/Services/sciServices/orderscheduleServices/Dockerfile'
              build_and_push 'productionmanagement-service' 'src/Services/sciServices/productionmanagementServices' 'src/Services/sciServices/productionmanagementServices/Dockerfile'
              build_and_push 'purchasesales-service' 'src/Services/sciServices/purchasesalesService' 'src/Services/sciServices/purchasesalesService/Dockerfile'
              build_and_push 'sci-transaction-service' 'src/Services/sciServices/scitransactionalServices' 'src/Services/sciServices/scitransactionalServices/Dockerfile'
              build_and_push 'security-service' 'src/Services/sciServices/SecurityServices' 'src/Services/sciServices/SecurityServices/Dockerfile'
              build_and_push 'strategicstock-service' 'src/Services/sciServices/strategicstockServices' 'src/Services/sciServices/strategicstockServices/Dockerfile'
              build_and_push 'vechicletracking-service' 'src/Services/sciServices/vechicletrackingServices' 'src/Services/sciServices/vechicletrackingServices/Dockerfile'

              echo ""
              echo "All done."
            displayName: 'Login, Build & Push all selected services'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

  # ── VERIFY (separate agent — pulls from registry) ──────────────────────────
  - stage: Verify
    displayName: 'Verify · sciServices'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set."
                exit 1
              fi
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'dispatchplanning-service'
              verify_svc 'errorlogging-service'
              verify_svc 'eximmanagement-service'
              verify_svc 'fillingoperation-service'
              verify_svc 'gstcompliance-service'
              verify_svc 'inventorymanagement-service'
              verify_svc 'mamallocation-service'
              verify_svc 'masterdata-service'
              verify_svc 'orderschedule-service'
              verify_svc 'productionmanagement-service'
              verify_svc 'purchasesales-service'
              verify_svc 'sci-transaction-service'
              verify_svc 'security-service'
              verify_svc 'strategicstock-service'
              verify_svc 'vechicletracking-service'
            displayName: 'Pull & verify all selected images'
