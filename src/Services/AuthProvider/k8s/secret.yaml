apiVersion: v1
kind: Secret
metadata:
  name: auth-provider-secrets
  namespace: auth-provider
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__AuthProviderDB: "Server=sql-server.default.svc.cluster.local;Database=AuthProviderDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
  Jwt__Secret: "AuthProviderJwtSecret_ChangeInProduction_Min32Characters!"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-provider-docker-registry
  namespace: auth-provider
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
