apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-provider-ingress
  namespace: auth-provider
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - auth-provider.example.com
    secretName: auth-provider-tls
  rules:
  - host: auth-provider.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-provider
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-provider-network-policy
  namespace: auth-provider
spec:
  podSelector:
    matchLabels:
      app: auth-provider
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: auth-provider
    - podSelector:
        matchLabels:
          app: auth-provider-client
    ports:
    - protocol: TCP
      port: 7136
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 7136
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: auth-provider
    ports:
    - protocol: TCP
      port: 1433
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
