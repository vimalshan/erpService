# ──────────────────────────────────────────────────────────────────────────────
# Production Compose — pulls pre-built images from GHCR
# Usage:  docker compose -f docker-compose.prod.yml up -d
# Images: ghcr.io/vimalshan/erp/<service>:latest (public, no login required)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── SQL Server ─────────────────────────────────────
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auth-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '512'
    ports:
      - "1436:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./Docker/init-database.sql:/init-database.sql
      - ./Docker/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20

  # ─── Auth Provider ─────────────────────────────────
  auth-provider:
    image: ghcr.io/vimalshan/erp/auth-provider:latest
    container_name: auth-provider
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5200'
      ConnectionStrings__AuthProviderDB: 'Data Source=mssql-server,1433;Initial Catalog=AuthProviderDB;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
    ports:
      - "5200:5200"
    depends_on:
      mssql-server:
        condition: service_healthy
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5200'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  auth-network:
    driver: bridge

volumes:
  mssql_data:
