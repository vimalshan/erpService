# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — DD ERP Microservices Full Stack
# Connects to existing infrastructure (erp-sqlserver, erp-rabbitmq, erp-azurite)
# on the erp-network. If you want standalone infra, run docker-compose.shared.yml first.
# Usage: docker compose -f docker-compose.yml up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY
  # ═══════════════════════════════════════════════════════════════════════════
  api-gateway:
    build:
      context: ./apiGateway
      dockerfile: Dockerfile
    container_name: dd-api-gateway
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-very-long-secret-key-change-this-in-production-at-least-32-characters}
    depends_on:
      appraisal-service:
        condition: service_started
      authorization-service:
        condition: service_started
      compensation-service:
        condition: service_started
      competency-service:
        condition: service_started
      demandmanagement-service:
        condition: service_started
      document-service:
        condition: service_started
      employee-service:
        condition: service_started
      feedback-service:
        condition: service_started
      learning-service:
        condition: service_started
      objective-service:
        condition: service_started
      other-service:
        condition: service_started
      promotion-service:
        condition: service_started
      recruitment-service:
        condition: service_started
      reporting-service:
        condition: service_started
      transaction-service:
        condition: service_started
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # MICROSERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── Appraisal Service ────────────────────────────────────────────────────
  appraisal-service:
    build:
      context: ./appraisalService
      dockerfile: Dockerfile
    container_name: dd-appraisal-service
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AppraisalDb=Server=erp-sqlserver,1433;Database=AppraisalDb;User Id=sa;Password=${DB_PASSWORD:-YourStr0ng!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - RabbitMQ__HostName=erp-rabbitmq
      - RabbitMQ__UserName=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

