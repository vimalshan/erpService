# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.shared.yml — Shared Infrastructure (SQL Server, RabbitMQ, Azurite)
# NOTE: If erp-sqlserver, erp-rabbitmq, erp-azurite are already running on
#       erp-network, skip this file and use docker-compose.yml directly with
#       the erp-network. This file is for standalone/clean deployments only.
# Usage: docker compose -f docker-compose.shared.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ─── SQL Server 2022 ──────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dd-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Developer
    ports:
      - "${SQL_PORT:-1434}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - dd-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── RabbitMQ with Management UI ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dd-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-admin123}
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - dd-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Azurite (Azure Storage Emulator) ────────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: dd-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "${AZURITE_BLOB_PORT:-10010}:10000"
      - "${AZURITE_QUEUE_PORT:-10011}:10001"
      - "${AZURITE_TABLE_PORT:-10012}:10002"
    volumes:
      - azurite-data:/data
    networks:
      - dd-network
    restart: unless-stopped

volumes:
  sqlserver-data:
    driver: local
  rabbitmq-data:
    driver: local
  azurite-data:
    driver: local

networks:
  dd-network:
    driver: bridge
    name: dd-erp-network
