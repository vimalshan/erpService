# ──────────────────────────────────────────────────────────────────────────────
# DD ERP — Kubernetes Ingress (NGINX Ingress Controller)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-erp-ingress
  namespace: dd-erp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # ── All traffic routed through API Gateway ─────────────────────────────
    - http:
        paths:
          # Gateway health & status endpoints
          - path: /gateway
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 80

          # All API traffic via gateway (Ocelot/YARP routes)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 80

          # GraphQL endpoints via gateway
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 80

          # Default catch-all → gateway
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 80
