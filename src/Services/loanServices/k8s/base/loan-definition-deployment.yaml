---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-definition
  namespace: loan-services
  labels:
    app: loan-definition
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-definition
  template:
    metadata:
      labels:
        app: loan-definition
    spec:
      containers:
        - name: loan-definition
          image: loan-definition:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: loan-services-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver,1433;Database=LOANDB;User Id=loan_app;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True;"
            - name: RabbitMq__HostName
              value: "rabbitmq"
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: loan-services-secrets
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: loan-services-secrets
                  key: RABBITMQ_PASS
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: loan-services-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: loan-definition
  namespace: loan-services
spec:
  selector:
    app: loan-definition
  ports:
    - port: 8080
      targetPort: 8080
