---
# ── Loan Transaction ──────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loan-transaction-hpa
  namespace: loan-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loan-transaction
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
