# Azure DevOps Pipeline - loanServices
# Builds and pushes all 8 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push loanServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/loanServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/loanServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - document-service
      - loanaccount-service
      - loanapplication-service
      - loandefinition-service
      - loan-transaction-service
      - lov-service
      - utility-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/loanServices/apiGateway'
              dockerfile: 'src/Services/loanServices/apiGateway/Dockerfile'
            document_service:
              imageName: 'document-service'
              context: 'src/Services/loanServices/documentServices'
              dockerfile: 'src/Services/loanServices/documentServices/Dockerfile'
            loanaccount_service:
              imageName: 'loanaccount-service'
              context: 'src/Services/loanServices/loanaccountServices'
              dockerfile: 'src/Services/loanServices/loanaccountServices/Dockerfile'
            loanapplication_service:
              imageName: 'loanapplication-service'
              context: 'src/Services/loanServices/loanapplicationServices'
              dockerfile: 'src/Services/loanServices/loanapplicationServices/Dockerfile'
            loandefinition_service:
              imageName: 'loandefinition-service'
              context: 'src/Services/loanServices/loandefinitionServices'
              dockerfile: 'src/Services/loanServices/loandefinitionServices/Dockerfile'
            loan_transaction_service:
              imageName: 'loan-transaction-service'
              context: 'src/Services/loanServices/loanTransactionServices'
              dockerfile: 'src/Services/loanServices/loanTransactionServices/Dockerfile'
            lov_service:
              imageName: 'lov-service'
              context: 'src/Services/loanServices/lovServices'
              dockerfile: 'src/Services/loanServices/lovServices/Dockerfile'
            utility_service:
              imageName: 'utility-service'
              context: 'src/Services/loanServices/utilityServices'
              dockerfile: 'src/Services/loanServices/utilityServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/loanServices/apiGateway'
              dockerfile: 'src/Services/loanServices/apiGateway/Dockerfile'
            document_service:
              imageName: 'document-service'
              context: 'src/Services/loanServices/documentServices'
              dockerfile: 'src/Services/loanServices/documentServices/Dockerfile'
            loanaccount_service:
              imageName: 'loanaccount-service'
              context: 'src/Services/loanServices/loanaccountServices'
              dockerfile: 'src/Services/loanServices/loanaccountServices/Dockerfile'
            loanapplication_service:
              imageName: 'loanapplication-service'
              context: 'src/Services/loanServices/loanapplicationServices'
              dockerfile: 'src/Services/loanServices/loanapplicationServices/Dockerfile'
            loandefinition_service:
              imageName: 'loandefinition-service'
              context: 'src/Services/loanServices/loandefinitionServices'
              dockerfile: 'src/Services/loanServices/loandefinitionServices/Dockerfile'
            loan_transaction_service:
              imageName: 'loan-transaction-service'
              context: 'src/Services/loanServices/loanTransactionServices'
              dockerfile: 'src/Services/loanServices/loanTransactionServices/Dockerfile'
            lov_service:
              imageName: 'lov-service'
              context: 'src/Services/loanServices/lovServices'
              dockerfile: 'src/Services/loanServices/lovServices/Dockerfile'
            utility_service:
              imageName: 'utility-service'
              context: 'src/Services/loanServices/utilityServices'
              dockerfile: 'src/Services/loanServices/utilityServices/Dockerfile'

        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/loanServices/apiGateway'
              dockerfile: 'src/Services/loanServices/apiGateway/Dockerfile'
            document_service:
              imageName: 'document-service'
              context: 'src/Services/loanServices/documentServices'
              dockerfile: 'src/Services/loanServices/documentServices/Dockerfile'
            loanaccount_service:
              imageName: 'loanaccount-service'
              context: 'src/Services/loanServices/loanaccountServices'
              dockerfile: 'src/Services/loanServices/loanaccountServices/Dockerfile'
            loanapplication_service:
              imageName: 'loanapplication-service'
              context: 'src/Services/loanServices/loanapplicationServices'
              dockerfile: 'src/Services/loanServices/loanapplicationServices/Dockerfile'
            loandefinition_service:
              imageName: 'loandefinition-service'
              context: 'src/Services/loanServices/loandefinitionServices'
              dockerfile: 'src/Services/loanServices/loandefinitionServices/Dockerfile'
            loan_transaction_service:
              imageName: 'loan-transaction-service'
              context: 'src/Services/loanServices/loanTransactionServices'
              dockerfile: 'src/Services/loanServices/loanTransactionServices/Dockerfile'
            lov_service:
              imageName: 'lov-service'
              context: 'src/Services/loanServices/lovServices'
              dockerfile: 'src/Services/loanServices/lovServices/Dockerfile'
            utility_service:
              imageName: 'utility-service'
              context: 'src/Services/loanServices/utilityServices'
              dockerfile: 'src/Services/loanServices/utilityServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
