apiVersion: v1
kind: ConfigMap
metadata:
  name: project-config
  namespace: erp
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:80
  RabbitMQ__HostName: rabbitmq
  RabbitMQ__Port: "5672"
  Jwt__Issuer: ProjectService.API
  Jwt__Audience: ProjectService.Clients
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: erp/project-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: project-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver;Database=MYWORKDB;User Id=sa;Password=$(DB_SA_PASSWORD);TrustServerCertificate=True;MultipleActiveResultSets=True;Application Name=ProjectService"
            - name: DB_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: db-sa-password
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-pass
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: jwt-key-project
            - name: ConnectionStrings__AzureBlobStorage
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: azure-blob-connection-string
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: erp
spec:
  selector:
    app: project-service
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
