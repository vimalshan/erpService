# Azure DevOps Pipeline - sparshServices
# Builds and pushes all 6 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push sparshServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/sparshServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/sparshServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - employeepridemanagement-service
      - mobileappmanagement-service
      - mobileexpense-service
      - problemmanagement-service
      - sparsh-transaction-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/sparshServices/apigateway/SparshApiGateway'
          dockerfile: 'src/Services/sparshServices/apigateway/SparshApiGateway/Dockerfile'
        employeepridemanagement_service:
          imageName: 'employeepridemanagement-service'
          context: 'src/Services/sparshServices/employeepridemanagementServices'
          dockerfile: 'src/Services/sparshServices/employeepridemanagementServices/Dockerfile'
        mobileappmanagement_service:
          imageName: 'mobileappmanagement-service'
          context: 'src/Services/sparshServices/mobileappmanagementServices'
          dockerfile: 'src/Services/sparshServices/mobileappmanagementServices/Dockerfile'
        mobileexpense_service:
          imageName: 'mobileexpense-service'
          context: 'src/Services/sparshServices/mobileexpenseServices'
          dockerfile: 'src/Services/sparshServices/mobileexpenseServices/Dockerfile'
        problemmanagement_service:
          imageName: 'problemmanagement-service'
          context: 'src/Services/sparshServices/problemmanagementServices/ProblemManagement'
          dockerfile: 'src/Services/sparshServices/problemmanagementServices/ProblemManagement/Dockerfile'
        sparsh_transaction_service:
          imageName: 'sparsh-transaction-service'
          context: 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional'
          dockerfile: 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/sparshServices/apigateway/SparshApiGateway'
          dockerfile: 'src/Services/sparshServices/apigateway/SparshApiGateway/Dockerfile'
        employeepridemanagement_service:
          imageName: 'employeepridemanagement-service'
          context: 'src/Services/sparshServices/employeepridemanagementServices'
          dockerfile: 'src/Services/sparshServices/employeepridemanagementServices/Dockerfile'
        mobileappmanagement_service:
          imageName: 'mobileappmanagement-service'
          context: 'src/Services/sparshServices/mobileappmanagementServices'
          dockerfile: 'src/Services/sparshServices/mobileappmanagementServices/Dockerfile'
        mobileexpense_service:
          imageName: 'mobileexpense-service'
          context: 'src/Services/sparshServices/mobileexpenseServices'
          dockerfile: 'src/Services/sparshServices/mobileexpenseServices/Dockerfile'
        problemmanagement_service:
          imageName: 'problemmanagement-service'
          context: 'src/Services/sparshServices/problemmanagementServices/ProblemManagement'
          dockerfile: 'src/Services/sparshServices/problemmanagementServices/ProblemManagement/Dockerfile'
        sparsh_transaction_service:
          imageName: 'sparsh-transaction-service'
          context: 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional'
          dockerfile: 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional/Dockerfile'

        steps:
          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: ghcr-service-connection

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/sparshServices/apigateway/SparshApiGateway'
          dockerfile: 'src/Services/sparshServices/apigateway/SparshApiGateway/Dockerfile'
        employeepridemanagement_service:
          imageName: 'employeepridemanagement-service'
          context: 'src/Services/sparshServices/employeepridemanagementServices'
          dockerfile: 'src/Services/sparshServices/employeepridemanagementServices/Dockerfile'
        mobileappmanagement_service:
          imageName: 'mobileappmanagement-service'
          context: 'src/Services/sparshServices/mobileappmanagementServices'
          dockerfile: 'src/Services/sparshServices/mobileappmanagementServices/Dockerfile'
        mobileexpense_service:
          imageName: 'mobileexpense-service'
          context: 'src/Services/sparshServices/mobileexpenseServices'
          dockerfile: 'src/Services/sparshServices/mobileexpenseServices/Dockerfile'
        problemmanagement_service:
          imageName: 'problemmanagement-service'
          context: 'src/Services/sparshServices/problemmanagementServices/ProblemManagement'
          dockerfile: 'src/Services/sparshServices/problemmanagementServices/ProblemManagement/Dockerfile'
        sparsh_transaction_service:
          imageName: 'sparsh-transaction-service'
          context: 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional'
          dockerfile: 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
