apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: sparsh
  labels:
    app: db-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-sql
          image: mcr.microsoft.com/mssql-tools:latest
          command: ['sh', '-c']
          args:
            - |
              until /opt/mssql-tools18/bin/sqlcmd -S sqlserver-svc -U sa -P "$SQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; do
                echo "Waiting for SQL Server..."
                sleep 5
              done
              echo "SQL Server is ready!"
          env:
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: SQL_SA_PASSWORD
      containers:
        - name: db-init
          image: mcr.microsoft.com/mssql-tools:latest
          command: ['sh', '-c']
          args:
            - /opt/mssql-tools18/bin/sqlcmd -S sqlserver-svc -U sa -P "$SQL_SA_PASSWORD" -C -i /scripts/01_init_databases.sql
          env:
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: SQL_SA_PASSWORD
          volumeMounts:
            - name: db-scripts
              mountPath: /scripts
      volumes:
        - name: db-scripts
          configMap:
            name: db-init-scripts
