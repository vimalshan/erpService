apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sparsh
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ${DOCKER_REGISTRY}/sparsh-api-gateway:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver-svc,1433;Database=SPARSHDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True;MultipleActiveResultSets=true"
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: SQL_SA_PASSWORD
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: JWT_SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: sparsh
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
