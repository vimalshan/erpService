apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactional-api
  namespace: sparsh
  labels:
    app: transactional-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transactional-api
  template:
    metadata:
      labels:
        app: transactional-api
    spec:
      containers:
        - name: transactional-api
          image: ${DOCKER_REGISTRY}/sparsh-transactional-api:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver-svc,1433;Database=SparshTransactionalDb;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True;MultipleActiveResultSets=true"
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: SQL_SA_PASSWORD
            - name: RabbitMQ__HostName
              value: "rabbitmq-svc"
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: RABBITMQ_PASSWORD
            - name: RabbitMQ__VirtualHost
              value: "sparsh"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: sparsh-secrets
                  key: JWT_SECRET_KEY
            - name: Features__EnableRabbitMq
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: transactional-api-svc
  namespace: sparsh
spec:
  selector:
    app: transactional-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
