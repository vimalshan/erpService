# ═══════════════════════════════════════════════════════════════════════
# API Gateway — Deployment + Service + Ingress
# ═══════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: let-erp
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: let-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ${REGISTRY:-letregistry}/api-gateway:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: let-erp-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver-svc;Database=LETDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True"
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: let-erp-secrets
                  key: sql-sa-password
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: let-erp-secrets
                  key: rabbitmq-password
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: let-erp-secrets
                  key: jwt-secret-key
            - name: ReverseProxy__Clusters__leave-cluster__Destinations__leave-d1__Address
              value: "http://leave-svc:8080"
            - name: ReverseProxy__Clusters__course-cluster__Destinations__course-d1__Address
              value: "http://course-svc:8080"
            - name: ReverseProxy__Clusters__request-cluster__Destinations__request-d1__Address
              value: "http://request-svc:8080"
            - name: ReverseProxy__Clusters__review-cluster__Destinations__review-d1__Address
              value: "http://review-svc:8080"
            - name: ReverseProxy__Clusters__development-cluster__Destinations__development-d1__Address
              value: "http://development-svc:8080"
            - name: ReverseProxy__Clusters__master-cluster__Destinations__master-d1__Address
              value: "http://master-svc:8080"
            - name: ReverseProxy__Clusters__let-transaction-cluster__Destinations__let-d1__Address
              value: "http://let-transaction-svc:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: let-erp-ingress
  namespace: let-erp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: let-erp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 80
