# ─── Leave Service ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: leave-svc
  namespace: let-erp
  labels:
    app: leave-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: leave-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leave-service
  namespace: let-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leave-service
  template:
    metadata:
      labels:
        app: leave-service
    spec:
      containers:
        - name: leave-service
          image: ${REGISTRY:-letregistry}/leave-service:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: let-erp-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver-svc;Database=LETDB;User Id=sa;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True"
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: let-erp-secrets
                  key: sql-sa-password
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: let-erp-secrets
                  key: rabbitmq-password
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: let-erp-secrets
                  key: jwt-secret-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30

