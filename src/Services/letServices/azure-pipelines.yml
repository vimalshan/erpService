# Azure DevOps Pipeline - letServices
# Builds and pushes all 8 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push letServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/letServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/letServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - course-service
      - development-service
      - leave-service
      - let-transaction-service
      - master-service
      - request-service
      - review-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/letServices/apiGateway'
          dockerfile: 'src/Services/letServices/apiGateway/Dockerfile'
        course_service:
          imageName: 'course-service'
          context: 'src/Services/letServices/courseServices'
          dockerfile: 'src/Services/letServices/courseServices/Dockerfile'
        development_service:
          imageName: 'development-service'
          context: 'src/Services/letServices/developmentServices'
          dockerfile: 'src/Services/letServices/developmentServices/Dockerfile'
        leave_service:
          imageName: 'leave-service'
          context: 'src/Services/letServices/leaveServices'
          dockerfile: 'src/Services/letServices/leaveServices/Dockerfile'
        let_transaction_service:
          imageName: 'let-transaction-service'
          context: 'src/Services/letServices/letTransactionServices'
          dockerfile: 'src/Services/letServices/letTransactionServices/Dockerfile'
        master_service:
          imageName: 'master-service'
          context: 'src/Services/letServices/masterServices'
          dockerfile: 'src/Services/letServices/masterServices/Dockerfile'
        request_service:
          imageName: 'request-service'
          context: 'src/Services/letServices/requestServices'
          dockerfile: 'src/Services/letServices/requestServices/Dockerfile'
        review_service:
          imageName: 'review-service'
          context: 'src/Services/letServices/reviewServices'
          dockerfile: 'src/Services/letServices/reviewServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/letServices/apiGateway'
          dockerfile: 'src/Services/letServices/apiGateway/Dockerfile'
        course_service:
          imageName: 'course-service'
          context: 'src/Services/letServices/courseServices'
          dockerfile: 'src/Services/letServices/courseServices/Dockerfile'
        development_service:
          imageName: 'development-service'
          context: 'src/Services/letServices/developmentServices'
          dockerfile: 'src/Services/letServices/developmentServices/Dockerfile'
        leave_service:
          imageName: 'leave-service'
          context: 'src/Services/letServices/leaveServices'
          dockerfile: 'src/Services/letServices/leaveServices/Dockerfile'
        let_transaction_service:
          imageName: 'let-transaction-service'
          context: 'src/Services/letServices/letTransactionServices'
          dockerfile: 'src/Services/letServices/letTransactionServices/Dockerfile'
        master_service:
          imageName: 'master-service'
          context: 'src/Services/letServices/masterServices'
          dockerfile: 'src/Services/letServices/masterServices/Dockerfile'
        request_service:
          imageName: 'request-service'
          context: 'src/Services/letServices/requestServices'
          dockerfile: 'src/Services/letServices/requestServices/Dockerfile'
        review_service:
          imageName: 'review-service'
          context: 'src/Services/letServices/reviewServices'
          dockerfile: 'src/Services/letServices/reviewServices/Dockerfile'

        steps:
          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: ghcr-service-connection

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/letServices/apiGateway'
          dockerfile: 'src/Services/letServices/apiGateway/Dockerfile'
        course_service:
          imageName: 'course-service'
          context: 'src/Services/letServices/courseServices'
          dockerfile: 'src/Services/letServices/courseServices/Dockerfile'
        development_service:
          imageName: 'development-service'
          context: 'src/Services/letServices/developmentServices'
          dockerfile: 'src/Services/letServices/developmentServices/Dockerfile'
        leave_service:
          imageName: 'leave-service'
          context: 'src/Services/letServices/leaveServices'
          dockerfile: 'src/Services/letServices/leaveServices/Dockerfile'
        let_transaction_service:
          imageName: 'let-transaction-service'
          context: 'src/Services/letServices/letTransactionServices'
          dockerfile: 'src/Services/letServices/letTransactionServices/Dockerfile'
        master_service:
          imageName: 'master-service'
          context: 'src/Services/letServices/masterServices'
          dockerfile: 'src/Services/letServices/masterServices/Dockerfile'
        request_service:
          imageName: 'request-service'
          context: 'src/Services/letServices/requestServices'
          dockerfile: 'src/Services/letServices/requestServices/Dockerfile'
        review_service:
          imageName: 'review-service'
          context: 'src/Services/letServices/reviewServices'
          dockerfile: 'src/Services/letServices/reviewServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
