version: '3.8'

services:
  # ============================================================
  # Infrastructure Services
  # ============================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scidb-sqlserver
    environment:
      SA_PASSWORD: "SciDb@Str0ngP@ss!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sci-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SciDb@Str0ngP@ss!" -Q "SELECT 1" -C -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sci-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sci_admin
      RABBITMQ_DEFAULT_PASS: "SciRabbit@2026!"
      RABBITMQ_DEFAULT_VHOST: sci_vhost
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - sci-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ============================================================
  # API Gateway
  # ============================================================
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: sci-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SCIDB;User Id=sa;Password=SciDb@Str0ngP@ss!;TrustServerCertificate=true
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32Characters!
      - Jwt__Issuer=ERPMicroservice
      - Jwt__Audience=ERPMicroservice
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=sci_admin
      - RabbitMQ__Password=SciRabbit@2026!
      - RabbitMQ__VirtualHost=sci_vhost
    ports:
      - "5200:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sci-network
    restart: unless-stopped

