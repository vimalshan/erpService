version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: orderschedule_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - orderschedule_network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orderschedule_sqlserver
    environment:
      SA_PASSWORD: "YourPassword123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourPassword123!" -Q "SELECT 1"
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - orderschedule_network
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: OrderScheduleService.API/Dockerfile
    container_name: orderschedule_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderScheduleDB;User Id=sa;Password=YourPassword123!;Encrypt=false;TrustServerCertificate=false;"
      RabbitMq__HostName: rabbitmq
    ports:
      - "5000:80"
      - "5001:443"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderschedule_network

volumes:
  sqlserver_data:

networks:
  orderschedule_network:
    driver: bridge
