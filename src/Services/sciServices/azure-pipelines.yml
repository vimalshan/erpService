# Azure DevOps Pipeline - sciServices
# Builds and pushes all 16 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push sciServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/sciServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/sciServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - dispatchplanning-service
      - errorlogging-service
      - eximmanagement-service
      - fillingoperation-service
      - gstcompliance-service
      - inventorymanagement-service
      - mamallocation-service
      - masterdata-service
      - orderschedule-service
      - productionmanagement-service
      - purchasesales-service
      - sci-transaction-service
      - security-service
      - strategicstock-service
      - vechicletracking-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/sciServices/ApiGateway'
              dockerfile: 'src/Services/sciServices/ApiGateway/Dockerfile'
            dispatchplanning_service:
              imageName: 'dispatchplanning-service'
              context: 'src/Services/sciServices/dispatchplanningServices'
              dockerfile: 'src/Services/sciServices/dispatchplanningServices/Dockerfile'
            errorlogging_service:
              imageName: 'errorlogging-service'
              context: 'src/Services/sciServices/errorloggingServices'
              dockerfile: 'src/Services/sciServices/errorloggingServices/Dockerfile'
            eximmanagement_service:
              imageName: 'eximmanagement-service'
              context: 'src/Services/sciServices/eximmanagementServices'
              dockerfile: 'src/Services/sciServices/eximmanagementServices/Dockerfile'
            fillingoperation_service:
              imageName: 'fillingoperation-service'
              context: 'src/Services/sciServices/fillingoperationServices'
              dockerfile: 'src/Services/sciServices/fillingoperationServices/Dockerfile'
            gstcompliance_service:
              imageName: 'gstcompliance-service'
              context: 'src/Services/sciServices/gstcomplianceServices'
              dockerfile: 'src/Services/sciServices/gstcomplianceServices/Dockerfile'
            inventorymanagement_service:
              imageName: 'inventorymanagement-service'
              context: 'src/Services/sciServices/inventorymanagementServices'
              dockerfile: 'src/Services/sciServices/inventorymanagementServices/Dockerfile'
            mamallocation_service:
              imageName: 'mamallocation-service'
              context: 'src/Services/sciServices/mamallocationServices'
              dockerfile: 'src/Services/sciServices/mamallocationServices/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/sciServices/masterdataServices'
              dockerfile: 'src/Services/sciServices/masterdataServices/Dockerfile'
            orderschedule_service:
              imageName: 'orderschedule-service'
              context: 'src/Services/sciServices/orderscheduleServices'
              dockerfile: 'src/Services/sciServices/orderscheduleServices/Dockerfile'
            productionmanagement_service:
              imageName: 'productionmanagement-service'
              context: 'src/Services/sciServices/productionmanagementServices'
              dockerfile: 'src/Services/sciServices/productionmanagementServices/Dockerfile'
            purchasesales_service:
              imageName: 'purchasesales-service'
              context: 'src/Services/sciServices/purchasesalesService'
              dockerfile: 'src/Services/sciServices/purchasesalesService/Dockerfile'
            sci_transaction_service:
              imageName: 'sci-transaction-service'
              context: 'src/Services/sciServices/scitransactionalServices'
              dockerfile: 'src/Services/sciServices/scitransactionalServices/Dockerfile'
            security_service:
              imageName: 'security-service'
              context: 'src/Services/sciServices/SecurityServices'
              dockerfile: 'src/Services/sciServices/SecurityServices/Dockerfile'
            strategicstock_service:
              imageName: 'strategicstock-service'
              context: 'src/Services/sciServices/strategicstockServices'
              dockerfile: 'src/Services/sciServices/strategicstockServices/Dockerfile'
            vechicletracking_service:
              imageName: 'vechicletracking-service'
              context: 'src/Services/sciServices/vechicletrackingServices'
              dockerfile: 'src/Services/sciServices/vechicletrackingServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/sciServices/ApiGateway'
              dockerfile: 'src/Services/sciServices/ApiGateway/Dockerfile'
            dispatchplanning_service:
              imageName: 'dispatchplanning-service'
              context: 'src/Services/sciServices/dispatchplanningServices'
              dockerfile: 'src/Services/sciServices/dispatchplanningServices/Dockerfile'
            errorlogging_service:
              imageName: 'errorlogging-service'
              context: 'src/Services/sciServices/errorloggingServices'
              dockerfile: 'src/Services/sciServices/errorloggingServices/Dockerfile'
            eximmanagement_service:
              imageName: 'eximmanagement-service'
              context: 'src/Services/sciServices/eximmanagementServices'
              dockerfile: 'src/Services/sciServices/eximmanagementServices/Dockerfile'
            fillingoperation_service:
              imageName: 'fillingoperation-service'
              context: 'src/Services/sciServices/fillingoperationServices'
              dockerfile: 'src/Services/sciServices/fillingoperationServices/Dockerfile'
            gstcompliance_service:
              imageName: 'gstcompliance-service'
              context: 'src/Services/sciServices/gstcomplianceServices'
              dockerfile: 'src/Services/sciServices/gstcomplianceServices/Dockerfile'
            inventorymanagement_service:
              imageName: 'inventorymanagement-service'
              context: 'src/Services/sciServices/inventorymanagementServices'
              dockerfile: 'src/Services/sciServices/inventorymanagementServices/Dockerfile'
            mamallocation_service:
              imageName: 'mamallocation-service'
              context: 'src/Services/sciServices/mamallocationServices'
              dockerfile: 'src/Services/sciServices/mamallocationServices/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/sciServices/masterdataServices'
              dockerfile: 'src/Services/sciServices/masterdataServices/Dockerfile'
            orderschedule_service:
              imageName: 'orderschedule-service'
              context: 'src/Services/sciServices/orderscheduleServices'
              dockerfile: 'src/Services/sciServices/orderscheduleServices/Dockerfile'
            productionmanagement_service:
              imageName: 'productionmanagement-service'
              context: 'src/Services/sciServices/productionmanagementServices'
              dockerfile: 'src/Services/sciServices/productionmanagementServices/Dockerfile'
            purchasesales_service:
              imageName: 'purchasesales-service'
              context: 'src/Services/sciServices/purchasesalesService'
              dockerfile: 'src/Services/sciServices/purchasesalesService/Dockerfile'
            sci_transaction_service:
              imageName: 'sci-transaction-service'
              context: 'src/Services/sciServices/scitransactionalServices'
              dockerfile: 'src/Services/sciServices/scitransactionalServices/Dockerfile'
            security_service:
              imageName: 'security-service'
              context: 'src/Services/sciServices/SecurityServices'
              dockerfile: 'src/Services/sciServices/SecurityServices/Dockerfile'
            strategicstock_service:
              imageName: 'strategicstock-service'
              context: 'src/Services/sciServices/strategicstockServices'
              dockerfile: 'src/Services/sciServices/strategicstockServices/Dockerfile'
            vechicletracking_service:
              imageName: 'vechicletracking-service'
              context: 'src/Services/sciServices/vechicletrackingServices'
              dockerfile: 'src/Services/sciServices/vechicletrackingServices/Dockerfile'

        steps:
          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: ghcr-service-connection

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/sciServices/ApiGateway'
              dockerfile: 'src/Services/sciServices/ApiGateway/Dockerfile'
            dispatchplanning_service:
              imageName: 'dispatchplanning-service'
              context: 'src/Services/sciServices/dispatchplanningServices'
              dockerfile: 'src/Services/sciServices/dispatchplanningServices/Dockerfile'
            errorlogging_service:
              imageName: 'errorlogging-service'
              context: 'src/Services/sciServices/errorloggingServices'
              dockerfile: 'src/Services/sciServices/errorloggingServices/Dockerfile'
            eximmanagement_service:
              imageName: 'eximmanagement-service'
              context: 'src/Services/sciServices/eximmanagementServices'
              dockerfile: 'src/Services/sciServices/eximmanagementServices/Dockerfile'
            fillingoperation_service:
              imageName: 'fillingoperation-service'
              context: 'src/Services/sciServices/fillingoperationServices'
              dockerfile: 'src/Services/sciServices/fillingoperationServices/Dockerfile'
            gstcompliance_service:
              imageName: 'gstcompliance-service'
              context: 'src/Services/sciServices/gstcomplianceServices'
              dockerfile: 'src/Services/sciServices/gstcomplianceServices/Dockerfile'
            inventorymanagement_service:
              imageName: 'inventorymanagement-service'
              context: 'src/Services/sciServices/inventorymanagementServices'
              dockerfile: 'src/Services/sciServices/inventorymanagementServices/Dockerfile'
            mamallocation_service:
              imageName: 'mamallocation-service'
              context: 'src/Services/sciServices/mamallocationServices'
              dockerfile: 'src/Services/sciServices/mamallocationServices/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/sciServices/masterdataServices'
              dockerfile: 'src/Services/sciServices/masterdataServices/Dockerfile'
            orderschedule_service:
              imageName: 'orderschedule-service'
              context: 'src/Services/sciServices/orderscheduleServices'
              dockerfile: 'src/Services/sciServices/orderscheduleServices/Dockerfile'
            productionmanagement_service:
              imageName: 'productionmanagement-service'
              context: 'src/Services/sciServices/productionmanagementServices'
              dockerfile: 'src/Services/sciServices/productionmanagementServices/Dockerfile'
            purchasesales_service:
              imageName: 'purchasesales-service'
              context: 'src/Services/sciServices/purchasesalesService'
              dockerfile: 'src/Services/sciServices/purchasesalesService/Dockerfile'
            sci_transaction_service:
              imageName: 'sci-transaction-service'
              context: 'src/Services/sciServices/scitransactionalServices'
              dockerfile: 'src/Services/sciServices/scitransactionalServices/Dockerfile'
            security_service:
              imageName: 'security-service'
              context: 'src/Services/sciServices/SecurityServices'
              dockerfile: 'src/Services/sciServices/SecurityServices/Dockerfile'
            strategicstock_service:
              imageName: 'strategicstock-service'
              context: 'src/Services/sciServices/strategicstockServices'
              dockerfile: 'src/Services/sciServices/strategicstockServices/Dockerfile'
            vechicletracking_service:
              imageName: 'vechicletracking-service'
              context: 'src/Services/sciServices/vechicletrackingServices'
              dockerfile: 'src/Services/sciServices/vechicletrackingServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
