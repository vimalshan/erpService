apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-management
  namespace: sci-erp
  labels:
    app: production-management
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-management
  template:
    metadata:
      labels:
        app: production-management
        tier: backend
    spec:
      initContainers:
        - name: wait-for-sqlserver
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z sqlserver-service 1433; do echo waiting for sqlserver; sleep 3; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq-service 5672; do echo waiting for rabbitmq; sleep 3; done']
      containers:
        - name: production-management
          image: sci-erp/production-management:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: sci-erp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: sci-erp-secrets
                  key: db-connection-string
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: sci-erp-secrets
                  key: jwt-secret
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: sci-erp-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: sci-erp-config
                  key: JWT_AUDIENCE
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: sci-erp-config
                  key: RABBITMQ_HOSTNAME
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: sci-erp-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: sci-erp-secrets
                  key: rabbitmq-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: production-management-service
  namespace: sci-erp
spec:
  selector:
    app: production-management
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: production-management-hpa
  namespace: sci-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: production-management
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
