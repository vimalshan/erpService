# ──────────────────────────────────────────────────────────────────────────────
# Production Compose — pulls pre-built images from GHCR
# Usage:  docker compose -f docker-compose.prod.yml up -d
# Images: ghcr.io/vimalshan/erp/<service>:latest (public, no login required)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── SQL Server ─────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: audit-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'ErpStr0ng!Pass'
      MSSQL_PID: 'Developer'
      MSSQL_MEMORY_LIMIT_MB: '512'
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./deploy/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - audit-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ErpStr0ng!Pass' -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20
    restart: unless-stopped

  # ─── DB Initializer (runs init.sql once) ────────────
  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: audit-db-init
    environment:
      SQL_SA_PASSWORD: 'ErpStr0ng!Pass'
      SQL_HOST: 'sqlserver'
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./:/workspace:ro
    command: >
      /bin/bash /workspace/deploy/scripts/init-compose-db.sh
    networks:
      - audit-network
    restart: "no"

  # ─── RabbitMQ ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: audit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'erpadmin'
      RABBITMQ_DEFAULT_PASS: 'ErpR@bbit1'
      RABBITMQ_DEFAULT_VHOST: 'erp'
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  # ─── Action Service ────────────────────────────────
  action-service:
    build:
      context: ./actionapiServices
      dockerfile: Dockerfile
    image: ghcr.io/vimalshan/erp/action-service:latest
    container_name: audit-action-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:8080'
      ConnectionStrings__DefaultConnection: 'Server=sqlserver,1433;Database=ERPActionDB;User Id=sa;Password=ErpStr0ng!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;'
      RabbitMQ__Enabled: 'true'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__VirtualHost: 'erp'
      RabbitMQ__Username: 'erpadmin'
      RabbitMQ__Password: 'ErpR@bbit1'
      Jwt__Key: 'AuthProviderSuperSecretKey_ChangeInProduction_Min32Chars!'
      Jwt__Issuer: 'AuthProvider'
      Jwt__Audience: 'AuthProviderClients'
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - audit-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

