# Azure DevOps Pipeline - auditServices
# Builds and pushes all 10 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push auditServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/auditServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/auditServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - action-service
      - audit-service
      - certificate-service
      - contract-service
      - finance-service
      - findings-service
      - notification-service
      - schedule-service
      - settings-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/auditServices/apigateway'
              dockerfile: 'src/Services/auditServices/apigateway/Dockerfile'
            action_service:
              imageName: 'action-service'
              context: 'src/Services/auditServices/actionapiServices'
              dockerfile: 'src/Services/auditServices/actionapiServices/Dockerfile'
            audit_service:
              imageName: 'audit-service'
              context: 'src/Services/auditServices/auditapiServices'
              dockerfile: 'src/Services/auditServices/auditapiServices/Dockerfile'
            certificate_service:
              imageName: 'certificate-service'
              context: 'src/Services/auditServices/certificateapiServices'
              dockerfile: 'src/Services/auditServices/certificateapiServices/Dockerfile'
            contract_service:
              imageName: 'contract-service'
              context: 'src/Services/auditServices/contractapiServices'
              dockerfile: 'src/Services/auditServices/contractapiServices/Dockerfile'
            finance_service:
              imageName: 'finance-service'
              context: 'src/Services/auditServices/financeapiServices'
              dockerfile: 'src/Services/auditServices/financeapiServices/Dockerfile'
            findings_service:
              imageName: 'findings-service'
              context: 'src/Services/auditServices/findingsapiServices'
              dockerfile: 'src/Services/auditServices/findingsapiServices/Dockerfile'
            notification_service:
              imageName: 'notification-service'
              context: 'src/Services/auditServices/notificationapiServices'
              dockerfile: 'src/Services/auditServices/notificationapiServices/Dockerfile'
            schedule_service:
              imageName: 'schedule-service'
              context: 'src/Services/auditServices/scheduleapiServices'
              dockerfile: 'src/Services/auditServices/scheduleapiServices/Dockerfile'
            settings_service:
              imageName: 'settings-service'
              context: 'src/Services/auditServices/settingsapiServices'
              dockerfile: 'src/Services/auditServices/settingsapiServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/auditServices/apigateway'
              dockerfile: 'src/Services/auditServices/apigateway/Dockerfile'
            action_service:
              imageName: 'action-service'
              context: 'src/Services/auditServices/actionapiServices'
              dockerfile: 'src/Services/auditServices/actionapiServices/Dockerfile'
            audit_service:
              imageName: 'audit-service'
              context: 'src/Services/auditServices/auditapiServices'
              dockerfile: 'src/Services/auditServices/auditapiServices/Dockerfile'
            certificate_service:
              imageName: 'certificate-service'
              context: 'src/Services/auditServices/certificateapiServices'
              dockerfile: 'src/Services/auditServices/certificateapiServices/Dockerfile'
            contract_service:
              imageName: 'contract-service'
              context: 'src/Services/auditServices/contractapiServices'
              dockerfile: 'src/Services/auditServices/contractapiServices/Dockerfile'
            finance_service:
              imageName: 'finance-service'
              context: 'src/Services/auditServices/financeapiServices'
              dockerfile: 'src/Services/auditServices/financeapiServices/Dockerfile'
            findings_service:
              imageName: 'findings-service'
              context: 'src/Services/auditServices/findingsapiServices'
              dockerfile: 'src/Services/auditServices/findingsapiServices/Dockerfile'
            notification_service:
              imageName: 'notification-service'
              context: 'src/Services/auditServices/notificationapiServices'
              dockerfile: 'src/Services/auditServices/notificationapiServices/Dockerfile'
            schedule_service:
              imageName: 'schedule-service'
              context: 'src/Services/auditServices/scheduleapiServices'
              dockerfile: 'src/Services/auditServices/scheduleapiServices/Dockerfile'
            settings_service:
              imageName: 'settings-service'
              context: 'src/Services/auditServices/settingsapiServices'
              dockerfile: 'src/Services/auditServices/settingsapiServices/Dockerfile'

        steps:
          - checkout: none

          - script: |
              echo "$(GITHUB_TOKEN)" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/auditServices/apigateway'
              dockerfile: 'src/Services/auditServices/apigateway/Dockerfile'
            action_service:
              imageName: 'action-service'
              context: 'src/Services/auditServices/actionapiServices'
              dockerfile: 'src/Services/auditServices/actionapiServices/Dockerfile'
            audit_service:
              imageName: 'audit-service'
              context: 'src/Services/auditServices/auditapiServices'
              dockerfile: 'src/Services/auditServices/auditapiServices/Dockerfile'
            certificate_service:
              imageName: 'certificate-service'
              context: 'src/Services/auditServices/certificateapiServices'
              dockerfile: 'src/Services/auditServices/certificateapiServices/Dockerfile'
            contract_service:
              imageName: 'contract-service'
              context: 'src/Services/auditServices/contractapiServices'
              dockerfile: 'src/Services/auditServices/contractapiServices/Dockerfile'
            finance_service:
              imageName: 'finance-service'
              context: 'src/Services/auditServices/financeapiServices'
              dockerfile: 'src/Services/auditServices/financeapiServices/Dockerfile'
            findings_service:
              imageName: 'findings-service'
              context: 'src/Services/auditServices/findingsapiServices'
              dockerfile: 'src/Services/auditServices/findingsapiServices/Dockerfile'
            notification_service:
              imageName: 'notification-service'
              context: 'src/Services/auditServices/notificationapiServices'
              dockerfile: 'src/Services/auditServices/notificationapiServices/Dockerfile'
            schedule_service:
              imageName: 'schedule-service'
              context: 'src/Services/auditServices/scheduleapiServices'
              dockerfile: 'src/Services/auditServices/scheduleapiServices/Dockerfile'
            settings_service:
              imageName: 'settings-service'
              context: 'src/Services/auditServices/settingsapiServices'
              dockerfile: 'src/Services/auditServices/settingsapiServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
