---
# ════════════════════════════════════════════════════════════════
# ACTION SERVICE
# ════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-action-service
  namespace: erp
  labels:
    app: erp-action-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-action-service
  template:
    metadata:
      labels:
        app: erp-action-service
    spec:
      containers:
        - name: action-service
          image: your-registry.azurecr.io/erp-action-service:latest   # REPLACE registry
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: erp-common-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: connection-string-action
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: erp-action-service
  namespace: erp
spec:
  selector:
    app: erp-action-service
  ports:
    - port: 8080
      targetPort: 8080

