# Azure DevOps Pipeline - sscServices
# Builds and pushes all 13 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push sscServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/sscServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/sscServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - approvalgroup-service
      - batchandenvelope-service
      - categoryandvendor-service
      - clubmembership-service
      - fillingandarchive-service
      - hrdocument-service
      - integration-service
      - invoiceprocessing-service
      - masterdata-service
      - menuandsecurity-service
      - menu-service
      - ssc-transaction-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/sscServices/apigateway'
              dockerfile: 'src/Services/sscServices/apigateway/Dockerfile'
            approvalgroup_service:
              imageName: 'approvalgroup-service'
              context: 'src/Services/sscServices/approvalgroupServices'
              dockerfile: 'src/Services/sscServices/approvalgroupServices/Dockerfile'
            batchandenvelope_service:
              imageName: 'batchandenvelope-service'
              context: 'src/Services/sscServices/batchandenvelopeServices'
              dockerfile: 'src/Services/sscServices/batchandenvelopeServices/Dockerfile'
            categoryandvendor_service:
              imageName: 'categoryandvendor-service'
              context: 'src/Services/sscServices/categoryandvendorServices'
              dockerfile: 'src/Services/sscServices/categoryandvendorServices/Dockerfile'
            clubmembership_service:
              imageName: 'clubmembership-service'
              context: 'src/Services/sscServices/clubmembershipServices'
              dockerfile: 'src/Services/sscServices/clubmembershipServices/Dockerfile'
            fillingandarchive_service:
              imageName: 'fillingandarchive-service'
              context: 'src/Services/sscServices/fillingandarchiveServices'
              dockerfile: 'src/Services/sscServices/fillingandarchiveServices/Dockerfile'
            hrdocument_service:
              imageName: 'hrdocument-service'
              context: 'src/Services/sscServices/hrdocumentServices'
              dockerfile: 'src/Services/sscServices/hrdocumentServices/Dockerfile'
            integration_service:
              imageName: 'integration-service'
              context: 'src/Services/sscServices/integrationServices/IntegrationService'
              dockerfile: 'src/Services/sscServices/integrationServices/IntegrationService/Dockerfile'
            invoiceprocessing_service:
              imageName: 'invoiceprocessing-service'
              context: 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service'
              dockerfile: 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/sscServices/masterdataServices/MasterDataService'
              dockerfile: 'src/Services/sscServices/masterdataServices/MasterDataService/Dockerfile'
            menuandsecurity_service:
              imageName: 'menuandsecurity-service'
              context: 'src/Services/sscServices/menuandsecurityServices'
              dockerfile: 'src/Services/sscServices/menuandsecurityServices/Dockerfile'
            menu_service:
              imageName: 'menu-service'
              context: 'src/Services/sscServices/menuServices/01_USER_MODULE'
              dockerfile: 'src/Services/sscServices/menuServices/01_USER_MODULE/Dockerfile'
            ssc_transaction_service:
              imageName: 'ssc-transaction-service'
              context: 'src/Services/sscServices/ssctransactionalServices'
              dockerfile: 'src/Services/sscServices/ssctransactionalServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/sscServices/apigateway'
              dockerfile: 'src/Services/sscServices/apigateway/Dockerfile'
            approvalgroup_service:
              imageName: 'approvalgroup-service'
              context: 'src/Services/sscServices/approvalgroupServices'
              dockerfile: 'src/Services/sscServices/approvalgroupServices/Dockerfile'
            batchandenvelope_service:
              imageName: 'batchandenvelope-service'
              context: 'src/Services/sscServices/batchandenvelopeServices'
              dockerfile: 'src/Services/sscServices/batchandenvelopeServices/Dockerfile'
            categoryandvendor_service:
              imageName: 'categoryandvendor-service'
              context: 'src/Services/sscServices/categoryandvendorServices'
              dockerfile: 'src/Services/sscServices/categoryandvendorServices/Dockerfile'
            clubmembership_service:
              imageName: 'clubmembership-service'
              context: 'src/Services/sscServices/clubmembershipServices'
              dockerfile: 'src/Services/sscServices/clubmembershipServices/Dockerfile'
            fillingandarchive_service:
              imageName: 'fillingandarchive-service'
              context: 'src/Services/sscServices/fillingandarchiveServices'
              dockerfile: 'src/Services/sscServices/fillingandarchiveServices/Dockerfile'
            hrdocument_service:
              imageName: 'hrdocument-service'
              context: 'src/Services/sscServices/hrdocumentServices'
              dockerfile: 'src/Services/sscServices/hrdocumentServices/Dockerfile'
            integration_service:
              imageName: 'integration-service'
              context: 'src/Services/sscServices/integrationServices/IntegrationService'
              dockerfile: 'src/Services/sscServices/integrationServices/IntegrationService/Dockerfile'
            invoiceprocessing_service:
              imageName: 'invoiceprocessing-service'
              context: 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service'
              dockerfile: 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/sscServices/masterdataServices/MasterDataService'
              dockerfile: 'src/Services/sscServices/masterdataServices/MasterDataService/Dockerfile'
            menuandsecurity_service:
              imageName: 'menuandsecurity-service'
              context: 'src/Services/sscServices/menuandsecurityServices'
              dockerfile: 'src/Services/sscServices/menuandsecurityServices/Dockerfile'
            menu_service:
              imageName: 'menu-service'
              context: 'src/Services/sscServices/menuServices/01_USER_MODULE'
              dockerfile: 'src/Services/sscServices/menuServices/01_USER_MODULE/Dockerfile'
            ssc_transaction_service:
              imageName: 'ssc-transaction-service'
              context: 'src/Services/sscServices/ssctransactionalServices'
              dockerfile: 'src/Services/sscServices/ssctransactionalServices/Dockerfile'

        steps:
          - checkout: none

          - script: |
              echo "$(GITHUB_TOKEN)" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/sscServices/apigateway'
              dockerfile: 'src/Services/sscServices/apigateway/Dockerfile'
            approvalgroup_service:
              imageName: 'approvalgroup-service'
              context: 'src/Services/sscServices/approvalgroupServices'
              dockerfile: 'src/Services/sscServices/approvalgroupServices/Dockerfile'
            batchandenvelope_service:
              imageName: 'batchandenvelope-service'
              context: 'src/Services/sscServices/batchandenvelopeServices'
              dockerfile: 'src/Services/sscServices/batchandenvelopeServices/Dockerfile'
            categoryandvendor_service:
              imageName: 'categoryandvendor-service'
              context: 'src/Services/sscServices/categoryandvendorServices'
              dockerfile: 'src/Services/sscServices/categoryandvendorServices/Dockerfile'
            clubmembership_service:
              imageName: 'clubmembership-service'
              context: 'src/Services/sscServices/clubmembershipServices'
              dockerfile: 'src/Services/sscServices/clubmembershipServices/Dockerfile'
            fillingandarchive_service:
              imageName: 'fillingandarchive-service'
              context: 'src/Services/sscServices/fillingandarchiveServices'
              dockerfile: 'src/Services/sscServices/fillingandarchiveServices/Dockerfile'
            hrdocument_service:
              imageName: 'hrdocument-service'
              context: 'src/Services/sscServices/hrdocumentServices'
              dockerfile: 'src/Services/sscServices/hrdocumentServices/Dockerfile'
            integration_service:
              imageName: 'integration-service'
              context: 'src/Services/sscServices/integrationServices/IntegrationService'
              dockerfile: 'src/Services/sscServices/integrationServices/IntegrationService/Dockerfile'
            invoiceprocessing_service:
              imageName: 'invoiceprocessing-service'
              context: 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service'
              dockerfile: 'src/Services/sscServices/invoiceprocessingServices/InvoiceProcessing.Service/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/sscServices/masterdataServices/MasterDataService'
              dockerfile: 'src/Services/sscServices/masterdataServices/MasterDataService/Dockerfile'
            menuandsecurity_service:
              imageName: 'menuandsecurity-service'
              context: 'src/Services/sscServices/menuandsecurityServices'
              dockerfile: 'src/Services/sscServices/menuandsecurityServices/Dockerfile'
            menu_service:
              imageName: 'menu-service'
              context: 'src/Services/sscServices/menuServices/01_USER_MODULE'
              dockerfile: 'src/Services/sscServices/menuServices/01_USER_MODULE/Dockerfile'
            ssc_transaction_service:
              imageName: 'ssc-transaction-service'
              context: 'src/Services/sscServices/ssctransactionalServices'
              dockerfile: 'src/Services/sscServices/ssctransactionalServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
