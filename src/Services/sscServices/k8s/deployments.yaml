apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ssc-services
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ${REGISTRY}/ssc-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ssc-config
          env:
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: ssc-secrets
                  key: JWT_SECRET
            - name: HealthCheckEndpoints__SqlServer
              valueFrom:
                secretKeyRef:
                  name: ssc-secrets
                  key: SSCDB_CONNECTION
            - name: HealthCheckEndpoints__RabbitMQ
              valueFrom:
                secretKeyRef:
