apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssc-transactional
  namespace: ssc-services
  labels:
    app: ssc-transactional
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssc-transactional
  template:
    metadata:
      labels:
        app: ssc-transactional
    spec:
      containers:
        - name: ssc-transactional
          image: ${REGISTRY}/ssc-transactional:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ssc-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: ssc-secrets
                  key: SSCDB_CONNECTION
            - name: ConnectionStrings__AzureBlobStorage
              valueFrom:
                secretKeyRef:
                  name: ssc-secrets
                  key: AZURE_BLOB_CONNECTION
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: ssc-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: ssc-secrets
                  key: RABBITMQ_PASS
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: ssc-secrets
                  key: JWT_SECRET
            - name: JwtSettings__Issuer
              value: "SSCTransactionalService"
            - name: JwtSettings__Audience
              value: "SSCTransactionalServiceClients"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ssc-transactional-service
  namespace: ssc-services
spec:
  selector:
    app: ssc-transactional
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
