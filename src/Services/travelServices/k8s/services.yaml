# ============================================================
# Travel Request Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-request-api
  namespace: erp-travel
  labels:
    app: travel-request-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-request-api
  template:
    metadata:
      labels:
        app: travel-request-api
        tier: backend
    spec:
      containers:
      - name: travel-request-api
        image: ${REGISTRY}/travel-request-api:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: erp-config
        env:
        - name: ConnectionStrings__TravelDb
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: traveldb-connection
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: key
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: travel-request-api
  namespace: erp-travel
spec:
  selector:
    app: travel-request-api
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: travel-request-api-hpa
  namespace: erp-travel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: travel-request-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
