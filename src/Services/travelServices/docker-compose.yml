    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  finance-api:
    build:
      context: ./financeServices
      dockerfile: Dockerfile
    container_name: erp-finance
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FinanceServiceDb;User Id=sa;Password=${SA_PASSWORD:-Erp@Travel2024!};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5294:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
