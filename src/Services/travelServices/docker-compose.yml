  admin-api:
    build:
      context: ./adminServices
      dockerfile: Dockerfile
    container_name: erp-admin
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AdminServiceDb;User Id=sa;Password=${SA_PASSWORD:-Erp@Travel2024!};TrustServerCertificate=True;MultipleActiveResultSets=True"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:-TravelRequestServiceSecretKey2024!@#$$%^&*()MinLength32Chars}
      JwtSettings__Issuer: AdminService
      JwtSettings__Audience: AdminServiceAPI
