  masterdata-api:
    build:
      context: ./masterdataServices
      dockerfile: Dockerfile
    container_name: erp-masterdata
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MasterDataDB;User Id=sa;Password=${SA_PASSWORD:-Erp@Travel2024!};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5166:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  agency-api:
    build:
      context: ./agensService
      dockerfile: Dockerfile.production
    container_name: erp-agency
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AgencyServiceDb;User Id=sa;Password=${SA_PASSWORD:-Erp@Travel2024!};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
