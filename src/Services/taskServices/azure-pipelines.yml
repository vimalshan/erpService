# Azure DevOps Pipeline - taskServices
# Builds and pushes all 7 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push taskServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/taskServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/taskServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - complaint-service
      - energy-service
      - lookup-service
      - task-service
      - task-transactional-service
      - unit-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/taskServices/apiGateway'
          dockerfile: 'src/Services/taskServices/apiGateway/Dockerfile'
        complaint_service:
          imageName: 'complaint-service'
          context: 'src/Services/taskServices/complaintServices'
          dockerfile: 'src/Services/taskServices/complaintServices/Dockerfile'
        energy_service:
          imageName: 'energy-service'
          context: 'src/Services/taskServices/energyServices'
          dockerfile: 'src/Services/taskServices/energyServices/Dockerfile'
        lookup_service:
          imageName: 'lookup-service'
          context: 'src/Services/taskServices/lookupServices'
          dockerfile: 'src/Services/taskServices/lookupServices/Dockerfile'
        task_service:
          imageName: 'task-service'
          context: 'src/Services/taskServices/taskServices'
          dockerfile: 'src/Services/taskServices/taskServices/Dockerfile'
        task_transactional_service:
          imageName: 'task-transactional-service'
          context: 'src/Services/taskServices/taskTransactionalServices'
          dockerfile: 'src/Services/taskServices/taskTransactionalServices/Dockerfile'
        unit_service:
          imageName: 'unit-service'
          context: 'src/Services/taskServices/unitServices'
          dockerfile: 'src/Services/taskServices/unitServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/taskServices/apiGateway'
          dockerfile: 'src/Services/taskServices/apiGateway/Dockerfile'
        complaint_service:
          imageName: 'complaint-service'
          context: 'src/Services/taskServices/complaintServices'
          dockerfile: 'src/Services/taskServices/complaintServices/Dockerfile'
        energy_service:
          imageName: 'energy-service'
          context: 'src/Services/taskServices/energyServices'
          dockerfile: 'src/Services/taskServices/energyServices/Dockerfile'
        lookup_service:
          imageName: 'lookup-service'
          context: 'src/Services/taskServices/lookupServices'
          dockerfile: 'src/Services/taskServices/lookupServices/Dockerfile'
        task_service:
          imageName: 'task-service'
          context: 'src/Services/taskServices/taskServices'
          dockerfile: 'src/Services/taskServices/taskServices/Dockerfile'
        task_transactional_service:
          imageName: 'task-transactional-service'
          context: 'src/Services/taskServices/taskTransactionalServices'
          dockerfile: 'src/Services/taskServices/taskTransactionalServices/Dockerfile'
        unit_service:
          imageName: 'unit-service'
          context: 'src/Services/taskServices/unitServices'
          dockerfile: 'src/Services/taskServices/unitServices/Dockerfile'

        steps:
          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: ghcr-service-connection

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
        api_gateway:
          imageName: 'api-gateway'
          context: 'src/Services/taskServices/apiGateway'
          dockerfile: 'src/Services/taskServices/apiGateway/Dockerfile'
        complaint_service:
          imageName: 'complaint-service'
          context: 'src/Services/taskServices/complaintServices'
          dockerfile: 'src/Services/taskServices/complaintServices/Dockerfile'
        energy_service:
          imageName: 'energy-service'
          context: 'src/Services/taskServices/energyServices'
          dockerfile: 'src/Services/taskServices/energyServices/Dockerfile'
        lookup_service:
          imageName: 'lookup-service'
          context: 'src/Services/taskServices/lookupServices'
          dockerfile: 'src/Services/taskServices/lookupServices/Dockerfile'
        task_service:
          imageName: 'task-service'
          context: 'src/Services/taskServices/taskServices'
          dockerfile: 'src/Services/taskServices/taskServices/Dockerfile'
        task_transactional_service:
          imageName: 'task-transactional-service'
          context: 'src/Services/taskServices/taskTransactionalServices'
          dockerfile: 'src/Services/taskServices/taskTransactionalServices/Dockerfile'
        unit_service:
          imageName: 'unit-service'
          context: 'src/Services/taskServices/unitServices'
          dockerfile: 'src/Services/taskServices/unitServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
