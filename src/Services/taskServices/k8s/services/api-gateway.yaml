apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: erp-microservices
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      containers:
        - name: api-gateway
          image: ${REGISTRY}/api-gateway:${TAG}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: jwt-secret-key
            - name: RabbitMQ__HostName
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: RABBITMQ_HOST
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-pass
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /gateway/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /gateway/health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: erp-microservices
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: erp-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
