apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-service
  namespace: erp-microservices
  labels:
    app: energy-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: energy-service
  template:
    metadata:
      labels:
        app: energy-service
        tier: backend
    spec:
      containers:
        - name: energy-service
          image: ${REGISTRY}/energy-service:${TAG}
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__EnergyDb
              value: "Server=sqlserver-service;Database=TASKDB;User Id=sa;Password=$(SQL_SA_PASSWORD);Encrypt=True;TrustServerCertificate=True;Application Name=EnergyService;Command Timeout=30"
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: sql-sa-password
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: jwt-secret-key
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: RABBITMQ_HOST
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-user
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-pass
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: energy-service
  namespace: erp-microservices
spec:
  selector:
    app: energy-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-functions
  namespace: erp-microservices
  labels:
    app: energy-functions
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energy-functions
  template:
    metadata:
      labels:
        app: energy-functions
        tier: worker
    spec:
      containers:
        - name: energy-functions
          image: ${REGISTRY}/energy-functions:${TAG}
          env:
            - name: DOTNET_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: DOTNET_ENVIRONMENT
            - name: ConnectionStrings__EnergyDb
              value: "Server=sqlserver-service;Database=TASKDB;User Id=sa;Password=$(SQL_SA_PASSWORD);Encrypt=True;TrustServerCertificate=True;Application Name=EnergyFunctions;Command Timeout=30"
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: sql-sa-password
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: RABBITMQ_HOST
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-user
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: rabbitmq-pass
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
