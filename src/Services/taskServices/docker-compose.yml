# ─── Volumes ──────────────────────────────────────────

volumes:
  sqlserver-data:
    driver: local
  rabbitmq-data:
    driver: local

# ─── Networks ─────────────────────────────────────────

networks:
  erp-network:
    driver: bridge
    name: erp-microservices
