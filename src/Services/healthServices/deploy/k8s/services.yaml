---
# Accident Management Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accident-service
  namespace: health-services
  labels:
    app: accident-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accident-service
  template:
    metadata:
      labels:
        app: accident-service
    spec:
      containers:
        - name: accident-service
          image: ${REGISTRY}/accident-service:latest
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: ConnectionStrings__HealthDb
              value: "Server=sqlserver-svc;Database=HEALTHDB;User Id=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-secrets
                  key: sa-password
            - name: Authentication__SecretKey
              valueFrom:
                secretKeyRef:
                  name: health-secrets
                  key: jwt-secret-key
            - name: RabbitMQ__Host
              value: "rabbitmq-svc"
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: health-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: health-secrets
                  key: rabbitmq-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: accident-svc
  namespace: health-services
spec:
  selector:
    app: accident-service
  ports:
    - port: 5000
      targetPort: 5000
