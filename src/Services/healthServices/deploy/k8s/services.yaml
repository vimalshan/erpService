---
# Health Gateway (API Gateway)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-gateway
  namespace: health-services
  labels:
    app: health-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-gateway
  template:
    metadata:
      labels:
        app: health-gateway
    spec:
      containers:
        - name: health-gateway
          image: ${REGISTRY}/health-gateway:latest
          ports:
            - containerPort: 5600
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:5600"
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: health-secrets
                  key: jwt-secret-key
            - name: Services__AccidentService
              value: "http://accident-svc:5000"
            - name: Services__CheckupService
              value: "http://checkup-svc:7101"
            - name: Services__InsuranceService
              value: "http://insurance-svc:5100"
            - name: Services__MastersService
              value: "http://masters-svc:5200"
            - name: Services__MedicalVisitService
              value: "http://medicalvisit-svc:5300"
            - name: Services__MedicineService
              value: "http://medicine-svc:5400"
            - name: Services__TransactionService
              value: "http://transaction-svc:5500"
            - name: Redis__Connection
              value: "redis-svc:6379"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5600
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5600
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: health-gateway-svc
  namespace: health-services
spec:
  selector:
    app: health-gateway
  ports:
    - port: 5600
      targetPort: 5600
