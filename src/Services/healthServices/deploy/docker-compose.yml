# =============================================
# Health ERP Microservices - Docker Compose
# =============================================
# Usage:
#   cp deploy/.env.template deploy/.env
#   docker-compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# =============================================

services:

  # ──────────────── Infrastructure ────────────────

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: health-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -C -Q "SELECT 1" -b
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - health-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: health-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q check_running
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - health-network

  redis:
    image: redis:7-alpine
    container_name: health-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - health-network

  # ──────────────── Database Init ────────────────

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: health-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init-db:/scripts
    entrypoint: /bin/bash
    command: >
      -c "
        echo 'Waiting for SQL Server...' &&
        sleep 10 &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${SA_PASSWORD}' -C -i /scripts/init-databases.sql &&
        echo 'Database initialization complete!'
      "
    networks:
      - health-network

  # ──────────────── Microservices ────────────────

  accident-service:
    build:
      context: ../accidentmanagementServices/src
      dockerfile: Dockerfile
    container_name: health-accident-service
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HealthDb: "Server=sqlserver;Database=HEALTHDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      Authentication__SecretKey: ${JWT_SECRET_KEY}
      Redis__Configuration: redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - health-network

  checkup-service:
    build:
      context: ../healthcheckupServices/src
      dockerfile: Dockerfile
    container_name: health-checkup-service
    ports:
      - "7101:7101"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HealthDb: "Server=sqlserver;Database=HEALTHDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      Authentication__SecretKey: ${JWT_SECRET_KEY}
      Redis__Configuration: redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - health-network

  insurance-service:
    build:
      context: ../insurancemanagementServices/src
      dockerfile: Dockerfile
    container_name: health-insurance-service
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HEALTHDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMQ__Enabled: "true"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - health-network

  masters-service:
    build:
      context: ../masterServices/src
      dockerfile: Dockerfile
    container_name: health-masters-service
    ports:
      - "5200:5200"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HEALTHDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMQ__ConnectionString: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - health-network

  medicalvisit-service:
    build:
      context: ../medicalvisitServices/src
      dockerfile: Dockerfile
    container_name: health-medicalvisit-service
    ports:
      - "5300:5300"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HEALTHDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      Jwt__Key: ${JWT_SECRET_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - health-network

  medicine-service:
    build:
      context: ../medicinemanagementServices/src
      dockerfile: Dockerfile
    container_name: health-medicine-service
    ports:
      - "5400:5400"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HEALTHDB_MedicineManagement;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      Jwt__Key: ${JWT_SECRET_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - health-network

  transaction-service:
    build:
      context: ../healthTransactionServices/src
      dockerfile: Dockerfile
    container_name: health-transaction-service
    ports:
      - "5500:5500"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HEALTHDB_HealthTransactions;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASS}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - health-network

  # ──────────────── API Gateway ────────────────

  health-gateway:
    build:
      context: ../apiGateway/src
      dockerfile: Dockerfile
    container_name: health-gateway
    ports:
      - "5600:5600"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Services__AccidentManagement: http://accident-service:5000
      Services__CheckupManagement: http://checkup-service:7101
      Services__InsuranceManagement: http://insurance-service:5100
      Services__Masters: http://masters-service:5200
      Services__MedicalVisit: http://medicalvisit-service:5300
      Services__MedicineManagement: http://medicine-service:5400
      Services__HealthTransaction: http://transaction-service:5500
    depends_on:
      - accident-service
      - checkup-service
      - insurance-service
      - masters-service
      - medicalvisit-service
      - medicine-service
      - transaction-service
    restart: on-failure
    networks:
      - health-network

volumes:
  sqlserver-data:
  rabbitmq-data:
  redis-data:

networks:
  health-network:
    driver: bridge
