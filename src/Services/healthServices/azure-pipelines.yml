# Azure DevOps Pipeline - healthServices
# Builds and pushes all 8 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push healthServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/healthServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/healthServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - accident-management-service
      - healthcheckup-service
      - health-transaction-service
      - insurance-management-service
      - master-service
      - medicalvisit-service
      - medicine-management-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/healthServices/apiGateway/src'
              dockerfile: 'src/Services/healthServices/apiGateway/src/Dockerfile'
            accident_management_service:
              imageName: 'accident-management-service'
              context: 'src/Services/healthServices/accidentmanagementServices/src'
              dockerfile: 'src/Services/healthServices/accidentmanagementServices/src/Dockerfile'
            healthcheckup_service:
              imageName: 'healthcheckup-service'
              context: 'src/Services/healthServices/healthcheckupServices/src'
              dockerfile: 'src/Services/healthServices/healthcheckupServices/src/Dockerfile'
            health_transaction_service:
              imageName: 'health-transaction-service'
              context: 'src/Services/healthServices/healthTransactionServices/src'
              dockerfile: 'src/Services/healthServices/healthTransactionServices/src/Dockerfile'
            insurance_management_service:
              imageName: 'insurance-management-service'
              context: 'src/Services/healthServices/insurancemanagementServices/src'
              dockerfile: 'src/Services/healthServices/insurancemanagementServices/src/Dockerfile'
            master_service:
              imageName: 'master-service'
              context: 'src/Services/healthServices/masterServices/src'
              dockerfile: 'src/Services/healthServices/masterServices/src/Dockerfile'
            medicalvisit_service:
              imageName: 'medicalvisit-service'
              context: 'src/Services/healthServices/medicalvisitServices/src'
              dockerfile: 'src/Services/healthServices/medicalvisitServices/src/Dockerfile'
            medicine_management_service:
              imageName: 'medicine-management-service'
              context: 'src/Services/healthServices/medicinemanagementServices/src'
              dockerfile: 'src/Services/healthServices/medicinemanagementServices/src/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/healthServices/apiGateway/src'
              dockerfile: 'src/Services/healthServices/apiGateway/src/Dockerfile'
            accident_management_service:
              imageName: 'accident-management-service'
              context: 'src/Services/healthServices/accidentmanagementServices/src'
              dockerfile: 'src/Services/healthServices/accidentmanagementServices/src/Dockerfile'
            healthcheckup_service:
              imageName: 'healthcheckup-service'
              context: 'src/Services/healthServices/healthcheckupServices/src'
              dockerfile: 'src/Services/healthServices/healthcheckupServices/src/Dockerfile'
            health_transaction_service:
              imageName: 'health-transaction-service'
              context: 'src/Services/healthServices/healthTransactionServices/src'
              dockerfile: 'src/Services/healthServices/healthTransactionServices/src/Dockerfile'
            insurance_management_service:
              imageName: 'insurance-management-service'
              context: 'src/Services/healthServices/insurancemanagementServices/src'
              dockerfile: 'src/Services/healthServices/insurancemanagementServices/src/Dockerfile'
            master_service:
              imageName: 'master-service'
              context: 'src/Services/healthServices/masterServices/src'
              dockerfile: 'src/Services/healthServices/masterServices/src/Dockerfile'
            medicalvisit_service:
              imageName: 'medicalvisit-service'
              context: 'src/Services/healthServices/medicalvisitServices/src'
              dockerfile: 'src/Services/healthServices/medicalvisitServices/src/Dockerfile'
            medicine_management_service:
              imageName: 'medicine-management-service'
              context: 'src/Services/healthServices/medicinemanagementServices/src'
              dockerfile: 'src/Services/healthServices/medicinemanagementServices/src/Dockerfile'

        steps:
          - checkout: none

          - script: |
              echo "$(GITHUB_TOKEN)" | docker login ghcr.io -u "$(GITHUB_ACTOR)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/healthServices/apiGateway/src'
              dockerfile: 'src/Services/healthServices/apiGateway/src/Dockerfile'
            accident_management_service:
              imageName: 'accident-management-service'
              context: 'src/Services/healthServices/accidentmanagementServices/src'
              dockerfile: 'src/Services/healthServices/accidentmanagementServices/src/Dockerfile'
            healthcheckup_service:
              imageName: 'healthcheckup-service'
              context: 'src/Services/healthServices/healthcheckupServices/src'
              dockerfile: 'src/Services/healthServices/healthcheckupServices/src/Dockerfile'
            health_transaction_service:
              imageName: 'health-transaction-service'
              context: 'src/Services/healthServices/healthTransactionServices/src'
              dockerfile: 'src/Services/healthServices/healthTransactionServices/src/Dockerfile'
            insurance_management_service:
              imageName: 'insurance-management-service'
              context: 'src/Services/healthServices/insurancemanagementServices/src'
              dockerfile: 'src/Services/healthServices/insurancemanagementServices/src/Dockerfile'
            master_service:
              imageName: 'master-service'
              context: 'src/Services/healthServices/masterServices/src'
              dockerfile: 'src/Services/healthServices/masterServices/src/Dockerfile'
            medicalvisit_service:
              imageName: 'medicalvisit-service'
              context: 'src/Services/healthServices/medicalvisitServices/src'
              dockerfile: 'src/Services/healthServices/medicalvisitServices/src/Dockerfile'
            medicine_management_service:
              imageName: 'medicine-management-service'
              context: 'src/Services/healthServices/medicinemanagementServices/src'
              dockerfile: 'src/Services/healthServices/medicinemanagementServices/src/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
