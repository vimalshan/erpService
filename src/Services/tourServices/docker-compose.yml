    container_name: tourplan-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__TourPlanDb=Server=sqlserver;Database=TOURDB;User Id=sa;Password=TourERP@Str0ngP@ss!;TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-TourERP-Shared-Super-Secret-JWT-Key-2026-Production!}
      - Jwt__Issuer=TourERP.Gateway
      - Jwt__Audience=TourERP.Clients
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=tour_user
      - RabbitMQ__Password=TourRMQ@2026!
      - RabbitMQ__VirtualHost=tour_vhost
