      - ConnectionStrings__TransactionDb=Server=sqlserver;Database=TOURDB;User Id=sa;Password=TourERP@Str0ngP@ss!;TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-TourERP-Shared-Super-Secret-JWT-Key-2026-Production!}
      - Jwt__Issuer=TourERP.Gateway
