    restart: unless-stopped

  # ═══════════════════════════════════════════════
  # API Gateway
  # ═══════════════════════════════════════════════
  api-gateway:
    build:
      context: ./apiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY:-TourERP-Shared-Super-Secret-JWT-Key-2026-Production!}
