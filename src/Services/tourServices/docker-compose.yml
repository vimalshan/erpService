      - tour-network
    restart: unless-stopped

  travel-service:
    build:
      context: ./travelServices
      dockerfile: Dockerfile
    container_name: travel-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__TravelDb=Server=sqlserver;Database=TOURDB;User Id=sa;Password=TourERP@Str0ngP@ss!;TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-TourERP-Shared-Super-Secret-JWT-Key-2026-Production!}
      - Jwt__Issuer=TourERP.Gateway
      - Jwt__Audience=TourERP.Clients
