apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tour-erp
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tour-erp/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: JwtSettings__Key
              valueFrom:
                secretKeyRef:
                  name: tour-erp-secrets
                  key: JWT_KEY
            - name: JwtSettings__Issuer
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: JWT_ISSUER
            - name: JwtSettings__Audience
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: JWT_AUDIENCE
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tour-erp
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
