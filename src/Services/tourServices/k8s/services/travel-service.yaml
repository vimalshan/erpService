apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-service
  namespace: tour-erp
  labels:
    app: travel-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-service
  template:
    metadata:
      labels:
        app: travel-service
    spec:
      containers:
        - name: travel-service
          image: tour-erp/travel-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ConnectionStrings__TravelDb
              valueFrom:
                secretKeyRef:
                  name: tour-erp-secrets
                  key: DB_CONNECTION
            - name: JwtSettings__Key
              valueFrom:
                secretKeyRef:
                  name: tour-erp-secrets
                  key: JWT_KEY
            - name: JwtSettings__Issuer
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: JWT_ISSUER
            - name: JwtSettings__Audience
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: JWT_AUDIENCE
            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: RABBITMQ_HOST
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: tour-erp-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: tour-erp-secrets
                  key: RABBITMQ_PASSWORD
            - name: RabbitMQ__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: tour-erp-config
                  key: RABBITMQ_VHOST
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: travel-service
  namespace: tour-erp
spec:
  selector:
    app: travel-service
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
