# Azure DevOps Pipeline - tourServices
# Builds and pushes all 8 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push tourServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/tourServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/tourServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - admin-service
      - booking-service
      - config-service
      - tourplan-service
      - tour-service
      - transaction-service
      - travel-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/tourServices/apiGateway'
              dockerfile: 'src/Services/tourServices/apiGateway/Dockerfile'
            admin_service:
              imageName: 'admin-service'
              context: 'src/Services/tourServices/adminServices'
              dockerfile: 'src/Services/tourServices/adminServices/Dockerfile'
            booking_service:
              imageName: 'booking-service'
              context: 'src/Services/tourServices/bookingServices/BookingService'
              dockerfile: 'src/Services/tourServices/bookingServices/BookingService/Dockerfile'
            config_service:
              imageName: 'config-service'
              context: 'src/Services/tourServices/configServices'
              dockerfile: 'src/Services/tourServices/configServices/Dockerfile'
            tourplan_service:
              imageName: 'tourplan-service'
              context: 'src/Services/tourServices/tourplanServices'
              dockerfile: 'src/Services/tourServices/tourplanServices/Dockerfile'
            tour_service:
              imageName: 'tour-service'
              context: 'src/Services/tourServices/tourServices'
              dockerfile: 'src/Services/tourServices/tourServices/Dockerfile'
            transaction_service:
              imageName: 'transaction-service'
              context: 'src/Services/tourServices/transactionServices'
              dockerfile: 'src/Services/tourServices/transactionServices/Dockerfile'
            travel_service:
              imageName: 'travel-service'
              context: 'src/Services/tourServices/travelServices'
              dockerfile: 'src/Services/tourServices/travelServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/tourServices/apiGateway'
              dockerfile: 'src/Services/tourServices/apiGateway/Dockerfile'
            admin_service:
              imageName: 'admin-service'
              context: 'src/Services/tourServices/adminServices'
              dockerfile: 'src/Services/tourServices/adminServices/Dockerfile'
            booking_service:
              imageName: 'booking-service'
              context: 'src/Services/tourServices/bookingServices/BookingService'
              dockerfile: 'src/Services/tourServices/bookingServices/BookingService/Dockerfile'
            config_service:
              imageName: 'config-service'
              context: 'src/Services/tourServices/configServices'
              dockerfile: 'src/Services/tourServices/configServices/Dockerfile'
            tourplan_service:
              imageName: 'tourplan-service'
              context: 'src/Services/tourServices/tourplanServices'
              dockerfile: 'src/Services/tourServices/tourplanServices/Dockerfile'
            tour_service:
              imageName: 'tour-service'
              context: 'src/Services/tourServices/tourServices'
              dockerfile: 'src/Services/tourServices/tourServices/Dockerfile'
            transaction_service:
              imageName: 'transaction-service'
              context: 'src/Services/tourServices/transactionServices'
              dockerfile: 'src/Services/tourServices/transactionServices/Dockerfile'
            travel_service:
              imageName: 'travel-service'
              context: 'src/Services/tourServices/travelServices'
              dockerfile: 'src/Services/tourServices/travelServices/Dockerfile'

        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/tourServices/apiGateway'
              dockerfile: 'src/Services/tourServices/apiGateway/Dockerfile'
            admin_service:
              imageName: 'admin-service'
              context: 'src/Services/tourServices/adminServices'
              dockerfile: 'src/Services/tourServices/adminServices/Dockerfile'
            booking_service:
              imageName: 'booking-service'
              context: 'src/Services/tourServices/bookingServices/BookingService'
              dockerfile: 'src/Services/tourServices/bookingServices/BookingService/Dockerfile'
            config_service:
              imageName: 'config-service'
              context: 'src/Services/tourServices/configServices'
              dockerfile: 'src/Services/tourServices/configServices/Dockerfile'
            tourplan_service:
              imageName: 'tourplan-service'
              context: 'src/Services/tourServices/tourplanServices'
              dockerfile: 'src/Services/tourServices/tourplanServices/Dockerfile'
            tour_service:
              imageName: 'tour-service'
              context: 'src/Services/tourServices/tourServices'
              dockerfile: 'src/Services/tourServices/tourServices/Dockerfile'
            transaction_service:
              imageName: 'transaction-service'
              context: 'src/Services/tourServices/transactionServices'
              dockerfile: 'src/Services/tourServices/transactionServices/Dockerfile'
            travel_service:
              imageName: 'travel-service'
              context: 'src/Services/tourServices/travelServices'
              dockerfile: 'src/Services/tourServices/travelServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
