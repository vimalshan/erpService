# =============================================================================
# WMS Microservices - Kubernetes Deployments & Services
# All 16 microservices in deployment order
# =============================================================================

# =============================================================================
# 01 - Security Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: wms
  labels:
    app: security-service
    app.kubernetes.io/part-of: wms-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-service
  template:
    metadata:
      labels:
        app: security-service
    spec:
      containers:
        - name: security-service
          image: wms/security-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__SecurityDb
              valueFrom:
                configMapKeyRef:
                  name: wms-connection-strings
                  key: security-db
            - name: RabbitMQ__Host
              value: "rabbitmq-svc"
            - name: RabbitMQ__Port
              value: "5672"
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: wms-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: wms-secrets
                  key: rabbitmq-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: security-svc
  namespace: wms
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: security-service
---
