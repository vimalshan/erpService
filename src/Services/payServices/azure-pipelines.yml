# Azure DevOps Pipeline - payServices
# Builds and pushes all 7 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push payServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/payServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/payServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - employee-service
      - faq-service
      - hr-service
      - payroll-service
      - pay-transaction-service
      - tax-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/payServices/apiGateway'
              dockerfile: 'src/Services/payServices/apiGateway/Dockerfile'
            employee_service:
              imageName: 'employee-service'
              context: 'src/Services/payServices/employeeServices'
              dockerfile: 'src/Services/payServices/employeeServices/Dockerfile'
            faq_service:
              imageName: 'faq-service'
              context: 'src/Services/payServices/faqServices'
              dockerfile: 'src/Services/payServices/faqServices/Dockerfile'
            hr_service:
              imageName: 'hr-service'
              context: 'src/Services/payServices/hrServices'
              dockerfile: 'src/Services/payServices/hrServices/Dockerfile'
            payroll_service:
              imageName: 'payroll-service'
              context: 'src/Services/payServices/payrollServices'
              dockerfile: 'src/Services/payServices/payrollServices/Dockerfile'
            pay_transaction_service:
              imageName: 'pay-transaction-service'
              context: 'src/Services/payServices/payTransactionalServices'
              dockerfile: 'src/Services/payServices/payTransactionalServices/Dockerfile'
            tax_service:
              imageName: 'tax-service'
              context: 'src/Services/payServices/taxServices'
              dockerfile: 'src/Services/payServices/taxServices/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/payServices/apiGateway'
              dockerfile: 'src/Services/payServices/apiGateway/Dockerfile'
            employee_service:
              imageName: 'employee-service'
              context: 'src/Services/payServices/employeeServices'
              dockerfile: 'src/Services/payServices/employeeServices/Dockerfile'
            faq_service:
              imageName: 'faq-service'
              context: 'src/Services/payServices/faqServices'
              dockerfile: 'src/Services/payServices/faqServices/Dockerfile'
            hr_service:
              imageName: 'hr-service'
              context: 'src/Services/payServices/hrServices'
              dockerfile: 'src/Services/payServices/hrServices/Dockerfile'
            payroll_service:
              imageName: 'payroll-service'
              context: 'src/Services/payServices/payrollServices'
              dockerfile: 'src/Services/payServices/payrollServices/Dockerfile'
            pay_transaction_service:
              imageName: 'pay-transaction-service'
              context: 'src/Services/payServices/payTransactionalServices'
              dockerfile: 'src/Services/payServices/payTransactionalServices/Dockerfile'
            tax_service:
              imageName: 'tax-service'
              context: 'src/Services/payServices/taxServices'
              dockerfile: 'src/Services/payServices/taxServices/Dockerfile'

        steps:
          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: ghcr-service-connection

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/payServices/apiGateway'
              dockerfile: 'src/Services/payServices/apiGateway/Dockerfile'
            employee_service:
              imageName: 'employee-service'
              context: 'src/Services/payServices/employeeServices'
              dockerfile: 'src/Services/payServices/employeeServices/Dockerfile'
            faq_service:
              imageName: 'faq-service'
              context: 'src/Services/payServices/faqServices'
              dockerfile: 'src/Services/payServices/faqServices/Dockerfile'
            hr_service:
              imageName: 'hr-service'
              context: 'src/Services/payServices/hrServices'
              dockerfile: 'src/Services/payServices/hrServices/Dockerfile'
            payroll_service:
              imageName: 'payroll-service'
              context: 'src/Services/payServices/payrollServices'
              dockerfile: 'src/Services/payServices/payrollServices/Dockerfile'
            pay_transaction_service:
              imageName: 'pay-transaction-service'
              context: 'src/Services/payServices/payTransactionalServices'
              dockerfile: 'src/Services/payServices/payTransactionalServices/Dockerfile'
            tax_service:
              imageName: 'tax-service'
              context: 'src/Services/payServices/taxServices'
              dockerfile: 'src/Services/payServices/taxServices/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
