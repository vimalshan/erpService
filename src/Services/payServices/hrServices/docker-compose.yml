version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hrservice-sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Password123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - hrservice-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hrservice-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hrservice-network

  hrservice-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PAYDB;User Sa=sa;Password=YourStrong@Password123;Encrypt=false;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      Jwt__SecretKey: "your-secret-key-minimum-32-characters-for-production"
    ports:
      - "7001:443"
      - "5000:80"
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - hrservice-network
    volumes:
      - ./logs:/app/logs

volumes:
  sqlserver-data:
  rabbitmq-data:

networks:
  hrservice-network:
    driver: bridge
