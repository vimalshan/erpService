apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp-microservices
type: Opaque
stringData:
  SQL_SA_PASSWORD: "YourStrong@Passw0rd!"
  JWT_SECRET_KEY: "YourSuperSecretKeyForJWTTokenGeneration2026!@#$%^&*()"
  RABBITMQ_USER: "erp_user"
  RABBITMQ_PASS: "erp_password"
  AZURE_STORAGE_CONNECTION: "UseDevelopmentStorage=true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
  namespace: erp-microservices
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "erp"
  SQL_SERVER: "sqlserver-service"
