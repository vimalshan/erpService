apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: erp-microservices
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: erp/api-gateway:latest
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: JWT_SECRET_KEY
            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: RABBITMQ_HOST
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: RABBITMQ_PORT
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: RABBITMQ_PASS
            - name: RabbitMQ__VirtualHost
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: RABBITMQ_VHOST
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: erp-microservices
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
