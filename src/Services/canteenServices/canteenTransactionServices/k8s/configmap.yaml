apiVersion: v1
kind: Namespace
metadata:
  name: canteentransaction-service
  labels:
    name: canteentransaction-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canteentransaction-service-config
  namespace: canteentransaction-service
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5195"
  Jwt__Issuer: "CanteenTransactionService"
  Jwt__Audience: "CanteenTransactionServiceClients"
  Jwt__ExpiresInMinutes: "60"
  RabbitMQ__Host: "rabbitmq.canteentransaction-service.svc.cluster.local"
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: "guest"
  RabbitMQ__VirtualHost: "/"
  RabbitMQ__ExchangeName: "canteentransaction.exchange"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"
