# Azure DevOps Pipeline - canteenServices
# Builds and pushes all 9 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push canteenServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/canteenServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/canteenServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - canteen-transaction-service
      - canteen-unit-service
      - card-management-service
      - deduction-service
      - eligibility-service
      - item-master-service
      - reference-data-service
      - swipe-transaction-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/canteenServices/ApiGateway'
              dockerfile: 'src/Services/canteenServices/ApiGateway/Dockerfile'
            canteen_transaction_service:
              imageName: 'canteen-transaction-service'
              context: 'src/Services/canteenServices/canteenTransactionServices'
              dockerfile: 'src/Services/canteenServices/canteenTransactionServices/Docker/Dockerfile'
            canteen_unit_service:
              imageName: 'canteen-unit-service'
              context: 'src/Services/canteenServices/canteenunitServices'
              dockerfile: 'src/Services/canteenServices/canteenunitServices/Docker/Dockerfile'
            card_management_service:
              imageName: 'card-management-service'
              context: 'src/Services/canteenServices/cardmanagementServices'
              dockerfile: 'src/Services/canteenServices/cardmanagementServices/Docker/Dockerfile'
            deduction_service:
              imageName: 'deduction-service'
              context: 'src/Services/canteenServices/deductionServices'
              dockerfile: 'src/Services/canteenServices/deductionServices/Docker/Dockerfile'
            eligibility_service:
              imageName: 'eligibility-service'
              context: 'src/Services/canteenServices/eligibilityServices'
              dockerfile: 'src/Services/canteenServices/eligibilityServices/Docker/Dockerfile'
            item_master_service:
              imageName: 'item-master-service'
              context: 'src/Services/canteenServices/itemmasterServices'
              dockerfile: 'src/Services/canteenServices/itemmasterServices/Docker/Dockerfile'
            reference_data_service:
              imageName: 'reference-data-service'
              context: 'src/Services/canteenServices/referencedataServices'
              dockerfile: 'src/Services/canteenServices/referencedataServices/Docker/Dockerfile'
            swipe_transaction_service:
              imageName: 'swipe-transaction-service'
              context: 'src/Services/canteenServices/swipeTransactionServices'
              dockerfile: 'src/Services/canteenServices/swipeTransactionServices/Docker/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/canteenServices/ApiGateway'
              dockerfile: 'src/Services/canteenServices/ApiGateway/Dockerfile'
            canteen_transaction_service:
              imageName: 'canteen-transaction-service'
              context: 'src/Services/canteenServices/canteenTransactionServices'
              dockerfile: 'src/Services/canteenServices/canteenTransactionServices/Docker/Dockerfile'
            canteen_unit_service:
              imageName: 'canteen-unit-service'
              context: 'src/Services/canteenServices/canteenunitServices'
              dockerfile: 'src/Services/canteenServices/canteenunitServices/Docker/Dockerfile'
            card_management_service:
              imageName: 'card-management-service'
              context: 'src/Services/canteenServices/cardmanagementServices'
              dockerfile: 'src/Services/canteenServices/cardmanagementServices/Docker/Dockerfile'
            deduction_service:
              imageName: 'deduction-service'
              context: 'src/Services/canteenServices/deductionServices'
              dockerfile: 'src/Services/canteenServices/deductionServices/Docker/Dockerfile'
            eligibility_service:
              imageName: 'eligibility-service'
              context: 'src/Services/canteenServices/eligibilityServices'
              dockerfile: 'src/Services/canteenServices/eligibilityServices/Docker/Dockerfile'
            item_master_service:
              imageName: 'item-master-service'
              context: 'src/Services/canteenServices/itemmasterServices'
              dockerfile: 'src/Services/canteenServices/itemmasterServices/Docker/Dockerfile'
            reference_data_service:
              imageName: 'reference-data-service'
              context: 'src/Services/canteenServices/referencedataServices'
              dockerfile: 'src/Services/canteenServices/referencedataServices/Docker/Dockerfile'
            swipe_transaction_service:
              imageName: 'swipe-transaction-service'
              context: 'src/Services/canteenServices/swipeTransactionServices'
              dockerfile: 'src/Services/canteenServices/swipeTransactionServices/Docker/Dockerfile'

        steps:
          - checkout: none

          - bash: |
              set -euo pipefail
              if [ -z "${GITHUB_TOKEN:-}" ]; then
                echo "##[error]GITHUB_TOKEN is not set. Add it as a secret pipeline variable (GitHub PAT with write:packages scope)."
                exit 1
              fi
              if [ -z "${GITHUB_ACTOR:-}" ]; then
                echo "##[error]GITHUB_ACTOR is not set. Add it as a pipeline variable (your GitHub username)."
                exit 1
              fi
              echo "Logging in as: $GITHUB_ACTOR"
              echo "Token length: ${#GITHUB_TOKEN} chars"
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              echo "GHCR login succeeded."
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/canteenServices/ApiGateway'
              dockerfile: 'src/Services/canteenServices/ApiGateway/Dockerfile'
            canteen_transaction_service:
              imageName: 'canteen-transaction-service'
              context: 'src/Services/canteenServices/canteenTransactionServices'
              dockerfile: 'src/Services/canteenServices/canteenTransactionServices/Docker/Dockerfile'
            canteen_unit_service:
              imageName: 'canteen-unit-service'
              context: 'src/Services/canteenServices/canteenunitServices'
              dockerfile: 'src/Services/canteenServices/canteenunitServices/Docker/Dockerfile'
            card_management_service:
              imageName: 'card-management-service'
              context: 'src/Services/canteenServices/cardmanagementServices'
              dockerfile: 'src/Services/canteenServices/cardmanagementServices/Docker/Dockerfile'
            deduction_service:
              imageName: 'deduction-service'
              context: 'src/Services/canteenServices/deductionServices'
              dockerfile: 'src/Services/canteenServices/deductionServices/Docker/Dockerfile'
            eligibility_service:
              imageName: 'eligibility-service'
              context: 'src/Services/canteenServices/eligibilityServices'
              dockerfile: 'src/Services/canteenServices/eligibilityServices/Docker/Dockerfile'
            item_master_service:
              imageName: 'item-master-service'
              context: 'src/Services/canteenServices/itemmasterServices'
              dockerfile: 'src/Services/canteenServices/itemmasterServices/Docker/Dockerfile'
            reference_data_service:
              imageName: 'reference-data-service'
              context: 'src/Services/canteenServices/referencedataServices'
              dockerfile: 'src/Services/canteenServices/referencedataServices/Docker/Dockerfile'
            swipe_transaction_service:
              imageName: 'swipe-transaction-service'
              context: 'src/Services/canteenServices/swipeTransactionServices'
              dockerfile: 'src/Services/canteenServices/swipeTransactionServices/Docker/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
