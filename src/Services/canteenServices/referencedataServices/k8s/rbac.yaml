apiVersion: v1
kind: Namespace
metadata:
  name: referencedata-service
  labels:
    name: referencedata-service
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: referencedata-service
  namespace: referencedata-service
  labels:
    app: referencedata-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: referencedata-service-role
  namespace: referencedata-service
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["referencedata-service-config"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["referencedata-service-secrets"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: referencedata-service-rolebinding
  namespace: referencedata-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: referencedata-service-role
subjects:
- kind: ServiceAccount
  name: referencedata-service
  namespace: referencedata-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: referencedata-service-pdb
  namespace: referencedata-service
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: referencedata-service
