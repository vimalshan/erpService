version: '3.8'

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-referencedata-db
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '512'
    ports:
      - "1443:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./ReferenceData:/sql
      - ./Docker/init-database.sql:/init-database.sql
      - ./Docker/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - referencedata-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: referencedata-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5679:5672"
      - "15679:15672"
    networks:
      - referencedata-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  referencedata-service:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: referencedata-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5195'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=ReferenceDataDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'ReferenceDataService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'ReferenceDataService'
      Jwt__Audience: 'ReferenceDataService.Clients'
      Jwt__ExpireMinutes: '60'
      RabbitMQ__HostName: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: 'guest'
      RabbitMQ__Password: 'guest'
      AzureBlobStorage__ConnectionString: 'UseDevelopmentStorage=true'
      AzureBlobStorage__ContainerName: 'stationery-images'
    ports:
      - "5195:5195"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - referencedata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5195/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  referencedata-network:
    driver: bridge

volumes:
  mssql_data:
