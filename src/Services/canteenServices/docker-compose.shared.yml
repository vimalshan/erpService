
# Shared canteen infrastructure — SQL Server, RabbitMQ, Azurite
# Used as a base for the full stack compose or standalone infra only.
# Usage: docker compose -f docker-compose.shared.yml up -d

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: canteen-shared-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '1024'
    ports:
      - "1434:1433"
    volumes:
      - canteen_mssql_data:/var/opt/mssql
      - ./shared-entrypoint.sh:/entrypoint.sh
      - ./init-all-databases.sql:/init-all-databases.sql
      - ./canteenunitServices/CanteenUnit:/sql/CanteenUnit
      - ./cardmanagementServices/CardManagement:/sql/CardManagement
      - ./deductionServices/Deduction:/sql/Deduction
      - ./eligibilityServices/Eligibility:/sql/Eligibility
      - ./itemmasterServices/ItemMaster:/sql/ItemMaster
      - ./swipeTransactionServices/SwipeTransaction:/sql/SwipeTransaction
      - ./referencedataServices/ReferenceData:/sql/ReferenceData
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - canteen-shared-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: canteen-shared-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - canteen-shared-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: canteen-shared-azurite
    ports:
      - "10010:10000"
      - "10011:10001"
      - "10012:10002"
    networks:
      - canteen-shared-network

networks:
  canteen-shared-network:
    driver: bridge
    name: canteen-shared-network

volumes:
  canteen_mssql_data:
