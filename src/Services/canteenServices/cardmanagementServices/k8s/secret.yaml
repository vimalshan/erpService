apiVersion: v1
kind: Secret
metadata:
  name: card-management-service-secrets
  namespace: card-management-service
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=sql-server.default.svc.cluster.local;Database=CardManagementDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
  Jwt__Key: "CardManagement-SuperSecretKey-ChangeInProduction-Min32Characters!"
