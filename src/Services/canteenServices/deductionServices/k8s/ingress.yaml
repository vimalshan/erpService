apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deduction-service-ingress
  namespace: deduction-service
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - deduction.example.com
    secretName: deduction-service-tls
  rules:
  - host: deduction.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deduction-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deduction-service-network-policy
  namespace: deduction-service
spec:
  podSelector:
    matchLabels:
      app: deduction-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5192
  egress:
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 1433
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5672
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
