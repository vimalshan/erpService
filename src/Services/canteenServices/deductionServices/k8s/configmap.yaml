apiVersion: v1
kind: Namespace
metadata:
  name: deduction-service
  labels:
    name: deduction-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deduction-service-config
  namespace: deduction-service
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5192"
  Jwt__Issuer: "DeductionService"
  Jwt__Audience: "DeductionServiceClients"
  Jwt__ExpiryMinutes: "60"
  RabbitMQ__Host: "rabbitmq.deduction-service.svc.cluster.local"
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: "guest"
  RabbitMQ__VirtualHost: "/"
  RabbitMQ__Exchange: "deduction.exchange"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"
