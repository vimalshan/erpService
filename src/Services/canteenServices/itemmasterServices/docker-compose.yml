services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-itemmaster-db
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '512'
    ports:
      - "1444:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./ItemMaster:/sql
      - ./Docker/init-database.sql:/init-database.sql
      - ./Docker/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - itemmaster-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: itemmaster-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5680:5672"
      - "15680:15672"
    networks:
      - itemmaster-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  itemmaster-service:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: itemmaster-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5194'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=ItemMasterDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'ItemMasterService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'ItemMasterService'
      Jwt__Audience: 'ItemMasterServiceClients'
      Jwt__ExpiresInMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__VirtualHost: '/'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__ExchangeName: 'itemmaster.exchange'
    ports:
      - "5194:5194"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - itemmaster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5194/health"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10

networks:
  itemmaster-network:
    driver: bridge

volumes:
  mssql_data:
