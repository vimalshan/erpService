apiVersion: v1
kind: Service
metadata:
  name: itemmaster-service
  namespace: itemmaster-service
  labels:
    app: itemmaster-service
spec:
  type: LoadBalancer
  selector:
    app: itemmaster-service
  ports:
  - name: http
    port: 80
    targetPort: 5194
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: itemmaster-service-internal
  namespace: itemmaster-service
  labels:
    app: itemmaster-service
spec:
  type: ClusterIP
  selector:
    app: itemmaster-service
  ports:
  - name: http
    port: 5194
    targetPort: 5194
    protocol: TCP
