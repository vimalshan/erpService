
# Full canteen microservices stack — builds all services from local source
# Usage:
#   docker compose up --build -d
#   docker compose up --build -d (fresh start: docker compose down -v first)

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: canteen-shared-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '1024'
    ports:
      - "1434:1433"
    volumes:
      - canteen_mssql_data:/var/opt/mssql
      - ./shared-entrypoint.sh:/entrypoint.sh
      - ./init-all-databases.sql:/init-all-databases.sql
      - ./canteenunitServices/CanteenUnit:/sql/CanteenUnit
      - ./cardmanagementServices/CardManagement:/sql/CardManagement
      - ./deductionServices/Deduction:/sql/Deduction
      - ./eligibilityServices/Eligibility:/sql/Eligibility
      - ./itemmasterServices/ItemMaster:/sql/ItemMaster
      - ./swipeTransactionServices/SwipeTransaction:/sql/SwipeTransaction
      - ./canteenTransactionServices/CanteenTransaction:/sql/CanteenTransaction
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: canteen-shared-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: canteen-shared-azurite
    ports:
      - "10010:10000"
      - "10011:10001"
      - "10012:10002"
    networks:
      - canteen-network

  # ── CanteenUnit Service ───────────────────────────────────────────────────
  canteen-unit-service:
    build:
      context: ./canteenunitServices
      dockerfile: Docker/Dockerfile
    container_name: canteen-unit-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5190'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=CanteenUnitDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'CanteenUnit-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'CanteenUnitAPI'
      Jwt__Audience: 'CanteenUnitClients'
      Jwt__ExpiresInMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VHost: '/'
    ports:
      - "5190:5190"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5190/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── CardManagement Service ────────────────────────────────────────────────
  card-management-service:
    build:
      context: ./cardmanagementServices
      dockerfile: Docker/Dockerfile
    container_name: card-management-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5191'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=CardManagementDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'CardManagement-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'CardManagementAPI'
      Jwt__Audience: 'CardManagementClients'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
    ports:
      - "5191:5191"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5191/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── DeductionService ─────────────────────────────────────────────────────
  deduction-service:
    build:
      context: ./deductionServices
      dockerfile: Docker/Dockerfile
    container_name: deduction-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5192'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=DeductionServiceDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'DeductionService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'DeductionService'
      Jwt__Audience: 'DeductionServiceClients'
      Jwt__ExpiryMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
      RabbitMQ__Exchange: 'deduction.exchange'
    ports:
      - "5192:5192"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5192/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── EligibilityService ───────────────────────────────────────────────────
  eligibility-service:
    build:
      context: ./eligibilityServices
      dockerfile: Docker/Dockerfile
    container_name: eligibility-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5193'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=EligibilityServiceDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'EligibilityService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'EligibilityService'
      Jwt__Audience: 'EligibilityServiceClients'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
    ports:
      - "5193:5193"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5193/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── ItemMasterService ────────────────────────────────────────────────────
  itemmaster-service:
    build:
      context: ./itemmasterServices
      dockerfile: Docker/Dockerfile
    container_name: itemmaster-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5194'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=ItemMasterDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'ItemMasterService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'ItemMasterService'
      Jwt__Audience: 'ItemMasterServiceClients'
      Jwt__ExpiresInMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__VirtualHost: '/'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__ExchangeName: 'itemmaster.exchange'
    ports:
      - "5194:5194"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5194/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── SwipeTransactionService ──────────────────────────────────────────────
  swipe-transaction-service:
    build:
      context: ./swipeTransactionServices
      dockerfile: Docker/Dockerfile
    container_name: swipe-transaction-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5196'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=SwipeTransactionDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Secret: 'SwipeTransactionService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'SwipeTransactionService'
      Jwt__Audience: 'SwipeTransactionServiceClients'
      Jwt__ExpiryMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
    ports:
      - "5196:5196"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5196/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── CanteenTransaction Service ────────────────────────────────────────────
  canteen-transaction-service:
    build:
      context: ./canteenTransactionServices
      dockerfile: Docker/Dockerfile
    container_name: canteen-transaction-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5197'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=CanteenTransactionDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'CanteenTransactionService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'CanteenTransactionService'
      Jwt__Audience: 'CanteenTransactionServiceClients'
      Jwt__ExpiresInMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
      RabbitMQ__ExchangeName: 'canteentransaction.exchange'
    ports:
      - "5197:5197"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5197/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── ReferenceDataService ─────────────────────────────────────────────────
  referencedata-service:
    build:
      context: ./referencedataServices
      dockerfile: Docker/Dockerfile
    container_name: referencedata-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5195'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=ReferenceDataDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'ReferenceDataService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'ReferenceDataService'
      Jwt__Audience: 'ReferenceDataService.Clients'
      Jwt__ExpireMinutes: '60'
      RabbitMQ__HostName: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: 'guest'
      RabbitMQ__Password: 'guest'
      AzureBlobStorage__ConnectionString: 'UseDevelopmentStorage=true'
      AzureBlobStorage__ContainerName: 'stationery-images'
    ports:
      - "5195:5195"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5195/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── API Gateway (Ocelot) ─────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: canteen-api-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: 'Docker'
      ASPNETCORE_URLS: 'http://+:5200'
      Jwt__Key: 'CanteenGateway-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'CanteenGateway'
      Jwt__Audience: 'CanteenGatewayClients'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
      ServiceEndpoints__CanteenUnit: 'http://canteen-unit-service:5190'
      ServiceEndpoints__CardManagement: 'http://card-management-service:5191'
      ServiceEndpoints__Deduction: 'http://deduction-service:5192'
      ServiceEndpoints__Eligibility: 'http://eligibility-service:5193'
      ServiceEndpoints__ItemMaster: 'http://itemmaster-service:5194'
      ServiceEndpoints__ReferenceData: 'http://referencedata-service:5195'
      ServiceEndpoints__SwipeTransaction: 'http://swipe-transaction-service:5196'
      ServiceEndpoints__CanteenTransaction: 'http://canteen-transaction-service:5197'
    ports:
      - "5200:5200"
    depends_on:
      canteen-unit-service:
        condition: service_healthy
      card-management-service:
        condition: service_healthy
      deduction-service:
        condition: service_healthy
      eligibility-service:
        condition: service_healthy
      itemmaster-service:
        condition: service_healthy
      referencedata-service:
        condition: service_healthy
      swipe-transaction-service:
        condition: service_healthy
      canteen-transaction-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5200/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  canteen-network:
    driver: bridge

volumes:
  canteen_mssql_data:
