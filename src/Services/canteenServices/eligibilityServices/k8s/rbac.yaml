apiVersion: v1
kind: Namespace
metadata:
  name: eligibility-service
  labels:
    name: eligibility-service
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eligibility-service
  namespace: eligibility-service
  labels:
    app: eligibility-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eligibility-service-role
  namespace: eligibility-service
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["eligibility-service-config"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["eligibility-service-secrets"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eligibility-service-rolebinding
  namespace: eligibility-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eligibility-service-role
subjects:
- kind: ServiceAccount
  name: eligibility-service
  namespace: eligibility-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eligibility-service-pdb
  namespace: eligibility-service
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: eligibility-service
