# ──────────────────────────────────────────────────────────────────────────────
# Production Compose — pulls pre-built images from GHCR
# Usage:  docker compose -f docker-compose.prod.yml up -d
# Images: ghcr.io/vimalshan/erp/<service>:latest (public, no login required)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── SQL Server ─────────────────────────────────────
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: canteen-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '1024'
    ports:
      - "1434:1433"
    volumes:
      - canteen_mssql_data:/var/opt/mssql
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -No -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20
    restart: unless-stopped

  # ─── RabbitMQ ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: canteen-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Azurite (blob storage) ─────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: canteen-azurite
    ports:
      - "10010:10000"
      - "10011:10001"
      - "10012:10002"
    networks:
      - canteen-network
    restart: unless-stopped

  # ─── CanteenUnit Service ────────────────────────────
  canteen-unit-service:
    image: ghcr.io/vimalshan/erp/canteen-unit-service:latest
    container_name: canteen-unit-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5190'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=CanteenUnitDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'CanteenUnit-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'CanteenUnitAPI'
      Jwt__Audience: 'CanteenUnitClients'
      Jwt__ExpiresInMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VHost: '/'
    ports:
      - "5190:5190"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5190'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ─── CardManagement Service ─────────────────────────
  card-management-service:
    image: ghcr.io/vimalshan/erp/card-management-service:latest
    container_name: card-management-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5191'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=CardManagementDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'CardManagement-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'CardManagementAPI'
      Jwt__Audience: 'CardManagementClients'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
    ports:
      - "5191:5191"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
