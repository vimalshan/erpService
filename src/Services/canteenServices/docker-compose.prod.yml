      Jwt__Key: 'EligibilityService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'EligibilityService'
      Jwt__Audience: 'EligibilityServiceClients'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
    ports:
      - "5193:5193"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5193'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ─── ItemMasterService ─────────────────────────────
  itemmaster-service:
    image: ghcr.io/vimalshan/erp/item-master-service:latest
    container_name: itemmaster-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5194'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=ItemMasterDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'ItemMasterService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'ItemMasterService'
      Jwt__Audience: 'ItemMasterServiceClients'
      Jwt__ExpiresInMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__VirtualHost: '/'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
