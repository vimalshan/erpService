  # ─── ReferenceDataService ──────────────────────────
  referencedata-service:
    image: ghcr.io/vimalshan/erp/reference-data-service:latest
    container_name: referencedata-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5195'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=ReferenceDataDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'ReferenceDataService-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'ReferenceDataService'
      Jwt__Audience: 'ReferenceDataService.Clients'
      Jwt__ExpireMinutes: '60'
      RabbitMQ__HostName: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: 'guest'
      RabbitMQ__Password: 'guest'
      AzureBlobStorage__ConnectionString: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;'
      AzureBlobStorage__ContainerName: 'stationery-images'
    ports:
      - "5195:5195"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_started
    networks:
