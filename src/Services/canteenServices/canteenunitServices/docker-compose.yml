version: '3.8'

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-canteen-unit-db
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '512'
    ports:
      - "1440:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./CanteenUnit:/sql
      - ./Docker/init-database.sql:/init-database.sql
      - ./Docker/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - canteen-unit-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: canteen-unit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5676:5672"
      - "15676:15672"
    networks:
      - canteen-unit-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  canteen-unit-service:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: canteen-unit-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5190'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=CanteenUnitDb;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      Jwt__Key: 'CanteenUnit-SuperSecretKey-ChangeInProduction-Min32Characters!'
      Jwt__Issuer: 'CanteenUnitAPI'
      Jwt__Audience: 'CanteenUnitClients'
      Jwt__ExpiresInMinutes: '60'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VHost: '/'
    ports:
      - "5190:5190"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - canteen-unit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5190/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  canteen-unit-network:
    driver: bridge

volumes:
  mssql_data:
