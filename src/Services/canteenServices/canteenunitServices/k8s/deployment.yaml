apiVersion: apps/v1
kind: Deployment
metadata:
  name: canteen-unit-service
  namespace: canteen-unit-service
  labels:
    app: canteen-unit-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: canteen-unit-service
  template:
    metadata:
      labels:
        app: canteen-unit-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5190"
    spec:
      serviceAccountName: canteen-unit-service
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
      containers:
      - name: canteen-unit-service
        image: canteen-unit-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5190
          protocol: TCP
        envFrom:
        - configMapRef:
            name: canteen-unit-service-config
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: canteen-unit-service-secrets
              key: ConnectionStrings__DefaultConnection
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: canteen-unit-service-secrets
              key: Jwt__Key
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: canteen-unit-service-secrets
              key: RabbitMQ__Password
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: canteen-unit-service-config
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - canteen-unit-service
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "api"
        effect: "NoSchedule"
