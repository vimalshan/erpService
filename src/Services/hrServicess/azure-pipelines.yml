# Azure DevOps Pipeline - hrServicess
# Builds and pushes all 12 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push hrServicess

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/hrServicess/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/hrServicess/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - alerts-notifications-service
      - compensation-benefits-service
      - employee-management-service
      - employee-relations-service
      - employee-transactions-service
      - exit-management-service
      - organization-structure-service
      - recruitment-service
      - time-attendance-service
      - training-development-service
      - user-security-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/$(githubOwner)/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/ApiGateway.Dockerfile'
            alerts_notifications_service:
              imageName: 'alerts-notifications-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/AlertsNotifications.Dockerfile'
            compensation_benefits_service:
              imageName: 'compensation-benefits-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/CompensationBenefits.Dockerfile'
            employee_management_service:
              imageName: 'employee-management-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeManagement.Dockerfile'
            employee_relations_service:
              imageName: 'employee-relations-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeRelations.Dockerfile'
            employee_transactions_service:
              imageName: 'employee-transactions-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeTransactions.Dockerfile'
            exit_management_service:
              imageName: 'exit-management-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/ExitManagement.Dockerfile'
            organization_structure_service:
              imageName: 'organization-structure-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/OrganizationStructure.Dockerfile'
            recruitment_service:
              imageName: 'recruitment-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/Recruitment.Dockerfile'
            time_attendance_service:
              imageName: 'time-attendance-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/TimeAttendance.Dockerfile'
            training_development_service:
              imageName: 'training-development-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/TrainingDevelopment.Dockerfile'
            user_security_service:
              imageName: 'user-security-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/UserSecurity.Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/ApiGateway.Dockerfile'
            alerts_notifications_service:
              imageName: 'alerts-notifications-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/AlertsNotifications.Dockerfile'
            compensation_benefits_service:
              imageName: 'compensation-benefits-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/CompensationBenefits.Dockerfile'
            employee_management_service:
              imageName: 'employee-management-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeManagement.Dockerfile'
            employee_relations_service:
              imageName: 'employee-relations-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeRelations.Dockerfile'
            employee_transactions_service:
              imageName: 'employee-transactions-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeTransactions.Dockerfile'
            exit_management_service:
              imageName: 'exit-management-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/ExitManagement.Dockerfile'
            organization_structure_service:
              imageName: 'organization-structure-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/OrganizationStructure.Dockerfile'
            recruitment_service:
              imageName: 'recruitment-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/Recruitment.Dockerfile'
            time_attendance_service:
              imageName: 'time-attendance-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/TimeAttendance.Dockerfile'
            training_development_service:
              imageName: 'training-development-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/TrainingDevelopment.Dockerfile'
            user_security_service:
              imageName: 'user-security-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/UserSecurity.Dockerfile'

        steps:
          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: ghcr-service-connection

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/ApiGateway.Dockerfile'
            alerts_notifications_service:
              imageName: 'alerts-notifications-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/AlertsNotifications.Dockerfile'
            compensation_benefits_service:
              imageName: 'compensation-benefits-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/CompensationBenefits.Dockerfile'
            employee_management_service:
              imageName: 'employee-management-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeManagement.Dockerfile'
            employee_relations_service:
              imageName: 'employee-relations-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeRelations.Dockerfile'
            employee_transactions_service:
              imageName: 'employee-transactions-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/EmployeeTransactions.Dockerfile'
            exit_management_service:
              imageName: 'exit-management-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/ExitManagement.Dockerfile'
            organization_structure_service:
              imageName: 'organization-structure-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/OrganizationStructure.Dockerfile'
            recruitment_service:
              imageName: 'recruitment-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/Recruitment.Dockerfile'
            time_attendance_service:
              imageName: 'time-attendance-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/TimeAttendance.Dockerfile'
            training_development_service:
              imageName: 'training-development-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/TrainingDevelopment.Dockerfile'
            user_security_service:
              imageName: 'user-security-service'
              context: 'src/Services/hrServicess'
              dockerfile: 'src/Services/hrServicess/deployment/Dockerfiles/UserSecurity.Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
