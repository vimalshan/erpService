---
# AlertsNotifications Service
apiVersion: v1
kind: Service
metadata:
  name: alerts-service
  namespace: hr-microservices
  labels:
    app: alerts-service
spec:
  type: ClusterIP
  ports:
    - port: 5154
      targetPort: 5154
      protocol: TCP
  selector:
    app: alerts-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-service
  namespace: hr-microservices
  labels:
    app: alerts-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alerts-service
  template:
    metadata:
      labels:
        app: alerts-service
    spec:
      containers:
      - name: alerts-service
        image: hr-alerts-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5154
        envFrom:
        - configMapRef:
            name: hr-config
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Server=mssql-server;Database=AlertsNotificationsDB;User=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True"
        - name: JwtSettings__Key
          valueFrom:
            secretKeyRef:
              name: hr-secrets
              key: AlertsNotificationsJwtKey
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hr-secrets
              key: SA_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5154
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5154
          initialDelaySeconds: 10
          periodSeconds: 5
---
