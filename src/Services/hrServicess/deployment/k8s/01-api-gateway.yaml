---
# API Gateway Deployment and Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hr-microservices
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5310
      protocol: TCP
      name: http
    - port: 443
      targetPort: 5310
      protocol: TCP
      name: https
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hr-microservices
  labels:
    app: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: hr-api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5310
          name: http
        envFrom:
        - configMapRef:
            name: hr-config
        env:
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: hr-secrets
              key: JwtSecret
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: hr-secrets
              key: RabbitMQ__Password
        - name: ConnectionStrings__SqlServer
          value: "Server=mssql-server;Database=master;User=sa;Password=$(SA_PASSWORD);TrustServerCertificate=True"
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hr-secrets
              key: SA_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5310
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5310
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: hr-microservices
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
  - hosts:
    - hr-gateway.example.com
    secretName: hr-gateway-tls
  rules:
  - host: hr-gateway.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
---
# Horizontal Pod Autoscaler for API Gateway
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: hr-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
