version: '3.8'

services:
  # SQL Server Database
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hr-sql-server
    environment:
      SA_PASSWORD: "SafePassword123!@#"
      ACCEPT_EULA: "Y"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./deployment/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - hr-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SafePassword123!@#", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: hr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hr-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: deployment/Dockerfiles/ApiGateway.Dockerfile
    container_name: hr-api-gateway
    ports:
      - "5310:5310"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=sql-server;Database=master;User=sa;Password=SafePassword123!@#;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
      Jwt__Secret: "SuperSecureGatewaySecretKey2026$#@!"
      Jwt__Issuer: "HrGateway"
      Jwt__Audience: "HrGatewayClients"
    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - hr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5310/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AlertsNotifications Service
  alerts-service:
    build:
      context: .
      dockerfile: deployment/Dockerfiles/AlertsNotifications.Dockerfile
    container_name: hr-alerts-service
    ports:
      - "5154:5154"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sql-server;Database=AlertsNotificationsDB;User=sa;Password=SafePassword123!@#;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
      JwtSettings__Key: "AlertsNotificationsSuperSecretKey2026$#@!"
      JwtSettings__Issuer: "AlertsNotificationsService"
      JwtSettings__Audience: "AlertsNotificationsClient"
    depends_on:
      sql-server:
