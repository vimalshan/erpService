version: '3.8'

# ============================================================================
# Shared infrastructure services for Cash Services microservices
# Usage: docker-compose -f docker-compose.shared.yml up -d
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # SQL Server
  # --------------------------------------------------------------------------
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cashservices-mssql
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: '${MSSQL_SA_PASSWORD:-CashServices2026!}'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '1024'
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./Docker/init-cashdb.sql:/docker-entrypoint-initdb.d/01-init-cashdb.sql
      - ./Docker/init-transactiondb.sql:/docker-entrypoint-initdb.d/02-init-transactiondb.sql
      - ./Docker/init-emaildb.sql:/docker-entrypoint-initdb.d/03-init-emaildb.sql
    networks:
      - cashservices-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-CashServices2026!}", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 15
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # RabbitMQ
  # --------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cashservices-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-guest}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASS:-guest}'
      RABBITMQ_DEFAULT_VHOST: '/'
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cashservices-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Azurite (Azure Storage Emulator)
  # --------------------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: cashservices-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    networks:
      - cashservices-network
    restart: unless-stopped

networks:
  cashservices-network:
    driver: bridge
    name: cashservices-network

volumes:
  mssql_data:
  rabbitmq_data:
  azurite_data:
