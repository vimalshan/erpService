apiVersion: v1
kind: Namespace
metadata:
  name: cash-services
  labels:
    name: cash-services
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cash-services-sa
  namespace: cash-services
  labels:
    app: cash-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cash-services-role
  namespace: cash-services
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cash-services-rolebinding
  namespace: cash-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cash-services-role
subjects:
- kind: ServiceAccount
  name: cash-services-sa
  namespace: cash-services
