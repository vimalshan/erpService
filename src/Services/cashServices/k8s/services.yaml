# ============================================================================
# Cash Services - Kubernetes Services
# ============================================================================

# --------------------------------------------------------------------------
# API Gateway (External LoadBalancer)
# --------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cash-services
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP

---
# --------------------------------------------------------------------------
# Organization Setup Service (ClusterIP)
# --------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: organization-setup-api
  namespace: cash-services
  labels:
    app: organization-setup-api
spec:
  type: ClusterIP
  selector:
    app: organization-setup-api
  ports:
  - name: http
    port: 5099
    targetPort: 5099

