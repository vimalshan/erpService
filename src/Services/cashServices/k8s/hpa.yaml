# ============================================================================
# Pod Disruption Budgets
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: cash-services
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway

