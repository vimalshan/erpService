apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cash-services-ingress
  namespace: cash-services
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - cash-api.example.com
    secretName: cash-services-tls
  rules:
  - host: cash-api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cash-services-network-policy
  namespace: cash-services
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow internal traffic within namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: cash-services
  # Allow ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  # Allow internal namespace traffic
  - to:
    - namespaceSelector:
        matchLabels:
          name: cash-services
  # Allow HTTPS outbound
  - to: []
    ports:
    - protocol: TCP
      port: 443
