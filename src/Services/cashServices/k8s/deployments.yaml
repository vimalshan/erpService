# ============================================================================
# Cash Services - All Microservice Deployments
# ============================================================================

# --------------------------------------------------------------------------
# API Gateway (Port 5000)
# --------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cash-services
  labels:
    app: api-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      serviceAccountName: cash-services-sa
      containers:
      - name: api-gateway
        image: cashservices/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: cash-services-config
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5000"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: cash-services-secrets
              key: ConnectionStrings__CASHDB
        - name: RabbitMQ__UserName
          valueFrom:
            secretKeyRef:
              name: cash-services-secrets
              key: RABBITMQ_USER
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: cash-services-secrets
              key: RABBITMQ_PASS
        - name: ServiceEndpoints__CashManagement
          value: "http://cash-management-api:5249"
        - name: ServiceEndpoints__CurrencyManagement
          value: "http://currency-management-api:5031"
        - name: ServiceEndpoints__DealTicketing
          value: "http://deal-ticketing-api:5081"
        - name: ServiceEndpoints__LoanManagement
          value: "http://loan-management-api:5268"
        - name: ServiceEndpoints__OrganizationSetup
          value: "http://organization-setup-api:5099"
        - name: ServiceEndpoints__EmailNotification
          value: "http://email-notification-api:5032"
        - name: ServiceEndpoints__TransactionProcessing
          value: "http://transaction-processing-api:5100"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30

