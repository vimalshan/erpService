version: '3.8'

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dealticket-mssql
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'CashServices2026!'
      MSSQL_PID: 'Express'
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - dealticket-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CashServices2026!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dealticket-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - dealticket-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10

  deal-ticketing-api:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: deal-ticketing-api
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5081'
      ConnectionStrings__DealTicketingDb: 'Data Source=mssql-server,1433;Initial Catalog=CASHDB;User ID=sa;Password=CashServices2026!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
    ports:
      - "5081:5081"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dealticket-network

networks:
  dealticket-network:
    driver: bridge

volumes:
  mssql_data:
