      ASPNETCORE_URLS: 'http://+:5268'
      ConnectionStrings__LoanManagement: 'Data Source=mssql-server,1433;Initial Catalog=CASHDB;User ID=sa;Password=CashServices2026!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30'
      RabbitMQ__HostName: 'rabbitmq'
      RabbitMQ__Port: '5672'
