    restart: unless-stopped

  # ─── Currency Management Service (Port 5031) ────────
  currency-management-api:
    image: ghcr.io/vimalshan/erp/current-management-service:latest
    container_name: cash-currency-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5031'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=CASHDB;User ID=sa;Password=CashServices2026!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30'
      RabbitMQ__HostName: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: 'guest'
      RabbitMQ__Password: 'guest'
    ports:
      - "5031:5031"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
