  # --------------------------------------------------------------------------
  # Deal Ticketing Service (Port 5081)
  # --------------------------------------------------------------------------
  deal-ticketing-api:
    build:
      context: ./dealticketingServices
      dockerfile: Docker/Dockerfile
    container_name: cashservices-deals
