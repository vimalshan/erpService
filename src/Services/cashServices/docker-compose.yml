      ASPNETCORE_URLS: 'http://+:5100'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=TransactionProcessingDb;User ID=sa;Password=${MSSQL_SA_PASSWORD:-CashServices2026!};Encrypt=False;TrustServerCertificate=True;Connection Timeout=30'
      RabbitMQ__Enabled: 'true'
      RabbitMQ__HostName: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: '${RABBITMQ_USER:-guest}'
      RabbitMQ__Password: '${RABBITMQ_PASS:-guest}'
    ports:
