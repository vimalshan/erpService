# ──────────────────────────────────────────────────────────────────────────────
# Production Compose — pulls pre-built images from GHCR
# Usage:  docker compose -f docker-compose.prod.yml up -d
# Images: ghcr.io/vimalshan/erp/<service>:latest (public, no login required)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── Shared SQL Server ─────────────────────────────
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aims-shared-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_MEMORY_LIMIT_MB: '512'
    ports:
      - "1433:1433"
    volumes:
      - shared_mssql_data:/var/opt/mssql
      - ./init-all-databases.sql:/init-all-databases.sql
      - ./shared-entrypoint.sh:/shared-entrypoint.sh
    entrypoint: ["/bin/bash", "/shared-entrypoint.sh"]
    networks:
      - aims-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20

  # ─── Shared RabbitMQ ────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: aims-shared-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - aims-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Azurite (for blob storage) ─────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: aims-shared-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - shared_azurite_data:/data
    networks:
      - aims-network

  # ─── Access Service ────────────────────────────────
  access-service:
    image: ghcr.io/vimalshan/erp/access-service:latest
    container_name: aims-access-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:80'
      ConnectionStrings__DefaultConnection: 'Server=mssql-server;Database=ACCESSDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=true;'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      Jwt__Issuer: 'AccessService'
      Jwt__Audience: 'AccessService'
      Jwt__Key: 'AccessService_SuperSecretKey_MinLength32Characters!'
    ports:
      - "5010:80"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - aims-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/80'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ─── Attendance Service ────────────────────────────
  attendance-service:
    image: ghcr.io/vimalshan/erp/attendance-service:latest
    container_name: aims-attendance-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:80'
      ConnectionStrings__AttendanceDb: 'Server=mssql-server;Database=ATTENDANCEDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=true;'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      Jwt__Issuer: 'AttendanceService'
      Jwt__Audience: 'AttendanceService'
      Jwt__Key: 'AttendanceSuperSecretKey_Change_In_Production_2026!'
      AzureStorage__ConnectionString: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;'
    ports:
      - "5011:80"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
