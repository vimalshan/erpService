version: "3.8"

# ERP Microservices - Full Stack
# Usage: docker-compose -f docker-compose.shared.yml -f docker-compose.yml up -d
# Build:  docker-compose -f docker-compose.shared.yml -f docker-compose.yml build

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - erp-network
  depends_on:
    sqlserver:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # ──────────────────────────────────────────────
  # API Gateway (net10.0) - Port 5020
  # ──────────────────────────────────────────────
  api-gateway:
    restart: unless-stopped
    networks:
      - erp-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      access-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      bus-service:
        condition: service_healthy
      calendar-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      groupincentive-service:
        condition: service_healthy
      leave-service:
        condition: service_healthy
      reference-service:
        condition: service_healthy
      visitor-service:
        condition: service_healthy
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: erp-api-gateway
    ports:
      - "5020:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Key=${JWT_KEY_GATEWAY:-ApiGateway_SuperSecretSigningKey_2026_MinLength32Chars!!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      # Downstream service URLs (Docker container names)
      - Services__AccessService=http://access-service:80
      - Services__AttendanceService=http://attendance-service:80
      - Services__BusService=http://bus-service:80
      - Services__CalendarService=http://calendar-service:80
      - Services__EmployeeService=http://employee-service:80
      - Services__GroupIncentiveService=http://groupincentive-service:80
      - Services__LeaveService=http://leave-service:80
      - Services__ReferenceService=http://reference-service:80
      - Services__VisitorService=http://visitor-service:80
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ──────────────────────────────────────────────
  # Access Service (net8.0) - Port 5010
  # ──────────────────────────────────────────────
  access-service:
    <<: *service-defaults
    build:
      context: ./accessServices
      dockerfile: Dockerfile
    container_name: erp-access-service
    ports:
      - "5010:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ACCESSDB;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStr0ng!Passw0rd};TrustServerCertificate=true;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Jwt__Issuer=AccessService
      - Jwt__Audience=AccessService
      - Jwt__Key=${JWT_KEY_ACCESS:-your-very-long-secret-key-here-min-32-characters}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────
  # Attendance Service (net10.0) - Port 5011
  # ──────────────────────────────────────────────
  attendance-service:
    <<: *service-defaults
    build:
      context: ./attendanceServices
      dockerfile: Dockerfile
    container_name: erp-attendance-service
    ports:
      - "5011:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AttendanceDb=Server=sqlserver;Database=ATTENDANCEDB;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStr0ng!Passw0rd};TrustServerCertificate=true;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Jwt__Issuer=AttendanceService
      - Jwt__Audience=AttendanceService
      - Jwt__Key=${JWT_KEY_ATTENDANCE:-AttendanceSuperSecretKey_Change_In_Production_2026!}
      - AzureStorage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

