##################################################
# API Gateway
##################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: erp-system
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: erp/api-gateway:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: erp-config
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: JWT_KEY_GATEWAY
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: RABBITMQ_PASSWORD
            - name: Services__AccessService
              value: "http://access-service:80"
            - name: Services__AttendanceService
              value: "http://attendance-service:80"
            - name: Services__BusService
              value: "http://bus-service:80"
            - name: Services__CalendarService
              value: "http://calendar-service:80"
            - name: Services__EmployeeService
              value: "http://employee-service:80"
            - name: Services__GroupIncentiveService
              value: "http://groupincentive-service:80"
            - name: Services__LeaveService
              value: "http://leave-service:80"
            - name: Services__ReferenceService
              value: "http://reference-service:80"
            - name: Services__VisitorService
              value: "http://visitor-service:80"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 40
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: erp-system
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
---
##################################################
# Access Service
##################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-service
  namespace: erp-system
  labels:
    app: access-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: access-service
  template:
    metadata:
      labels:
        app: access-service
    spec:
      containers:
        - name: access-service
          image: erp/access-service:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: erp-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: ACCESS_DB_CONN
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: RABBITMQ_PASSWORD
            - name: Jwt__Issuer
              value: "AccessService"
            - name: Jwt__Audience
              value: "AccessService"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: JWT_KEY_ACCESS
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: access-service
  namespace: erp-system
spec:
  selector:
    app: access-service
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
