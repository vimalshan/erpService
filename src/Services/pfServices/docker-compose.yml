      RabbitMQ__Password: ${RABBITMQ_PASS:-pfpassword}
      Jwt__Key: ${JWT_SECRET_KEY:-YourSuperSecretKeyHereMustBeLongEnough256Bits!!}
      Jwt__Issuer: BankService
