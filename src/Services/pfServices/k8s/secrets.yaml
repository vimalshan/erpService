# WARNING: Replace placeholder values before applying.
# In production, use external secret management (Azure Key Vault, HashiCorp Vault, Sealed Secrets, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: pf-secrets
  namespace: pf-services
type: Opaque
stringData:
  # SQL Server
  sa-password: "CHANGE_ME_SA_PASSWORD"
  sqlserver-connection-default: "Server=sqlserver-svc,1433;Database=PFDB;User Id=sa;Password=CHANGE_ME_SA_PASSWORD;TrustServerCertificate=True;Encrypt=True;"
  sqlserver-connection-bank: "Server=sqlserver-svc,1433;Database=PFDB;User Id=sa;Password=CHANGE_ME_SA_PASSWORD;TrustServerCertificate=True;Encrypt=True;"
  sqlserver-connection-investment: "Server=sqlserver-svc,1433;Database=PFDB;User Id=sa;Password=CHANGE_ME_SA_PASSWORD;TrustServerCertificate=True;Encrypt=True;"
  sqlserver-connection-pftransactional: "Server=sqlserver-svc,1433;Database=PFDB;User Id=sa;Password=CHANGE_ME_SA_PASSWORD;TrustServerCertificate=True;Encrypt=True;"
  sqlserver-connection-settlement: "Server=sqlserver-svc,1433;Database=PFDB;User Id=sa;Password=CHANGE_ME_SA_PASSWORD;TrustServerCertificate=True;Encrypt=True;"
  # RabbitMQ
  rabbitmq-user: "pfuser"
  rabbitmq-password: "CHANGE_ME_RABBITMQ_PASSWORD"
  # JWT
  jwt-secret-key: "CHANGE_ME_JWT_SECRET_KEY_MUST_BE_AT_LEAST_256_BITS"
