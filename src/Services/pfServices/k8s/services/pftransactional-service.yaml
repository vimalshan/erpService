apiVersion: apps/v1
kind: Deployment
metadata:
  name: pftransactional-service
  namespace: pf-services
  labels:
    app: pftransactional-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pftransactional-service
  template:
    metadata:
      labels:
        app: pftransactional-service
        tier: backend
    spec:
      containers:
        - name: pftransactional-service
          image: ${REGISTRY}/pftransactional-service:${TAG}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pf-config
          env:
            - name: ConnectionStrings__PFTransactionalDb
              valueFrom:
                secretKeyRef:
                  name: pf-secrets
                  key: sqlserver-connection-pftransactional
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: pf-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: pf-secrets
                  key: rabbitmq-password
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: pf-secrets
                  key: jwt-secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: pftransactional-service
  namespace: pf-services
spec:
  selector:
    app: pftransactional-service
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
