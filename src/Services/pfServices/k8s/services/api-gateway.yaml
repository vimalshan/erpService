apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: pf-services
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      containers:
        - name: api-gateway
          image: ${REGISTRY}/api-gateway:${TAG}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pf-config
          env:
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: pf-secrets
                  key: jwt-secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: pf-services
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
