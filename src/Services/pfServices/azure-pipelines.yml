# Azure DevOps Pipeline - pfServices
# Builds and pushes all 11 service images to GHCR.
# Registry: ghcr.io/$(githubOwner)/erp/<service-name>
#
# Setup required (once):
#   Project Settings -> Service connections -> New -> Docker Registry
#   Name: ghcr-service-connection  Type: Other  Registry: ghcr.io
#   Username: <github-username>   Password: <GitHub PAT with packages:write>

name: Build & Push pfServices

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/Services/pfServices/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/Services/pfServices/**

parameters:
  - name: service
    displayName: Service to build
    type: string
    default: all
    values:
      - all
      - api-gateway
      - accounting-service
      - bank-service
      - contribution-service
      - investment-service
      - loan-service
      - masterdata-service
      - member-service
      - pf-transaction-service
      - settlement-service
      - trust-service

  - name: pushImage
    displayName: Push image to GHCR
    type: boolean
    default: true

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

# ── Stages ────────────────────────────────────────────────────────────────────
stages:
  - stage: Build
    displayName: Build Docker Images
    jobs:
      - job: BuildImages
        displayName: Build
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/pfServices/apiGateway'
              dockerfile: 'src/Services/pfServices/apiGateway/Dockerfile'
            accounting_service:
              imageName: 'accounting-service'
              context: 'src/Services/pfServices/accountingServices'
              dockerfile: 'src/Services/pfServices/accountingServices/Dockerfile'
            bank_service:
              imageName: 'bank-service'
              context: 'src/Services/pfServices/bankServices/BankService'
              dockerfile: 'src/Services/pfServices/bankServices/BankService/Dockerfile'
            contribution_service:
              imageName: 'contribution-service'
              context: 'src/Services/pfServices/contributionServices/ContributionService'
              dockerfile: 'src/Services/pfServices/contributionServices/ContributionService/Dockerfile'
            investment_service:
              imageName: 'investment-service'
              context: 'src/Services/pfServices/investmentServices/InvestmentService'
              dockerfile: 'src/Services/pfServices/investmentServices/InvestmentService/Dockerfile'
            loan_service:
              imageName: 'loan-service'
              context: 'src/Services/pfServices/loanServices'
              dockerfile: 'src/Services/pfServices/loanServices/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/pfServices/masterdataServices/MasterDataService'
              dockerfile: 'src/Services/pfServices/masterdataServices/MasterDataService/Dockerfile'
            member_service:
              imageName: 'member-service'
              context: 'src/Services/pfServices/memberServices'
              dockerfile: 'src/Services/pfServices/memberServices/Dockerfile'
            pf_transaction_service:
              imageName: 'pf-transaction-service'
              context: 'src/Services/pfServices/pftransactionalServices'
              dockerfile: 'src/Services/pfServices/pftransactionalServices/Dockerfile'
            settlement_service:
              imageName: 'settlement-service'
              context: 'src/Services/pfServices/settlementServices'
              dockerfile: 'src/Services/pfServices/settlementServices/Dockerfile'
            trust_service:
              imageName: 'trust-service'
              context: 'src/Services/pfServices/trustServices/TrustService'
              dockerfile: 'src/Services/pfServices/trustServices/TrustService/Dockerfile'

        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: build
              repository: $(imagePrefix)/$(imageName)
              dockerfile: $(dockerfile)
              buildContext: $(context)
              tags: |
                $(tag)
                latest

  - stage: Push
    displayName: Push to GHCR
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', true))
    jobs:
      - job: PushImages
        displayName: Push
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/pfServices/apiGateway'
              dockerfile: 'src/Services/pfServices/apiGateway/Dockerfile'
            accounting_service:
              imageName: 'accounting-service'
              context: 'src/Services/pfServices/accountingServices'
              dockerfile: 'src/Services/pfServices/accountingServices/Dockerfile'
            bank_service:
              imageName: 'bank-service'
              context: 'src/Services/pfServices/bankServices/BankService'
              dockerfile: 'src/Services/pfServices/bankServices/BankService/Dockerfile'
            contribution_service:
              imageName: 'contribution-service'
              context: 'src/Services/pfServices/contributionServices/ContributionService'
              dockerfile: 'src/Services/pfServices/contributionServices/ContributionService/Dockerfile'
            investment_service:
              imageName: 'investment-service'
              context: 'src/Services/pfServices/investmentServices/InvestmentService'
              dockerfile: 'src/Services/pfServices/investmentServices/InvestmentService/Dockerfile'
            loan_service:
              imageName: 'loan-service'
              context: 'src/Services/pfServices/loanServices'
              dockerfile: 'src/Services/pfServices/loanServices/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/pfServices/masterdataServices/MasterDataService'
              dockerfile: 'src/Services/pfServices/masterdataServices/MasterDataService/Dockerfile'
            member_service:
              imageName: 'member-service'
              context: 'src/Services/pfServices/memberServices'
              dockerfile: 'src/Services/pfServices/memberServices/Dockerfile'
            pf_transaction_service:
              imageName: 'pf-transaction-service'
              context: 'src/Services/pfServices/pftransactionalServices'
              dockerfile: 'src/Services/pfServices/pftransactionalServices/Dockerfile'
            settlement_service:
              imageName: 'settlement-service'
              context: 'src/Services/pfServices/settlementServices'
              dockerfile: 'src/Services/pfServices/settlementServices/Dockerfile'
            trust_service:
              imageName: 'trust-service'
              context: 'src/Services/pfServices/trustServices/TrustService'
              dockerfile: 'src/Services/pfServices/trustServices/TrustService/Dockerfile'

        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - task: Docker@2
            displayName: Push $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
            inputs:
              command: push
              repository: $(imagePrefix)/$(imageName)
              tags: |
                $(tag)
                latest

  - stage: Verify
    displayName: Smoke Test
    dependsOn: Push
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SmokeTest
        displayName: Verify images
        strategy:
          matrix:
            api_gateway:
              imageName: 'api-gateway'
              context: 'src/Services/pfServices/apiGateway'
              dockerfile: 'src/Services/pfServices/apiGateway/Dockerfile'
            accounting_service:
              imageName: 'accounting-service'
              context: 'src/Services/pfServices/accountingServices'
              dockerfile: 'src/Services/pfServices/accountingServices/Dockerfile'
            bank_service:
              imageName: 'bank-service'
              context: 'src/Services/pfServices/bankServices/BankService'
              dockerfile: 'src/Services/pfServices/bankServices/BankService/Dockerfile'
            contribution_service:
              imageName: 'contribution-service'
              context: 'src/Services/pfServices/contributionServices/ContributionService'
              dockerfile: 'src/Services/pfServices/contributionServices/ContributionService/Dockerfile'
            investment_service:
              imageName: 'investment-service'
              context: 'src/Services/pfServices/investmentServices/InvestmentService'
              dockerfile: 'src/Services/pfServices/investmentServices/InvestmentService/Dockerfile'
            loan_service:
              imageName: 'loan-service'
              context: 'src/Services/pfServices/loanServices'
              dockerfile: 'src/Services/pfServices/loanServices/Dockerfile'
            masterdata_service:
              imageName: 'masterdata-service'
              context: 'src/Services/pfServices/masterdataServices/MasterDataService'
              dockerfile: 'src/Services/pfServices/masterdataServices/MasterDataService/Dockerfile'
            member_service:
              imageName: 'member-service'
              context: 'src/Services/pfServices/memberServices'
              dockerfile: 'src/Services/pfServices/memberServices/Dockerfile'
            pf_transaction_service:
              imageName: 'pf-transaction-service'
              context: 'src/Services/pfServices/pftransactionalServices'
              dockerfile: 'src/Services/pfServices/pftransactionalServices/Dockerfile'
            settlement_service:
              imageName: 'settlement-service'
              context: 'src/Services/pfServices/settlementServices'
              dockerfile: 'src/Services/pfServices/settlementServices/Dockerfile'
            trust_service:
              imageName: 'trust-service'
              context: 'src/Services/pfServices/trustServices/TrustService'
              dockerfile: 'src/Services/pfServices/trustServices/TrustService/Dockerfile'

        steps:
          - script: |
              IMAGE="$(imagePrefix)/$(imageName):latest"
              echo "Pulling $IMAGE ..."
              docker pull "$IMAGE"
              CNAME="smoke-$(imageName | tr '/' '-')"
              docker run -d --name "$CNAME" \
                -e ASPNETCORE_ENVIRONMENT=Development \
                "$IMAGE"
              sleep 10
              docker logs "$CNAME"
              docker rm -f "$CNAME"
            displayName: Smoke test $(imageName)
            condition: or(eq('${{ parameters.service }}', 'all'), eq('${{ parameters.service }}', variables['imageName']))
