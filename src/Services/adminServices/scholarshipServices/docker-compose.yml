version: '3.8'

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-scholarship-db
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./Docker/init-database.sql:/init-database.sql
      - ./Docker/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - scholarship-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: scholarship-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - scholarship-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  scholarship-service:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: scholarship-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Development'
      ASPNETCORE_URLS: 'http://+:5166'
      ConnectionStrings__ScholarshipDb: 'Data Source=mssql-server,1433;Initial Catalog=ADMINDB;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      RabbitMQ__HostName: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__VirtualHost: '/'
      RabbitMQ__ExchangeName: 'scholarship.events'
    ports:
      - "5166:5166"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - scholarship-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5166/health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5

networks:
  scholarship-network:
    driver: bridge

volumes:
  mssql_data:
