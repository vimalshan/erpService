apiVersion: v1
kind: Service
metadata:
  name: scholarship-service
  namespace: scholarship-service
  labels:
    app: scholarship-service
spec:
  type: LoadBalancer
  selector:
    app: scholarship-service
  ports:
  - name: http
    port: 80
    targetPort: 5166
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: scholarship-service-internal
  namespace: scholarship-service
  labels:
    app: scholarship-service
spec:
  type: ClusterIP
  selector:
    app: scholarship-service
  ports:
  - name: http
    port: 5166
    targetPort: 5166
    protocol: TCP
