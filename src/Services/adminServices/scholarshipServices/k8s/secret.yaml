apiVersion: v1
kind: Secret
metadata:
  name: scholarship-service-secrets
  namespace: scholarship-service
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__ScholarshipDb: "Server=sql-server.default.svc.cluster.local;Database=ADMINDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
  Jwt__Key: "ScholarshipService-SuperSecretKey-ChangeInProduction-Min32Characters!"
---
apiVersion: v1
kind: Secret
metadata:
  name: scholarship-service-docker-registry
  namespace: scholarship-service
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
