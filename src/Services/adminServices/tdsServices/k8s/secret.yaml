apiVersion: v1
kind: Secret
metadata:
  name: tds-service-secrets
  namespace: tds-service
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__TdsDb: "Server=sql-server.default.svc.cluster.local;Database=TDSDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
  Jwt__Key: "TdsService-SuperSecretKey-ChangeInProduction-Min32Characters!"
---
apiVersion: v1
kind: Secret
metadata:
  name: tds-service-docker-registry
  namespace: tds-service
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
