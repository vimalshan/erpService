apiVersion: v1
kind: Secret
metadata:
  name: transaction-service-secrets
  namespace: transaction-service
  labels:
    app: transaction-service
type: Opaque
stringData:
  ConnectionStrings__TransactionDb: "REPLACE_WITH_ACTUAL_CONNECTION_STRING"
  Jwt__Key: "REPLACE_WITH_A_SECURE_256_BIT_KEY"
  BlobStorage__ConnectionString: "REPLACE_WITH_ACTUAL_BLOB_STORAGE_CONNECTION_STRING"
  RabbitMQ__Password: "REPLACE_WITH_ACTUAL_PASSWORD"
