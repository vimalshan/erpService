apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: transaction-service
  labels:
    app: transaction-service
spec:
  type: LoadBalancer
  selector:
    app: transaction-service
  ports:
  - name: http
    port: 80
    targetPort: 5185
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service-internal
  namespace: transaction-service
  labels:
    app: transaction-service
spec:
  type: ClusterIP
  selector:
    app: transaction-service
  ports:
  - name: http
    port: 5185
    targetPort: 5185
    protocol: TCP
