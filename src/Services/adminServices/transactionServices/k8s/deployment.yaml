apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: transaction-service
  labels:
    app: transaction-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5185"
    spec:
      serviceAccountName: transaction-service
      securityContext:
        runAsNonRoot: false
        fsGroup: 1000
      containers:
      - name: transaction-service
        image: transaction-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5185
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: transaction-service-config
        
        env:
        - name: ConnectionStrings__TransactionDb
          valueFrom:
            secretKeyRef:
              name: transaction-service-secrets
              key: ConnectionStrings__TransactionDb
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: transaction-service-secrets
              key: Jwt__Key
        - name: BlobStorage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: transaction-service-secrets
              key: BlobStorage__ConnectionString
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: config
        configMap:
          name: transaction-service-config
      - name: logs
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - transaction-service
              topologyKey: kubernetes.io/hostname
