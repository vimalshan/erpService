apiVersion: v1
kind: Secret
metadata:
  name: finyear-api-secrets
  namespace: finyear-api
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__AdminDbConnection: "Server=sql-server.default.svc.cluster.local;Database=ADMINDB;User Id=sa;Password=YourPassword123!;"
  Jwt__SecretKey: "your-super-secret-key-change-this-in-production-minimum-32-characters"
---
apiVersion: v1
kind: Secret
metadata:
  name: finyear-api-docker-registry
  namespace: finyear-api
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
