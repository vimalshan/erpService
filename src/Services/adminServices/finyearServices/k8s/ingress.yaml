apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finyear-api-ingress
  namespace: finyear-api
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - finyear-api.example.com
    secretName: finyear-api-tls
  rules:
  - host: finyear-api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finyear-api
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finyear-api-network-policy
  namespace: finyear-api
spec:
  podSelector:
    matchLabels:
      app: finyear-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: finyear-api
    - podSelector:
        matchLabels:
          app: finyear-api-client
    ports:
    - protocol: TCP
      port: 5000
    - protocol: TCP
      port: 5001
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: finyear-api
    ports:
    - protocol: TCP
      port: 1433
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
