apiVersion: v1
kind: Secret
metadata:
  name: stationery-service-secrets
  namespace: stationery-service
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__DefaultConnection: "Server=sql-server.default.svc.cluster.local;Database=STATIONERYDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;Connection Timeout=30;"
  Jwt__Key: "StationeryService-SuperSecretKey-ChangeInProduction-Min32Characters!"
---
apiVersion: v1
kind: Secret
metadata:
  name: stationery-service-docker-registry
  namespace: stationery-service
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
