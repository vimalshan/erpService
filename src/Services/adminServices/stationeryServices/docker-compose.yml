services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-stationery-db
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
      MSSQL_AGENT_ENABLED: 'true'
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./Docker/init-database.sql:/init-database.sql
      - ./Docker/entrypoint.sh:/entrypoint.sh
    entrypoint: /bin/bash
    command: /entrypoint.sh
    networks:
      - stationery-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "127.0.0.1", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    container_name: stationery-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - stationery-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  stationery-service:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: stationery-service
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:5181'
      ConnectionStrings__DefaultConnection: 'Data Source=mssql-server,1433;Initial Catalog=STATIONERYDB;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
      RabbitMQ__Host: 'rabbitmq'
      RabbitMQ__Port: '5672'
      RabbitMQ__Username: 'guest'
      RabbitMQ__Password: 'guest'
      RabbitMQ__Enabled: 'true'
    ports:
      - "5181:5181"
    depends_on:
      mssql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - stationery-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5181/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

networks:
  stationery-network:
    driver: bridge

volumes:
  mssql_data:
