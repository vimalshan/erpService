apiVersion: v1
kind: Secret
metadata:
  name: vendor-service-secrets
  namespace: vendor-service
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__VendorDb: "Server=sql-server.default.svc.cluster.local;Database=VENDORDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
  Jwt__Key: "VendorService-SuperSecretKey-ChangeInProduction-Min32Characters!"
---
apiVersion: v1
kind: Secret
metadata:
  name: vendor-service-docker-registry
  namespace: vendor-service
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
