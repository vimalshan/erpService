apiVersion: v1
kind: Service
metadata:
  name: vendor-service
  namespace: vendor-service
  labels:
    app: vendor-service
spec:
  type: LoadBalancer
  selector:
    app: vendor-service
  ports:
  - name: http
    port: 80
    targetPort: 5181
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: vendor-service-internal
  namespace: vendor-service
  labels:
    app: vendor-service
spec:
  type: ClusterIP
  selector:
    app: vendor-service
  ports:
  - name: http
    port: 5181
    targetPort: 5181
    protocol: TCP
