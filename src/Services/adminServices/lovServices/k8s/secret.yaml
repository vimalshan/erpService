apiVersion: v1
kind: Secret
metadata:
  name: lov-service-secrets
  namespace: lov-service
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__LovDb: "Server=sql-server.default.svc.cluster.local;Database=LOVDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
  Jwt__Key: "LovService-SuperSecretKey-ChangeInProduction-Min32Characters!"
---
apiVersion: v1
kind: Secret
metadata:
  name: lov-service-docker-registry
  namespace: lov-service
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
