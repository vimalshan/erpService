version: '3.8'

services:
  mssql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-location-db
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123!'
      MSSQL_PID: 'Express'
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - location-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword123!", "-No", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  location-services:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: location-services
    environment:
      ASPNETCORE_ENVIRONMENT: 'Production'
      ASPNETCORE_URLS: 'http://+:7136'
      ConnectionStrings__LocationDb: 'Data Source=mssql-server,1433;Initial Catalog=LOCATIONDB;User ID=sa;Password=YourPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;'
    ports:
      - "7136:7136"
    depends_on:
      mssql-server:
        condition: service_healthy
    networks:
      - location-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7136/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  location-network:
    driver: bridge

volumes:
  mssql_data:
