apiVersion: v1
kind: Secret
metadata:
  name: location-services-secrets
  namespace: location-services
type: Opaque
stringData:
  # Update these values with your actual secrets
  ConnectionStrings__LocationDb: "Server=sql-server.default.svc.cluster.local;Database=LOCATIONDB;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;"
  Jwt__Secret: "LocationServicesJwtSecret_ChangeInProduction_Min32Characters!"
---
apiVersion: v1
kind: Secret
metadata:
  name: location-services-docker-registry
  namespace: location-services
type: kubernetes.io/dockercfg
data:
  # For private docker registry, add credentials here if needed
  .dockercfg: {}
