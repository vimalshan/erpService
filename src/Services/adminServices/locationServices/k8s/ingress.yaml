apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: location-services-ingress
  namespace: location-services
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - location-services.example.com
    secretName: location-services-tls
  rules:
  - host: location-services.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: location-services
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: location-services-network-policy
  namespace: location-services
spec:
  podSelector:
    matchLabels:
      app: location-services
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: location-services
    - podSelector:
        matchLabels:
          app: location-services-client
    ports:
    - protocol: TCP
      port: 7136
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 7136
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: location-services
    ports:
    - protocol: TCP
      port: 1433
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
