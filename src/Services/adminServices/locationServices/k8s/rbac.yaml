---
apiVersion: v1
kind: Namespace
metadata:
  name: location-services
  labels:
    name: location-services
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: location-services
  namespace: location-services
  labels:
    app: location-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: location-services-role
  namespace: location-services
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["location-services-config"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["location-services-secrets"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: location-services-rolebinding
  namespace: location-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: location-services-role
subjects:
- kind: ServiceAccount
  name: location-services
  namespace: location-services
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: location-services-pdb
  namespace: location-services
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: location-services
