version: '3.8'

services:
  # SQL Server for Application
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: approval-service-mssql
    environment:
      SA_PASSWORD: "YourPassword@123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - approval-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "SA", "-P", "YourPassword@123", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for Messaging
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: approval-service-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - approval-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Azure Storage Emulator (Azurite)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: approval-service-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - azurite-data:/data
    networks:
      - approval-network
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

volumes:
  mssql-data:
  rabbitmq-data:
  azurite-data:

networks:
  approval-network:
    driver: bridge
