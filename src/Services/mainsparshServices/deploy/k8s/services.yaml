# ==========================================
# SRF Sparsh Microservices - K8s Deployments
# ==========================================

# --- API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: srfsparsh
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      containers:
        - name: api-gateway
          image: srfsparsh/api-gateway:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: srfsparsh-config
          env:
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: srfsparsh-secrets
                  key: jwt-secret-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: srfsparsh
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer

---
# --- Approval Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-service
  namespace: srfsparsh
  labels:
    app: approval-service
    tier: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: approval-service
  template:
    metadata:
      labels:
        app: approval-service
        tier: service
    spec:
      containers:
        - name: approval-service
          image: srfsparsh/approval-service:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: srfsparsh-config
          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver;Database=SRFSPARSHDB;User Id=sa;Password=$(SQL_SA_PASSWORD);Encrypt=True;TrustServerCertificate=True"
            - name: SQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srfsparsh-secrets
                  key: sql-sa-password
            - name: RabbitMq__HostName
              value: "rabbitmq"
            - name: RabbitMq__UserName
              value: "srfsparsh"
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: srfsparsh-secrets
                  key: rabbitmq-password
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: srfsparsh-secrets
                  key: jwt-secret-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: approval-service
  namespace: srfsparsh
spec:
  selector:
    app: approval-service
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

