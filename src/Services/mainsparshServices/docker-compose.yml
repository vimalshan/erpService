# ==========================================
# SRF Sparsh Microservices - Docker Compose
# 14 Microservices + API Gateway + Infrastructure
# ==========================================

services:

  # ==========================================
  # INFRASTRUCTURE
  # ==========================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: srfsparsh-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./deploy/db:/docker-entrypoint-initdb.d
    networks:
      - srfsparsh-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: srfsparsh-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    networks:
      - srfsparsh-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: srfsparsh-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - srfsparsh-network
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: srfsparsh-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - srfsparsh-network
    restart: unless-stopped

  # ==========================================
  # DB INIT (runs once)
  # ==========================================

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: srfsparsh-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - ./deploy/db:/scripts
    entrypoint: /bin/bash
    command: >
      -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '$${MSSQL_SA_PASSWORD}' -C -i /scripts/init-db.sql && echo 'DB init complete'"
    networks:
      - srfsparsh-network
    restart: "no"

  # ==========================================
  # API GATEWAY
  # ==========================================

  api-gateway:
    build:
      context: ./apiGateway
      dockerfile: Dockerfile
    image: srfsparsh/api-gateway:${IMAGE_TAG:-latest}
    container_name: srfsparsh-api-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
    ports:
      - "5100:80"
    depends_on:
      - approval-service
      - booking-service
      - community-service
      - compensation-service
      - groupmanagement-service
      - location-service
      - meeting-service
      - proxy-service
      - reimbursement-service
      - stipend-service
      - timesheet-service
      - transaction-service
      - usermanagement-service
      - websitecontent-service
    networks:
      - srfsparsh-network
    restart: unless-stopped

  # ==========================================
  # MICROSERVICES
  # ==========================================

  approval-service:
    build:
      context: ./approvalServices
      dockerfile: Dockerfile
    image: srfsparsh/approval-service:${IMAGE_TAG:-latest}
    container_name: srfsparsh-approval
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SRFSPARSHDB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - srfsparsh-network
    restart: unless-stopped

  booking-service:
    build:
      context: ./bookingServices
      dockerfile: Dockerfile
    image: srfsparsh/booking-service:${IMAGE_TAG:-latest}
    container_name: srfsparsh-booking
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BookingDb: "Server=sqlserver;Database=SRFSPARSHDB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - srfsparsh-network
    restart: unless-stopped

  community-service:
