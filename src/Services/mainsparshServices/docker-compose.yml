      context: ./communityServices
      dockerfile: Dockerfile
    image: srfsparsh/community-service:${IMAGE_TAG:-latest}
    container_name: srfsparsh-community
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SRFSPARSHDB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      Jwt__SigningKey: ${JWT_SECRET_KEY}
    depends_on:
