    networks:
      - srfsparsh-network
    restart: unless-stopped

  location-service:
    build:
      context: ./locationServices
      dockerfile: Dockerfile
    image: srfsparsh/location-service:${IMAGE_TAG:-latest}
    container_name: srfsparsh-location
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SRFSPARSHDB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      CacheSettings__UseRedis: "true"
      CacheSettings__RedisConnection: "redis:6379,password=${REDIS_PASSWORD}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - srfsparsh-network
    restart: unless-stopped

  meeting-service:
