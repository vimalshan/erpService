# ==========================================
# NETWORKS & VOLUMES
# ==========================================

networks:
  srfsparsh-network:
    driver: bridge
    name: srfsparsh-network

volumes:
  sqlserver-data:
  rabbitmq-data:
  redis-data:
  azurite-data:
