# =============================================================================
# TEST PIPELINE — sparshServices  (6 services)
#
# Purpose : Validate Build → Push (GHCR) → Verify for one module.
# Trigger : MANUAL ONLY — will never run automatically.
#
# Required pipeline variables (Azure DevOps → Pipeline → Edit → Variables):
#   GITHUB_ACTOR  – your GitHub username  (vimalshan)
#   GITHUB_TOKEN  – GitHub PAT with packages:write scope  (mark secret)
# =============================================================================

name: TEST · sparshServices · $(Build.BuildId)

trigger: none
pr: none

parameters:
  - name: service
    displayName: 'Service to build (or "all")'
    type: string
    default: all
    values:
      - all
      - api-gateway
      - employeepridemanagement-service
      - mobileappmanagement-service
      - mobileexpense-service
      - problemmanagement-service
      - sparsh-transaction-service

variables:
  imagePrefix: 'ghcr.io/vimalshan/erp'

pool:
  vmImage: ubuntu-latest

stages:

  # ── BUILD ──────────────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build · sparshServices'
    jobs:
      - job: BuildImages
        displayName: Build Docker images
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -e
              build_svc() {
                local NAME=$1 CTX=$2 DF=$3
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Building $NAME ======="
                  docker build \
                    -t "$(imagePrefix)/$NAME:$(Build.BuildId)" \
                    -t "$(imagePrefix)/$NAME:latest" \
                    -f "$DF" "$CTX"
                fi
              }
              build_svc 'api-gateway' 'src/Services/sparshServices/apigateway/SparshApiGateway' 'src/Services/sparshServices/apigateway/SparshApiGateway/Dockerfile'
              build_svc 'employeepridemanagement-service' 'src/Services/sparshServices/employeepridemanagementServices' 'src/Services/sparshServices/employeepridemanagementServices/Dockerfile'
              build_svc 'mobileappmanagement-service' 'src/Services/sparshServices/mobileappmanagementServices' 'src/Services/sparshServices/mobileappmanagementServices/Dockerfile'
              build_svc 'mobileexpense-service' 'src/Services/sparshServices/mobileexpenseServices' 'src/Services/sparshServices/mobileexpenseServices/Dockerfile'
              build_svc 'problemmanagement-service' 'src/Services/sparshServices/problemmanagementServices/ProblemManagement' 'src/Services/sparshServices/problemmanagementServices/ProblemManagement/Dockerfile'
              build_svc 'sparsh-transaction-service' 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional' 'src/Services/sparshServices/sparshtransactionalServices/SparshTransactional/Dockerfile'
            displayName: 'docker build all selected services'

  # ── PUSH ───────────────────────────────────────────────────────────────────
  - stage: Push
    displayName: 'Push · sparshServices → GHCR'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushImages
        displayName: Push to GHCR
        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              push_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  echo "======= Pushing $NAME ======="
                  docker push "$(imagePrefix)/$NAME:$(Build.BuildId)"
                  docker push "$(imagePrefix)/$NAME:latest"
                fi
              }
              push_svc 'api-gateway'
              push_svc 'employeepridemanagement-service'
              push_svc 'mobileappmanagement-service'
              push_svc 'mobileexpense-service'
              push_svc 'problemmanagement-service'
              push_svc 'sparsh-transaction-service'
            displayName: 'docker push all selected services'

  # ── VERIFY ─────────────────────────────────────────────────────────────────
  - stage: Verify
    displayName: 'Verify · sparshServices'
    dependsOn: Push
    condition: succeeded()
    jobs:
      - job: VerifyImages
        displayName: Verify images exist in GHCR
        steps:
          - checkout: none

          - script: |
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_ACTOR: $(GITHUB_ACTOR)

          - script: |
              set -e
              verify_svc() {
                local NAME=$1
                if [ "${{ parameters.service }}" = "all" ] || [ "${{ parameters.service }}" = "$NAME" ]; then
                  IMAGE="$(imagePrefix)/$NAME:$(Build.BuildId)"
                  echo "======= Verifying $IMAGE ======="
                  docker pull "$IMAGE"
                  echo "OK: $IMAGE"
                fi
              }
              verify_svc 'api-gateway'
              verify_svc 'employeepridemanagement-service'
              verify_svc 'mobileappmanagement-service'
              verify_svc 'mobileexpense-service'
              verify_svc 'problemmanagement-service'
              verify_svc 'sparsh-transaction-service'
            displayName: 'Pull & verify all selected images'
